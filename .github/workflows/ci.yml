name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (mosquitto for e2e tests)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mosquitto mosquitto-clients

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "paho-mqtt>=1.6,<3" "pyyaml>=5.4" "flask>=1.1"

      - name: Syntax check (compile all .py)
        run: |
          python -m compileall -q wb_energy_meter

      - name: Start mosquitto for e2e tests
        run: |
          cat > /tmp/mosquitto.conf <<EOF
          listener 1883
          allow_anonymous true
          persistence false
          log_type error
          log_dest stderr
          EOF
          mosquitto -c /tmp/mosquitto.conf -d
          sleep 1
          # smoke check
          mosquitto_pub -h 127.0.0.1 -t test/ci -m hello
          mosquitto_sub -h 127.0.0.1 -t test/ci -C 1 -W 5 &
          sleep 0.5

      - name: Run unit tests (consumption / periods)
        run: python tests/test_step3_consumption.py

      - name: Run unit tests (aggregator)
        run: python tests/test_step4_aggregator.py

      - name: Run unit tests (Flask API)
        run: python tests/test_step5_flask_api.py

      - name: Run unit tests (web UI)
        run: python tests/test_step6_webui.py

      - name: Run unit tests (группы/зоны)
        run: python tests/test_step8_groups.py

      - name: Run unit tests (словарь каналов)
        run: python tests/test_step8_channels.py

      - name: Run unit tests (самообновление)
        run: python tests/test_step9_updater.py

      - name: Run unit tests (канал Uptime / wb-mqtt-serial.conf)
        run: python tests/test_step10_wbserial.py

      # Кавычки обязательны: незакавыченное значение с ": " внутри — это
      # невалидный YAML, и GitHub Actions не запускает workflow ЦЕЛИКОМ,
      # молча, без единого прогона. Так CI простоял сломанным весь v0.11.0.
      - name: "Run unit tests (план объекта: зоны и связи)"
        run: python tests/test_step11_plan.py

      - name: Run unit tests (самопроверка интерфейса + заглушка)
        run: python tests/test_step12_selfcheck.py

      # Кавычки обязательны везде ниже, где в имени шага есть ": " —
      # незакавыченное значение с ": " внутри делает YAML невалидным, и
      # GitHub Actions молча не запускает workflow ЦЕЛИКОМ (см. пример
      # выше про test_step11 — так CI простоял сломанным весь v0.11.0).
      - name: "Run unit tests (доменная модель v2: контракт учёта)"
        run: python tests/test_step13_accounting_contract.py

      - name: "Run unit tests (доменная модель v2: легаси-сценарии)"
        run: python tests/test_step13_legacy_scenarios.py

      - name: "Run unit tests (v2: точки учёта и места)"
        run: python tests/test_step14_point_location_repo.py

      - name: "Run unit tests (v2: привязка счётчиков к точкам)"
        run: python tests/test_step15_binding_service.py

      - name: "Run unit tests (v2: электросеть/топология)"
        run: python tests/test_step16_topology_service.py

      - name: "Run unit tests (v2: расчёт баланса)"
        run: python tests/test_step17_accounting_service.py

      - name: "Run unit tests (v2: HTTP-слой /api/v2)"
        run: python tests/test_step18_api_v2.py

      - name: "Run unit tests (v2: перенос легаси-данных)"
        run: python tests/test_step19_legacy_migration.py

      - name: "Run unit tests (v2: carry-forward для no_data)"
        run: python tests/test_step20_carry_forward.py

      - name: "Run unit tests (v2: план объекта)"
        run: python tests/test_step21_plan_v2.py

      - name: "Run unit tests (v2: генерация домена/откат)"
        run: python tests/test_step22_domain_generation.py

      - name: "Run unit tests (v2: снимок текущих значений)"
        run: python tests/test_step23_snapshot.py

      - name: "Run unit tests (v2: группы верхнего уровня)"
        run: python tests/test_step24_group_repo_v2.py

      - name: "Run unit tests (v2: HTTP-слой /api/v2/groups)"
        run: python tests/test_step25_api_v2_groups.py

      - name: "Run unit tests (v2: протокол ревизий, партия 2)"
        run: python tests/test_step26_revision_protocol.py

      - name: "Run unit tests (v2: сводка Обзора, партия 2)"
        run: python tests/test_step27_overview_summary.py

      - name: "Run unit tests (v2: отчёты/CSV, партия 2)"
        run: python tests/test_step28_reports_query.py

      - name: "Run unit tests (v2: провижининг прибора при замене, партия 3)"
        run: python tests/test_step29_replace_meter_provisioning.py

      - name: "Run unit tests (v2: сводка незавершённой настройки, партия 3)"
        run: python tests/test_step30_validation_summary.py

      - name: "Run unit tests (v2: мастер переноса legacy-связей, партия 3)"
        run: python tests/test_step31_migration_wizard.py

      - name: "Run unit tests (v2: поиск экрана Структура, партия 3)"
        run: python tests/test_step32_structure_search.py

      - name: "Run unit tests (v2: создание первой привязки прибора, партия 5)"
        run: python tests/test_step33_open_binding_route.py

      - name: "Run unit tests (v2: e2e создание структуры с чистой БД, партия 5)"
        run: python tests/test_step34_e2e_ui_creation_path.py

      - name: "Run unit tests (v2: редактирование места точки, партия 5)"
        run: python tests/test_step35_edit_point_location.py

      - name: "Run unit tests (v2: простой режим ввод/питается от, партия 6)"
        run: python tests/test_step36_simple_mode.py

      - name: "Run unit tests (v2: полигоны мест и починка placed_on_plan, партия 6)"
        run: python tests/test_step37_plan_polygons.py

      - name: "Run unit tests (v2: инлайн-переименование мест, партия 6)"
        run: python tests/test_step38_location_rename.py

      - name: "Run unit tests (v2: План v3 — узлы на карте, партия 6)"
        run: python tests/test_step39_plan_v3.py

      - name: Run e2e tests (wb-mqtt-db RPC against fake)
        run: python tests/test_step3_e2e.py

      - name: Run full daemon e2e test (Step 3)
        run: python tests/test_step3_daemon.py

      - name: Run full daemon e2e test (Step 4 — aggregator catch-up)
        run: python tests/test_step4_daemon.py

      - name: Stop mosquitto
        if: always()
        run: |
          pkill -f "mosquitto -c /tmp/mosquitto.conf" || true

  # Версии библиотек ровно те, что стоят на боевом контроллере: Wiren
  # Board 8.x — это Debian bullseye, где Flask и Werkzeug приходят из
  # apt (python3-flask, python3-werkzeug), а не из pip. Обычная матрица
  # выше ставит СВЕЖИЙ Flask и поэтому слепа к несовместимостям со
  # старым.
  #
  # Так уже дважды теряли рабочий контроллер:
  #   * 09.09.2026 — `from werkzeug.utils import safe_join`: в Werkzeug
  #     1.0.1 функция лежит в `werkzeug.security`, маршрут статики отдавал
  #     500, alpine.min.js не грузился, весь интерфейс становился белым
  #     экраном без единой ошибки в логе;
  #   * тогда же — `wait_for_publish(timeout=...)` в paho-mqtt старее 1.5.1.
  #
  # Если этот job упал, а матрица выше зелёная — вы написали код,
  # который работает у вас и не работает на объекте.
  legacy-deps:
    name: Versions as on the controller (Debian bullseye)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install pinned old dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "flask==1.1.2" "werkzeug==1.0.1" \
                      "jinja2<3" "itsdangerous<2" "markupsafe<2" \
                      "paho-mqtt>=1.6,<3" "pyyaml>=5.4"
          python -c "import flask, werkzeug; print('flask', flask.__version__, '/ werkzeug', werkzeug.__version__)"

      - name: Syntax check
        run: python -m compileall -q wb_energy_meter

      - name: Run offline tests on old Flask
        run: |
          python tests/test_step3_consumption.py
          python tests/test_step4_aggregator.py
          python tests/test_step5_flask_api.py
          python tests/test_step6_webui.py
          python tests/test_step8_groups.py
          python tests/test_step8_channels.py
          python tests/test_step9_updater.py
          python tests/test_step10_wbserial.py
          python tests/test_step11_plan.py
          python tests/test_step12_selfcheck.py
          python tests/test_step13_accounting_contract.py
          python tests/test_step13_legacy_scenarios.py
          python tests/test_step14_point_location_repo.py
          python tests/test_step15_binding_service.py
          python tests/test_step16_topology_service.py
          python tests/test_step17_accounting_service.py
          python tests/test_step18_api_v2.py
          python tests/test_step19_legacy_migration.py
          python tests/test_step20_carry_forward.py
          python tests/test_step21_plan_v2.py
          python tests/test_step22_domain_generation.py
          python tests/test_step23_snapshot.py
          python tests/test_step24_group_repo_v2.py
          python tests/test_step25_api_v2_groups.py
          python tests/test_step26_revision_protocol.py
          python tests/test_step27_overview_summary.py
          python tests/test_step28_reports_query.py
          python tests/test_step29_replace_meter_provisioning.py
          python tests/test_step30_validation_summary.py
          python tests/test_step31_migration_wizard.py
          python tests/test_step32_structure_search.py
          python tests/test_step33_open_binding_route.py
          python tests/test_step34_e2e_ui_creation_path.py
          python tests/test_step35_edit_point_location.py
          python tests/test_step36_simple_mode.py
          python tests/test_step37_plan_polygons.py
          python tests/test_step38_location_rename.py
          python tests/test_step39_plan_v3.py

  lint:
    name: Basic checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check pyproject.toml is valid
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist --wheel --outdir /tmp/dist .

      - name: Verify install.sh syntax
        run: bash -n scripts/install.sh

      - name: Verify uninstall.sh syntax
        run: bash -n scripts/uninstall.sh

      - name: Verify self-update.sh syntax
        run: bash -n scripts/self-update.sh

  browser:
    name: Browser (Playwright/Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "paho-mqtt>=1.6,<3" "pyyaml>=5.4" "flask>=1.1" playwright

      # Playwright — только тестовая зависимость, в рантайм не входит (AGENTS.md).
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run browser scenarios (tests/browser/run.py)
        run: python tests/browser/run.py

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshots
          path: tests/browser/_shots/
          if-no-files-found: ignore

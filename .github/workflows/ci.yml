name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (mosquitto for e2e tests)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mosquitto mosquitto-clients

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "paho-mqtt>=1.6,<3" "pyyaml>=5.4" "flask>=1.1"

      - name: Syntax check (compile all .py)
        run: |
          python -m compileall -q wb_energy_meter

      - name: Start mosquitto for e2e tests
        run: |
          cat > /tmp/mosquitto.conf <<EOF
          listener 1883
          allow_anonymous true
          persistence false
          log_type error
          log_dest stderr
          EOF
          mosquitto -c /tmp/mosquitto.conf -d
          sleep 1
          # smoke check
          mosquitto_pub -h 127.0.0.1 -t test/ci -m hello
          mosquitto_sub -h 127.0.0.1 -t test/ci -C 1 -W 5 &
          sleep 0.5

      # Партия 10, этап D (F2): единый раннер tests/run_all.py заменил
      # 45 отдельных шагов "python tests/test_stepNN_*.py" (по одному на
      # файл, руками) — раньше это уже приводило к реальному пропуску:
      # test_step40/test_step41 (партия 7) не были зарегистрированы ни в
      # одном job'е ci.yml до партии 8, где это заметили случайно.
      # run_all.py ходит по диску сам (glob) и сам же проверяет, что
      # ничего не потерялось при отборе (см. докстринг файла и
      # tests/test_step48_runner.py) — новый tests/test_stepNN_*.py
      # подхватывается автоматически, без правки этого файла. Брокер
      # mosquitto к этому моменту уже поднят и прошёл smoke-проверку
      # выше — run_all.py сам обнаруживает его на 127.0.0.1:1883 и
      # включает три теста, которым он нужен (*_daemon.py, *_e2e.py), в
      # общий прогон.
      - name: Run all unit tests (tests/run_all.py)
        run: python tests/run_all.py

      - name: Stop mosquitto
        if: always()
        run: |
          pkill -f "mosquitto -c /tmp/mosquitto.conf" || true

  # Версии библиотек ровно те, что стоят на боевом контроллере: Wiren
  # Board 8.x — это Debian bullseye, где Flask и Werkzeug приходят из
  # apt (python3-flask, python3-werkzeug), а не из pip. Обычная матрица
  # выше ставит СВЕЖИЙ Flask и поэтому слепа к несовместимостям со
  # старым.
  #
  # Так уже дважды теряли рабочий контроллер:
  #   * 09.09.2026 — `from werkzeug.utils import safe_join`: в Werkzeug
  #     1.0.1 функция лежит в `werkzeug.security`, маршрут статики отдавал
  #     500, alpine.min.js не грузился, весь интерфейс становился белым
  #     экраном без единой ошибки в логе;
  #   * тогда же — `wait_for_publish(timeout=...)` в paho-mqtt старее 1.5.1.
  #
  # Если этот job упал, а матрица выше зелёная — вы написали код,
  # который работает у вас и не работает на объекте.
  legacy-deps:
    name: Versions as on the controller (Debian bullseye)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install pinned old dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "flask==1.1.2" "werkzeug==1.0.1" \
                      "jinja2<3" "itsdangerous<2" "markupsafe<2" \
                      "paho-mqtt>=1.6,<3" "pyyaml>=5.4"
          python -c "import flask, werkzeug; print('flask', flask.__version__, '/ werkzeug', werkzeug.__version__)"

      - name: Syntax check
        run: python -m compileall -q wb_energy_meter

      # Партия 10, этап D (F2): единый раннер вместо 45 строк вручную
      # (см. тот же комментарий в job `test` выше). Здесь брокер
      # mosquitto никогда не поднимался (этот job проверяет только
      # версии Flask/Werkzeug — сети это не касается), поэтому
      # --skip-mosquitto явно, а не через автодетект: это ровно то, что
      # этот job делал и раньше (три mosquitto-теста в его перечислении
      # никогда не было — см. git-историю), только теперь явно, а не
      # молчаливым отсутствием в списке.
      - name: Run offline tests on old Flask (tests/run_all.py --skip-mosquitto)
        run: python tests/run_all.py --skip-mosquitto

  lint:
    name: Basic checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check pyproject.toml is valid
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist --wheel --outdir /tmp/dist .

      # Сборка пакета сама по себе зелёная даже если половина статики в
      # него не попала (глоб static/* не рекурсивный). Именно так после
      # партии 9 в колесе не оказалось всех 11 файлов static/js/, на
      # которые ссылается index.html.
      - name: "Собранный пакет содержит всю статику, на которую ссылается index.html"
        run: |
          python - <<'PY'
          import glob, re, sys, zipfile
          whl = sorted(glob.glob('/tmp/dist/*.whl'))[-1]
          inside = set(zipfile.ZipFile(whl).namelist())
          html = open('wb_energy_meter/static/index.html', encoding='utf-8').read()
          refs = sorted(set(re.findall(r'(?:src|href)="(/static/[^"]+)"', html)))
          missing = [r for r in refs
                     if 'wb_energy_meter/static/' + r[len('/static/'):] not in inside]
          if missing:
              print('В собранном пакете нет файлов, на которые ссылается index.html:')
              for m in missing:
                  print('  ', m)
              sys.exit(1)
          print('OK: все %d ссылок /static/ есть в пакете' % len(refs))
          PY

      - name: Verify install.sh syntax
        run: bash -n scripts/install.sh

      - name: Verify uninstall.sh syntax
        run: bash -n scripts/uninstall.sh

      - name: Verify self-update.sh syntax
        run: bash -n scripts/self-update.sh

      - name: "Verify check-generation.sh syntax (POSIX sh, партия 10)"
        run: |
          bash -n scripts/check-generation.sh
          sh -n scripts/check-generation.sh

      - name: "Syntax check static/js/*.js (F5, партия 9)"
        run: |
          for f in wb_energy_meter/static/js/*.js; do
            echo "node --check $f"
            node --check "$f"
          done

  browser:
    name: Browser (Playwright/Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "paho-mqtt>=1.6,<3" "pyyaml>=5.4" "flask>=1.1" playwright

      # Playwright — только тестовая зависимость, в рантайм не входит (AGENTS.md).
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run browser scenarios (tests/browser/run.py)
        run: python tests/browser/run.py

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshots
          path: tests/browser/_shots/
          if-no-files-found: ignore

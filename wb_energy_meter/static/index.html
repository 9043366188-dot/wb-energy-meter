      <!-- Опрос канала Uptime (ТЗ v0.10.0) -->
      <div class="settings-section">
        <h2>Опрос канала Uptime</h2>
        <div class="wbs-intro">
          WB-MAP3E отдаёт данные только когда меняется нагрузка, поэтому
          молчащий счётчик неотличим от оборванной линии. Канал
          <b>Uptime</b> растёт каждые 2 секунды и служит пульсом связи.
          Ниже — счётчики, у которых он не включён.
        </div>

        <div class="wbs-manual">
          <b>Как включить вручную</b> (работает всегда, независимо от
          кнопок ниже): Device Manager → устройство → HW Info → Uptime →
          «in queue order», затем сохранить конфигурацию.
        </div>

        <template x-if="uptimeConfigError">
          <div class="upd-banner upd-banner-warn" style="margin-top:12px">
            Проверить конфиг драйвера не удалось:
            <span x-text="uptimeConfigError"></span>
          </div>
        </template>

        <template x-if="!uptimeAllowEdit">
          <div class="wbs-note">
            Автоматическая правка выключена в конфиге сервиса
            (<code>wb_serial.allow_edit</code>). Включите канал вручную:
            Device Manager → устройство → HW Info → Uptime → in queue order.
          </div>
        </template>
        <template x-if="uptimeAllowEdit">
          <div class="wbs-note">
            Кнопка «Включить» правит <code>/etc/wb-mqtt-serial.conf</code> —
            файл, который отвечает за опрос <b>всех</b> устройств
            контроллера. Перед записью делается бэкап, отступы в файле
            будут нормализованы (4 пробела).
          </div>
        </template>

        <table class="reg-table" style="margin-top:12px">
          <thead><tr>
            <th>Счётчик</th><th style="width:130px">Состояние</th>
            <th>Пояснение</th><th style="width:140px">Действие</th>
          </tr></thead>
          <tbody>
            <template x-for="u in uptimeProblems" :key="u.device_id">
              <tr>
                <td>
                  <span x-text="u.display_name||u.device_id"></span><br>
                  <span class="muted mono" style="font-size:11px" x-text="u.device_id"></span>
                </td>
                <td>
                  <span class="badge" :style="uptimeBadgeStyle(u.state)"
                        x-text="uptimeLabel(u.state)"></span>
                </td>
                <td class="muted" style="font-size:12px" x-text="u.detail"></td>
                <td>
                  <template x-if="u.can_enable">
                    <button class="btn btn-sm btn-primary" :disabled="uptimeBusy"
                            @click="enableUptime(u.device_id)">Включить</button>
                  </template>
                  <template x-if="!u.can_enable">
                    <span class="muted" style="font-size:12px">вручную</span>
                  </template>
                </td>
              </tr>
            </template>
            <template x-if="uptimeProblems.length===0">
              <tr><td colspan="4" style="text-align:center;color:var(--txt3);padding:16px">
                Счётчиков с невключённым каналом Uptime нет.
              </td></tr>
            </template>
          </tbody>
        </table>
      </div>

      <!-- Незарегистрированные счётчики -->
      <div class="settings-section">
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px">
          <h2 style="margin:0;border:none;padding:0">Найдены в MQTT, не в реестре</h2>
          <button class="btn btn-secondary" @click="scanUnregistered()" style="font-size:12px">
            <span x-show="!scanLoading">🔍 Сканировать</span>
            <span x-show="scanLoading"><span class="spin"></span> Сканирование…</span>
          </button>
        </div>
        <template x-if="unregistered.length===0 && !scanLoading">
          <div style="color:var(--txt3);font-size:13px;padding:12px 0">
            Все счётчики из MQTT уже в реестре.
          </div>
        </template>
        <div class="unregistered-list">
          <template x-for="u in unregistered" :key="u.device_id">
            <div class="unrg-item">
              <div class="unrg-info">
                <div class="unrg-id" x-text="u.device_id"></div>
                <div class="unrg-sub">
                  <span x-text="u.mqtt_name ? 'MQTT: '+u.mqtt_name : ''"></span>
                  <span x-show="u.serial"> · серийник: <span x-text="u.serial"></span></span>
                  <span x-show="u.last_update_age_s!=null">
                    · обновление <span x-text="fmtAge(u.last_update_age_s)"></span>
                  </span>
                </div>
              </div>
              <!-- Форма быстрого добавления -->
              <template x-if="addingId !== u.device_id">
                <button class="btn btn-primary btn-sm"
                  @click="startAdd(u)">+ Добавить</button>
              </template>
              <template x-if="addingId === u.device_id">
                <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
                  <input x-model="addName" placeholder="Имя счётчика"
                         style="background:var(--bg3);border:1px solid var(--accent);
                                color:var(--txt);padding:5px 9px;border-radius:5px;
                                font-size:13px;font-family:inherit;width:180px"
                         @keydown.enter="confirmAdd(u.device_id)" @keydown.escape="addingId=null">
                  <select x-model="addGroup"
                         style="background:var(--bg3);border:1px solid var(--line);
                                color:var(--txt);padding:5px 9px;border-radius:5px;
                                font-size:13px;font-family:inherit;width:150px">
                    <option value="">— Без зоны —</option>
                    <template x-for="g in allGroups" :key="g">
                      <option :value="g" x-text="g"></option>
                    </template>
                    <option value="__new__">+ Новая зона…</option>
                  </select>
                  <template x-if="addGroup==='__new__'">
                    <input x-model="addGroupNew" placeholder="имя новой зоны"
                           style="background:var(--bg3);border:1px solid var(--accent);
                                  color:var(--txt);padding:5px 9px;border-radius:5px;
                                  font-size:13px;font-family:inherit;width:150px"
                           @keydown.enter="confirmAdd(u.device_id)" @keydown.escape="addingId=null">
                  </template>
                  <input x-model="addNotes" placeholder="Комментарий"
                         style="background:var(--bg3);border:1px solid var(--line);
                                color:var(--txt);padding:5px 9px;border-radius:5px;
                                font-size:13px;font-family:inherit;width:160px;font-style:italic"
                         @keydown.enter="confirmAdd(u.device_id)" @keydown.escape="addingId=null">
                  <button class="btn btn-success btn-sm" @click="confirmAdd(u.device_id)">✓</button>
                  <button class="btn btn-secondary btn-sm" @click="addingId=null">✕</button>
                </div>
              </template>
            </div>
          </template>
        </div>
      </div>
    </div>
  </template>


  <!-- REPORTS -->
  <template x-if="tab=='reports'">
    <div>
      <!-- Под-вкладки -->
      <div class="report-tabs">
        <button :class="{active:rMode=='vedomost'}" @click="rMode='vedomost';loadVedomost()">
          📋 Ведомость расхода
        </button>
        <button :class="{active:rMode=='profile'}" @click="rMode='profile';loadProfile()">
          📈 Профиль нагрузки
        </button>
        <button :class="{active:rMode=='compare'}" @click="rMode='compare';loadCompare()">
          ⚖ Сравнение периодов
        </button>
        <button :class="{active:rMode=='avail'}" @click="rMode='avail';loadAvail()">
          🕒 Доступность
        </button>
        <button :class="{active:rMode=='balance'}" @click="rMode='balance';loadBalance()">
          ⚡ Баланс
        </button>
      </div>

      <!-- ===== ВЕДОМОСТЬ РАСХОДА ===== -->
      <template x-if="rMode=='vedomost'">
        <div>
          <div class="report-row">
            <label>Период:</label>
            <template x-for="p in presets" :key="p.id">
              <button :class="{'periods':true,'active':rPeriod===p.id}"
                style="background:var(--bg2);border:1px solid var(--line);
                       color:var(--txt2);cursor:pointer;padding:7px 12px;
                       border-radius:6px;font-size:12px;font-weight:500"
                :style="rPeriod===p.id?'background:var(--accent);color:#fff;border-color:var(--accent)':''"
                @click="rPeriod=p.id;rFrom='';rTo='';loadVedomost()"
                x-text="p.label"></button>
            </template>
            <input type="date" x-model="rFrom"
              style="background:var(--bg2);border:1px solid var(--line);color:var(--txt);
                     padding:7px 9px;border-radius:6px;font-size:13px;font-family:inherit">
            <span class="muted">—</span>
            <input type="date" x-model="rTo"
              style="background:var(--bg2);border:1px solid var(--line);color:var(--txt);
                     padding:7px 9px;border-radius:6px;font-size:13px;font-family:inherit">
            <button style="background:var(--bg3);border:1px solid var(--line);color:var(--txt);
                           cursor:pointer;padding:7px 14px;border-radius:6px;font-size:13px"
              @click="rPeriod='';loadVedomost()">Применить</button>
            <div class="spacer"></div>
            <button class="dl-btn" @click="downloadVedomost()">⬇ Скачать CSV</button>
          </div>

          <template x-if="rLoading">
            <div class="empty"><span class="spin"></span> загрузка…</div>
          </template>

          <template x-if="!rLoading">
            <div>
              <table class="rep-table">
                <thead><tr>
                  <th>Счётчик</th>
                  <th>Комментарий</th>
                  <th class="num">Расход, кВт·ч</th>
                  <th>Качество</th>
                </tr></thead>
                <tbody>
                  <template x-for="row in vedomostRows" :key="row._key">
                    <!-- Разделитель зоны -->
                    <template x-if="row._zone_sep">
                      <tr class="zone-sep">
                        <td colspan="4">
                          <span :style="`background:${zoneColor(row._zone_sep)};
                            width:9px;height:9px;border-radius:2px;
                            display:inline-block;margin-right:7px;vertical-align:middle`"></span>
                          <span x-text="row._zone_sep"></span>
                          <span class="muted" x-text="' · ' + row._zone_kwh.toFixed(3) + ' кВт·ч'"></span>
                        </td>
                      </tr>
                    </template>
                    <!-- Строка счётчика -->
                    <template x-if="!row._zone_sep">
                      <tr>
                        <td>
                          <div style="font-weight:600;font-size:13px" x-text="row.display_name"></div>
                          <div class="muted" style="font-size:11px" x-text="row.device_id"></div>
                        </td>
                        <td class="muted" style="font-style:italic;font-size:12px"
                            x-text="row.notes||'—'"></td>
                        <td class="num" x-text="row.consumption_kwh!=null?fmt(row.consumption_kwh,3):'—'"></td>
                        <td>
                          <span class="q" :style="qualityStyle(row.quality)"
                            x-text="qualityLabel(row.quality)"></span>
                        </td>
                      </tr>
                    </template>
                  </template>
                </tbody>
                <tfoot><tr>
                  <td colspan="2">Итого</td>
                  <td class="num" x-text="fmt(rTotal,3)"></td>
                  <td></td>
                </tr></tfoot>
              </table>
              <div class="muted" style="margin-top:8px" x-text="rPeriodLabel"></div>
            </div>
          </template>
        </div>
      </template>

      <!-- ===== ПРОФИЛЬ НАГРУЗКИ ===== -->
      <template x-if="rMode=='profile'">
        <div>
          <div class="report-row">
            <label>Счётчик:</label>
            <select x-model="profileMeterId" @change="loadProfile()">
              <option value="">— выберите —</option>
              <template x-for="m in regMeters" :key="m.device_id">
                <option :value="m.device_id" x-text="m.display_name"></option>
              </template>
            </select>
            <label>Период:</label>
            <template x-for="p in profilePresets" :key="p.id">
              <button
                :style="profilePeriod===p.id?'background:var(--accent);color:#fff;border-color:var(--accent)':
                  'background:var(--bg2);border:1px solid var(--line);color:var(--txt2)'"
                style="cursor:pointer;padding:7px 12px;border-radius:6px;font-size:12px;font-weight:500"
                @click="profilePeriod=p.id;profileFrom='';profileTo='';loadProfile()"
                x-text="p.label"></button>
            </template>
            <input type="date" x-model="profileFrom"
              style="background:var(--bg2);border:1px solid var(--line);color:var(--txt);
                     padding:7px 9px;border-radius:6px;font-size:13px;font-family:inherit">
            <span class="muted">—</span>
            <input type="date" x-model="profileTo"
              style="background:var(--bg2);border:1px solid var(--line);color:var(--txt);
                     padding:7px 9px;border-radius:6px;font-size:13px;font-family:inherit">
            <button style="background:var(--bg3);border:1px solid var(--line);color:var(--txt);
                           cursor:pointer;padding:7px 14px;border-radius:6px;font-size:13px"
              @click="profilePeriod='';loadProfile()">Применить</button>
            <div class="spacer"></div>
            <button class="dl-btn" @click="downloadProfile()">⬇ Скачать CSV</button>
          </div>

          <template x-if="profileLoading">
            <div class="empty"><span class="spin"></span> загрузка…</div>
          </template>
          <template x-if="!profileLoading && !profileMeterId">
            <div class="empty">Выберите счётчик</div>
          </template>
          <template x-if="!profileLoading && profileMeterId && profileHours.length===0">
            <div class="empty">Нет данных за выбранный период</div>
          </template>

          <template x-if="!profileLoading && profileHours.length>0">
            <div>
              <!-- Сводка -->
              <div class="profile-meta">
                <div class="pm">
                  <div class="pk">Итого за период</div>
                  <div class="pv mono"><span x-text="fmt(profileTotal,3)"></span><small style="font-size:13px;color:var(--txt2)"> кВт·ч</small></div>
                </div>
                <div class="pm">
                  <div class="pk">Пиковый час</div>
                  <div class="pv mono"><span x-text="fmt(profilePeak.v,3)"></span><small style="font-size:13px;color:var(--txt2)"> кВт·ч</small></div>
                  <div class="muted" x-text="profilePeak.label"></div>
                </div>
                <div class="pm">
                  <div class="pk">Среднее в час</div>
                  <div class="pv mono"><span x-text="fmt(profileTotal/Math.max(profileHours.filter(h=>h.v!=null).length,1),3)"></span><small style="font-size:13px;color:var(--txt2)"> кВт·ч</small></div>
                </div>
                <div class="pm">
                  <div class="pk">Часов с данными</div>
                  <div class="pv mono" x-text="profileHours.filter(h=>h.v!=null).length + ' / ' + profileHours.length"></div>
                </div>
              </div>
              <!-- График -->
              <div class="profile-wrap">
                <div x-html="profileSvg"></div>
              </div>
              <!-- Таблица первых 48 часов -->
              <div style="margin-top:14px;max-height:300px;overflow-y:auto;border-radius:10px;border:1px solid var(--line)">
                <table class="rep-table" style="border:none;border-radius:0">
                  <thead><tr><th>Час</th><th class="num">кВт·ч</th><th>Качество</th></tr></thead>
                  <tbody>
                    <template x-for="h in profileHours.slice(0,96)" :key="h.t">
                      <tr>
                        <td class="mono" style="font-size:12px" x-text="fmtHour(h.t)"></td>
                        <td class="num" x-text="h.v!=null?fmt(h.v,4):'—'"></td>
                        <td><span class="q" :style="qualityStyle(h.q)" x-text="qualityLabel(h.q)||'—'"></span></td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </div>
          </template>
        </div>
      </template>

      <!-- ===== СРАВНЕНИЕ ПЕРИОДОВ ===== -->
      <template x-if="rMode=='compare'">
        <div>
          <div class="report-row" style="flex-wrap:wrap;gap:16px">
            <div style="display:flex;align-items:center;gap:8px">
              <span style="width:10px;height:10px;background:var(--accent2);
                border-radius:2px;display:inline-block"></span>
              <label>Период A:</label>
              <select x-model="cmpPeriodA" @change="loadCompare()">
                <template x-for="p in presets" :key="p.id">
                  <option :value="p.id" x-text="p.label"></option>
                </template>
              </select>
            </div>
            <div style="display:flex;align-items:center;gap:8px">
              <span style="width:10px;height:10px;background:var(--info);
                border-radius:2px;display:inline-block"></span>
              <label>Период B:</label>
              <select x-model="cmpPeriodB" @change="loadCompare()">
                <template x-for="p in presets" :key="p.id">
                  <option :value="p.id" x-text="p.label"></option>
                </template>
              </select>
            </div>
            <div class="spacer"></div>
            <button class="dl-btn" @click="downloadCompare()">⬇ Скачать CSV</button>
          </div>

          <template x-if="cmpLoading">
            <div class="empty"><span class="spin"></span> сравниваю…</div>
          </template>

          <template x-if="!cmpLoading && cmpRows.length>0">
            <div>
              <table class="rep-table">
                <thead><tr>
                  <th>Счётчик</th>
                  <th class="num">
                    <span style="color:var(--accent2)" x-text="cmpLabelA"></span>
                    кВт·ч
                  </th>
                  <th class="num">
                    <span style="color:var(--info)" x-text="cmpLabelB"></span>
                    кВт·ч
                  </th>
                  <th class="num">Δ кВт·ч</th>
                  <th class="num">Δ %</th>
                </tr></thead>
                <tbody>
                  <template x-for="r in cmpRows" :key="r.device_id">
                    <tr>
                      <td>
                        <div style="font-weight:600" x-text="r.display_name"></div>
                        <div class="muted" style="font-size:11px" x-text="r.group||''"></div>
                      </td>
                      <td class="num mono" x-text="r.a!=null?fmt(r.a,3):'—'"></td>
                      <td class="num mono" x-text="r.b!=null?fmt(r.b,3):'—'"></td>
                      <td class="num mono"
                        :class="r.delta>0?'delta-pos':r.delta<0?'delta-neg':'delta-neu'"
                        x-text="r.delta!=null?(r.delta>0?'+':'')+fmt(r.delta,3):'—'"></td>
                      <td class="num"
                        :class="r.pct>5?'delta-pos':r.pct<-5?'delta-neg':'delta-neu'"
                        x-text="r.pct!=null?(r.pct>0?'+':'')+r.pct.toFixed(1)+'%':'—'"></td>
                    </tr>
                  </template>
                </tbody>
                <tfoot><tr>
                  <td>Итого</td>
                  <td class="num mono" x-text="fmt(cmpTotalA,3)"></td>
                  <td class="num mono" x-text="fmt(cmpTotalB,3)"></td>
                  <td class="num mono"
                    :class="(cmpTotalB-cmpTotalA)>0?'delta-pos':(cmpTotalB-cmpTotalA)<0?'delta-neg':''"
                    x-text="(cmpTotalB-cmpTotalA>0?'+':'')+fmt(cmpTotalB-cmpTotalA,3)"></td>
                  <td class="num"
                    :class="cmpTotalA>0&&(cmpTotalB-cmpTotalA)/cmpTotalA*100>5?'delta-pos':
                      cmpTotalA>0&&(cmpTotalB-cmpTotalA)/cmpTotalA*100<-5?'delta-neg':''"
                    x-text="cmpTotalA>0?(((cmpTotalB-cmpTotalA)/cmpTotalA*100)>0?'+':'')+
                      ((cmpTotalB-cmpTotalA)/cmpTotalA*100).toFixed(1)+'%':'—'"></td>
                </tr></tfoot>
              </table>
              <div class="muted" style="margin-top:8px">
                🔴 рост &gt;5%  ·  🟢 снижение &gt;5%
              </div>
            </div>
          </template>
        </div>
      </template>

      <!-- ===== ДОСТУПНОСТЬ ===== -->
      <template x-if="rMode=='avail'">
        <div>
          <div class="report-row">
            <label>Период:</label>
            <template x-for="p in presets" :key="p.id">
              <button
                :style="availPeriod===p.id?'background:var(--accent);color:#fff;border-color:var(--accent)':
                  'background:var(--bg2);border:1px solid var(--line);color:var(--txt2)'"
                style="cursor:pointer;padding:7px 12px;border-radius:6px;font-size:12px;font-weight:500"
                @click="availPeriod=p.id;loadAvail()"
                x-text="p.label"></button>
            </template>
            <div class="spacer"></div>
            <button class="dl-btn" @click="downloadAvail()">⬇ Скачать CSV</button>
          </div>
          <template x-if="availLoading">
            <div class="empty"><span class="spin"></span> загрузка…</div>
          </template>
          <template x-if="!availLoading && availItems.length>0">
            <div>
              <table class="rep-table">
                <thead><tr>
                  <th>Счётчик</th><th>Зона</th><th>Роль</th>
                  <th class="num">Доступность</th><th>Недоступность</th>
                  <th class="num">Инцидентов</th>
                </tr></thead>
                <tbody>
                  <template x-for="r in availItems" :key="r.device_id">
                    <tr style="cursor:pointer"
                        @click="availSelected=availSelected===r.device_id?null:r.device_id;
                                if(availSelected)loadAvailDetail(r.device_id)">
                      <td>
                        <div style="font-weight:600" x-text="r.display_name"></div>
                        <div class="muted mono" style="font-size:11px" x-text="r.device_id"></div>
                      </td>
                      <td class="muted" x-text="r.group||'—'"></td>
                      <td><span x-text="roleLabel(r.role)" :style="`color:${roleColor(r.role)};font-weight:600;font-size:12px`"></span></td>
                      <td class="num">
                        <div style="display:flex;align-items:center;gap:8px;justify-content:flex-end">
                          <div class="avail-bar-wrap">
                            <div class="avail-bar"
                              :class="r.availability_pct>=99.9?'avail-100':r.availability_pct>=99?'avail-99':r.availability_pct>=95?'avail-95':'avail-low'"
                              :style="`width:${r.availability_pct}%`"></div>
                          </div>
                          <span class="mono" style="font-size:13px;font-weight:700"
                            :style="`color:${r.availability_pct>=99.9?'var(--ok)':r.availability_pct>=99?'var(--ok)':r.availability_pct>=95?'var(--warn)':'var(--err)'}`"
                            x-text="r.availability_pct.toFixed(2)+'%'"></span>
                        </div>
                      </td>
                      <td class="muted" x-text="fmtDuration(r.unavailable_s)"></td>
                      <td class="num" x-text="r.incidents||'—'"></td>
                    </tr>
                    <!-- Раскрывающийся список инцидентов -->
                    <template x-if="availSelected===r.device_id">
                      <tr>
                        <td colspan="6" style="background:var(--bg);padding:12px 16px">
                          <template x-if="availDetail[r.device_id]">
                            <div>
                              <template x-if="availDetail[r.device_id].intervals.length===0">
                                <div class="muted">Инцидентов за период не было 🎉</div>
                              </template>
                              <template x-for="iv in availDetail[r.device_id].intervals" :key="iv.started_at">
                                <div class="incident-row">
                                  <span class="ir-time" x-text="iv.started_label"></span>
                                  <span class="muted"> → </span>
                                  <span class="ir-time" x-text="iv.ended_label"></span>
                                  <span class="ir-dur" x-text="' · ' + fmtDuration(iv.duration_s||0)"></span>
                                  <span class="muted" style="margin-left:8px"
                                    x-text="iv.rule_type==='no_connection'?'нет связи':'ошибка устройства'"></span>
                                  <template x-if="iv.status==='active'">
                                    <span style="margin-left:8px;color:var(--err);font-weight:700">● продолжается</span>
                                  </template>
                                </div>
                              </template>
                            </div>
                          </template>
                          <template x-if="!availDetail[r.device_id]">
                            <div class="empty" style="padding:12px 0"><span class="spin"></span></div>
                          </template>
                        </td>
                      </tr>
                    </template>
                  </template>
                </tbody>
              </table>
              <div class="muted" style="margin-top:8px">
                Кликните на счётчик чтобы увидеть список инцидентов
              </div>
            </div>
          </template>
        </div>
      </template>

      <!-- ===== БАЛАНС ===== -->
      <template x-if="rMode=='balance'">
        <div>
          <div class="report-row">
            <label>Период:</label>
            <template x-for="p in presets" :key="p.id">
              <button
                :style="balancePeriod===p.id?'background:var(--accent);color:#fff;border-color:var(--accent)':
                  'background:var(--bg2);border:1px solid var(--line);color:var(--txt2)'"
                style="cursor:pointer;padding:7px 12px;border-radius:6px;font-size:12px;font-weight:500"
                @click="balancePeriod=p.id;loadBalance()"
                x-text="p.label"></button>
            </template>
            <div class="spacer"></div>
            <button class="dl-btn" @click="downloadBalance()">⬇ Скачать CSV</button>
          </div>

          <template x-if="balanceLoading">
            <div class="empty"><span class="spin"></span> считаю баланс…</div>
          </template>

          <!-- Нет данных о ролях -->
          <template x-if="!balanceLoading && balanceData && !balanceData.has_inputs">
            <div style="background:var(--bg2);border:1px solid var(--warn);
                        border-radius:10px;padding:24px;text-align:center">
              <div style="font-size:24px;margin-bottom:12px">⚠️</div>
              <div style="font-weight:700;margin-bottom:8px">Нет вводных счётчиков</div>
              <div style="color:var(--txt2);font-size:13px">
                Чтобы рассчитать баланс, назначьте роль <b>«Ввод»</b> хотя бы одному счётчику.<br>
                Это делается на вкладке <b>Настройки → Зарегистрированные счётчики</b>.
              </div>
            </div>
          </template>

          <template x-if="!balanceLoading && balanceData && balanceData.has_inputs">
            <div>
              <!-- Сводка -->
              <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:20px">
                <!-- Ввод -->
                <div style="background:var(--bg2);border:2px solid var(--ok);
                            border-radius:10px;padding:16px 20px">
                  <div style="font-size:11px;text-transform:uppercase;letter-spacing:.6px;
                              color:var(--ok);font-weight:700;margin-bottom:8px">
                    ⬇ Ввод (<span x-text="balanceData.input.meters.length"></span> сч.)
                  </div>
                  <div style="font-size:32px;font-weight:700;font-family:monospace">
                    <span x-text="fmt(balanceData.input.total_kwh,3)"></span>
                    <small style="font-size:14px;color:var(--txt2)"> кВт·ч</small>
                  </div>
                </div>
                <!-- Потребители -->
                <div style="background:var(--bg2);border:2px solid var(--accent2);
                            border-radius:10px;padding:16px 20px">
                  <div style="font-size:11px;text-transform:uppercase;letter-spacing:.6px;
                              color:var(--accent2);font-weight:700;margin-bottom:8px">
                    ⬆ Потребители (<span x-text="balanceData.consumer.meters.length"></span> сч.)
                  </div>
                  <div style="font-size:32px;font-weight:700;font-family:monospace">
                    <span x-text="fmt(balanceData.consumer.total_kwh,3)"></span>
                    <small style="font-size:14px;color:var(--txt2)"> кВт·ч</small>
                  </div>
                </div>
                <!-- Небаланс -->
                <div :style="`background:var(--bg2);border:2px solid ${Math.abs(balanceData.imbalance_pct||0)>5?'var(--err)':'var(--line)'};border-radius:10px;padding:16px 20px`">
                  <div style="font-size:11px;text-transform:uppercase;letter-spacing:.6px;
                              color:var(--txt3);font-weight:700;margin-bottom:8px">
                    Δ Небаланс
                  </div>
                  <div style="font-size:32px;font-weight:700;font-family:monospace"
                    :style="`color:${Math.abs(balanceData.imbalance_pct||0)>5?'var(--err)':Math.abs(balanceData.imbalance_pct||0)>2?'var(--warn)':'var(--ok)'}`">
                    <span x-text="(balanceData.imbalance_kwh>0?'+':'')+fmt(balanceData.imbalance_kwh,3)"></span>
                    <small style="font-size:14px"> кВт·ч</small>
                  </div>
                  <div style="margin-top:4px;font-size:13px"
                    :style="`color:${Math.abs(balanceData.imbalance_pct||0)>5?'var(--err)':Math.abs(balanceData.imbalance_pct||0)>2?'var(--warn)':'var(--ok)'}`"
                    x-text="balanceData.imbalance_pct!=null?(balanceData.imbalance_pct>0?'+':'')+balanceData.imbalance_pct.toFixed(2)+'% от ввода':'—'">
                  </div>
                  <div class="muted" style="margin-top:4px;font-size:11px">
                    потери + погрешность учёта
                  </div>
                </div>
              </div>

              <!-- Детализация по вводам -->
              <template x-if="balanceData.input.meters.length>0">
                <div style="margin-bottom:16px">
                  <div class="section-title" style="margin-bottom:8px">
                    Вводные счётчики
                  </div>
                  <table class="rep-table">
                    <thead><tr>
                      <th>Счётчик</th><th>Зона</th>
                      <th class="num">Расход, кВт·ч</th><th>Качество</th>
                    </tr></thead>
                    <tbody>
                      <template x-for="m in balanceData.input.meters" :key="m.device_id">
                        <tr>
                          <td>
                            <div style="font-weight:600" x-text="m.display_name"></div>
                            <div class="muted mono" style="font-size:11px" x-text="m.device_id"></div>
                          </td>
                          <td class="muted" x-text="m.group||'—'"></td>
                          <td class="num mono" x-text="m.consumption_kwh!=null?fmt(m.consumption_kwh,3):'—'"></td>
                          <td><span class="q" :style="qualityStyle(m.quality)" x-text="qualityLabel(m.quality)"></span></td>
                        </tr>
                      </template>
                    </tbody>
                    <tfoot><tr>
                      <td colspan="2" style="font-weight:700">Итого ввод</td>
                      <td class="num mono" style="color:var(--ok);font-weight:700"
                        x-text="fmt(balanceData.input.total_kwh,3)"></td>
                      <td></td>
                    </tr></tfoot>
                  </table>
                </div>
              </template>

              <!-- Детализация по потребителям -->
              <template x-if="balanceData.consumer.meters.length>0">
                <div style="margin-bottom:16px">
                  <div class="section-title" style="margin-bottom:8px">
                    Счётчики потребителей
                  </div>
                  <table class="rep-table">
                    <thead><tr>
                      <th>Счётчик</th><th>Зона</th>
                      <th class="num">Расход, кВт·ч</th><th>Качество</th>
                    </tr></thead>
                    <tbody>
                      <template x-for="m in balanceData.consumer.meters" :key="m.device_id">
                        <tr>
                          <td>
                            <div style="font-weight:600" x-text="m.display_name"></div>
                            <div class="muted mono" style="font-size:11px" x-text="m.device_id"></div>
                          </td>
                          <td class="muted" x-text="m.group||'—'"></td>
                          <td class="num mono" x-text="m.consumption_kwh!=null?fmt(m.consumption_kwh,3):'—'"></td>
                          <td><span class="q" :style="qualityStyle(m.quality)" x-text="qualityLabel(m.quality)"></span></td>
                        </tr>
                      </template>
                    </tbody>
                    <tfoot><tr>
                      <td colspan="2" style="font-weight:700">Итого потребители</td>
                      <td class="num mono" style="color:var(--accent2);font-weight:700"
                        x-text="fmt(balanceData.consumer.total_kwh,3)"></td>
                      <td></td>
                    </tr></tfoot>
                  </table>
                </div>
              </template>

              <!-- Прочие (если есть) -->
              <template x-if="balanceData.other.meters.length>0">
                <div style="margin-bottom:16px">
                  <div class="section-title" style="margin-bottom:8px">
                    Прочие (не учтены в балансе)
                  </div>
                  <table class="rep-table">
                    <thead><tr>
                      <th>Счётчик</th><th>Зона</th>
                      <th class="num">Расход, кВт·ч</th><th>Качество</th>
                    </tr></thead>
                    <tbody>
                      <template x-for="m in balanceData.other.meters" :key="m.device_id">
                        <tr>
                          <td>
                            <div style="font-weight:600" x-text="m.display_name"></div>
                          </td>
                          <td class="muted" x-text="m.group||'—'"></td>
                          <td class="num mono" x-text="m.consumption_kwh!=null?fmt(m.consumption_kwh,3):'—'"></td>
                          <td><span class="q" :style="qualityStyle(m.quality)" x-text="qualityLabel(m.quality)"></span></td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </div>
              </template>
            </div>
          </template>
        </div>
      </template>

    </div>
  </template>

  <!-- DETAIL MODAL -->
  <template x-if="detail">
    <div class="overlay" @click.self="closeDetail()">
      <div class="modal">
        <div class="modal-head">
          <span class="dot" :style="`background:${statusColor(detail.status)};width:11px;height:11px`"></span>
          <span class="nm" x-text="detail.display_name"></span>
          <span class="badge" :style="badgeStyle(detail.status)" x-text="statusLabel(detail.status)"></span>
          <button class="close" @click="closeDetail()">×</button>
        </div>
        <div class="modal-body">
          <div class="muted" style="margin-bottom:14px">
            <span x-text="detail.device_id"></span> ·
            serial <span class="mono" x-text="detail.serial||'—'"></span> ·
            <span x-text="detail.group||'без группы'"></span> ·
            драйвер <span x-text="detail.driver||'—'"></span>
          </div>
          <template x-if="detail.status_reason">
            <div class="warn-item" x-text="detail.status_reason"></div>
          </template>

          <!-- ===== СЕТКА ПАРАМЕТРОВ (категоризация, §5 ТЗ) ===== -->
          <template x-if="!detailChannel">
            <div style="margin-top:14px">
              <div class="section-title" style="margin-bottom:8px">Основные</div>
              <div class="ctrl-grid">
                <template x-for="c in detailMainControls" :key="c.name">
                  <div class="ctrl" :class="c.numeric!=null?'ctrl-clickable':''"
                       :data-hint="c.hint||null" :title="c.hint||c.label"
                       @click="c.numeric!=null && openChannelChart(c.name)">
                    <div class="ck" x-text="c.label||c.name"></div>
                    <div class="cv mono">
                      <span x-text="c.numeric!=null?fmt(c.numeric,3):(c.value!=null?c.value:'—')"></span>
                      <small style="color:var(--txt2);font-weight:400" x-show="c.units" x-text="c.units"></small>
                      <template x-if="c.error"><small style="color:var(--err)"> err</small></template>
                    </div>
                  </div>
                </template>
              </div>

              <template x-for="cat in detailOtherCategories" :key="cat.id">
                <div class="cat-block">
                  <div class="cat-header" @click="toggleDetailCat(cat.id)">
                    <span class="cat-arrow" x-text="isDetailCatOpen(cat.id)?'▾':'▸'"></span>
                    <span style="font-weight:600;font-size:13px" x-text="cat.label"></span>
                    <span class="muted" x-text="'· '+cat.items.length"></span>
                  </div>
                  <div class="ctrl-grid" x-show="isDetailCatOpen(cat.id)">
                    <template x-for="c in cat.items" :key="c.name">
                      <div class="ctrl" :class="c.numeric!=null?'ctrl-clickable':''"
                           :data-hint="c.hint||null" :title="c.hint||c.label"
                           @click="c.numeric!=null && openChannelChart(c.name)">
                        <div class="ck" x-text="c.label||c.name"></div>
                        <div class="cv mono">
                          <span x-text="c.numeric!=null?fmt(c.numeric,3):(c.value!=null?c.value:'—')"></span>
                          <small style="color:var(--txt2);font-weight:400" x-show="c.units" x-text="c.units"></small>
                          <template x-if="c.error"><small style="color:var(--err)"> err</small></template>
                        </div>
                      </div>
                    </template>
                  </div>
                </div>
              </template>
            </div>
          </template>

          <!-- ===== ГРАФИК ИСТОРИИ ПАРАМЕТРА (задача 2, §4.3 ТЗ) ===== -->
          <template x-if="detailChannel">
            <div style="margin-top:10px">
              <button class="btn btn-secondary btn-sm" @click="closeChannelChart()" style="margin-bottom:12px">← К параметрам</button>
              <div style="margin-bottom:10px">
                <div style="font-weight:700;font-size:15px" x-text="channelLabel(detailChannel)"></div>
                <div class="muted" style="font-size:12px" x-text="detail.device_id + ' · ' + detailChannel"></div>
              </div>
              <div class="report-row">
                <button class="btn btn-sm" :style="detailChartPeriod==='hour'?
                    'background:var(--accent);color:#fff':'background:var(--bg3);border:1px solid var(--line);color:var(--txt2)'"
                  @click="detailChartPeriod='hour';detailChartFrom='';detailChartTo='';loadDetailChart()">Час</button>
                <button class="btn btn-sm" :style="detailChartPeriod==='today'?
                    'background:var(--accent);color:#fff':'background:var(--bg3);border:1px solid var(--line);color:var(--txt2)'"
                  @click="detailChartPeriod='today';detailChartFrom='';detailChartTo='';loadDetailChart()">Сутки</button>
                <button class="btn btn-sm" :style="detailChartPeriod==='last_7d'?
                    'background:var(--accent);color:#fff':'background:var(--bg3);border:1px solid var(--line);color:var(--txt2)'"
                  @click="detailChartPeriod='last_7d';detailChartFrom='';detailChartTo='';loadDetailChart()">Неделя</button>
                <button class="btn btn-sm" :style="detailChartPeriod==='this_month'?
                    'background:var(--accent);color:#fff':'background:var(--bg3);border:1px solid var(--line);color:var(--txt2)'"
                  @click="detailChartPeriod='this_month';detailChartFrom='';detailChartTo='';loadDetailChart()">Месяц</button>
                <input type="date" x-model="detailChartFrom"
                  style="background:var(--bg2);border:1px solid var(--line);color:var(--txt);
                         padding:7px 9px;border-radius:6px;font-size:13px;font-family:inherit">
                <span class="muted">—</span>
                <input type="date" x-model="detailChartTo"
                  style="background:var(--bg2);border:1px solid var(--line);color:var(--txt);
                         padding:7px 9px;border-radius:6px;font-size:13px;font-family:inherit">
                <button class="btn btn-sm btn-secondary" @click="detailChartPeriod='';loadDetailChart()">Применить</button>
                <div class="spacer"></div>
                <button class="dl-btn" @click="downloadDetailChart()" :disabled="!detailChartData||!detailChartData.points_count">⬇ CSV</button>
              </div>

              <template x-if="detailChartLoading">
                <div class="empty"><span class="spin"></span> загрузка…</div>
              </template>
              <template x-if="!detailChartLoading && detailChartError">
                <div class="empty" style="color:var(--err)" x-text="detailChartError"></div>
              </template>
              <template x-if="!detailChartLoading && !detailChartError && detailChartData && detailChartData.points_count===0">
                <div class="empty">Нет данных за период</div>
              </template>
              <template x-if="!detailChartLoading && !detailChartError && detailChartData && detailChartData.points_count>0">
                <div>
                  <div class="profile-meta">
                    <div class="pm"><div class="pk">Мин</div><div class="pv mono" x-text="fmt(detailChartData.min,3)"></div></div>
                    <div class="pm"><div class="pk">Макс</div><div class="pv mono" x-text="fmt(detailChartData.max,3)"></div></div>
                    <div class="pm"><div class="pk">Среднее</div><div class="pv mono" x-text="fmt(detailChartData.avg,3)"></div></div>
                    <div class="pm"><div class="pk">Последнее</div><div class="pv mono" x-text="fmt(detailChartData.last,3)"></div></div>
                  </div>
                  <div class="profile-wrap"><div x-html="detailChartSvg"></div></div>
                </div>
              </template>
            </div>
          </template>
        </div>
      </div>
    </div>
  </template>

  <!-- CONFIRM MERGE ZONES (A3/A5) -->
  <template x-if="mergeConfirm">
    <div class="confirm-overlay">
      <div class="confirm-box">
        <h3>Зона с таким именем уже есть</h3>
        <p>
          Зона «<b x-text="mergeConfirm.name"></b>» уже существует.<br><br>
          Объединить зоны? Все счётчики текущей зоны перейдут в
          существующую «<b x-text="mergeConfirm.name"></b>», зона-дубль
          будет удалена. Это действие нельзя отменить.
        </p>
        <div class="actions">
          <button class="btn btn-secondary" @click="mergeConfirm=null">Отмена</button>
          <button class="btn btn-primary" @click="confirmMergeZones()">Объединить зоны</button>
        </div>
      </div>
    </div>
  </template>

  <!-- CONFIRM DELETE ZONE -->
  <template x-if="confirmZone">
    <div class="confirm-overlay">
      <div class="confirm-box">
        <h3>Удалить зону?</h3>
        <p>
          <b x-text="confirmZone.name"></b><br>
          <span x-text="confirmZone.meter_count + ' счётчиков'"></span> перейдут в «Без зоны».<br><br>
          Сами счётчики и их данные останутся.
        </p>
        <div class="actions">
          <button class="btn btn-secondary" @click="confirmZone=null">Отмена</button>
          <button class="btn btn-danger" @click="confirmDeleteZone()">Удалить зону</button>
        </div>
      </div>
    </div>
  </template>

  <!-- CONFIRM DELETE DIALOG -->
  <template x-if="confirmTarget">
    <div class="confirm-overlay">
      <div class="confirm-box">
        <h3>Удалить счётчик?</h3>
        <p>
          <b x-text="confirmTarget.display_name"></b><br>
          <span class="mono" style="font-size:12px" x-text="confirmTarget.device_id"></span><br><br>
          Агрегаты расхода останутся в БД, но счётчик пропадёт со всех экранов.
          Это действие нельзя отменить.
        </p>
        <div class="actions">
          <button class="btn btn-secondary" @click="confirmTarget=null">Отмена</button>
          <button class="btn btn-danger" @click="confirmDelete()">Удалить</button>
        </div>
      </div>
    </div>
  </template>

  <!-- CONFIRM UPDATE (ТЗ v0.9.0) -->
  <template x-if="updConfirmOpen">
    <div class="confirm-overlay">
      <div class="confirm-box">
        <h3>Обновить сервис?</h3>
        <p>
          Сервис будет остановлен и перезапущен. Сбор данных прервётся
          примерно на минуту. База данных будет сохранена, при неудаче
          произойдёт автоматический откат на текущую версию.
        </p>
        <div class="actions">
          <button class="btn btn-secondary" @click="updConfirmOpen=false">Отмена</button>
          <button class="btn btn-primary" @click="startUpdateNow()">Обновить</button>
        </div>
      </div>
    </div>
  </template>

  <!-- CONFIRM RESTART DRIVER (ТЗ v0.10.0) -->
  <template x-if="uptimeRestartConfirm">
    <div class="confirm-overlay">
      <div class="confirm-box">
        <h3>Перезапустить опрос?</h3>
        <p>
          Будет перезапущен драйвер <code>wb-mqtt-serial</code>. На
          несколько секунд прервётся опрос <b>всех</b> устройств
          контроллера — не только счётчиков. Продолжить?
        </p>
        <div class="actions">
          <button class="btn btn-secondary" @click="uptimeRestartConfirm=false">Отмена</button>
          <button class="btn btn-primary" @click="restartDriverNow()">Перезапустить</button>
        </div>
      </div>
    </div>
  </template>

  <!-- TOAST -->
  <template x-if="toast">
    <div class="toast" :class="toast.ok?'toast-ok':'toast-err'" x-text="toast.msg"></div>
  </template>
</main>

<script src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.0/dist/cdn.min.js" defer></script>
<script>
function app(){ return {
  tab:'dash', theme:lsGet('theme','dark'), loading:true,
  meters:[], byStatus:{}, mqtt:{connected:false,messages:0,errors:0},
  version:'', uptime:0, detail:null,
  // consumption
  consLoading:false, consItems:[], consTotal:0, consAnyUnknown:false,
  period:{preset:'this_month',from:'',to:''},
  presets:[
    {id:'today',label:'Сегодня'},{id:'yesterday',label:'Вчера'},
    {id:'this_month',label:'Этот месяц'},{id:'last_month',label:'Прошлый месяц'},
    {id:'last_7d',label:'7 дней'},{id:'last_30d',label:'30 дней'},
  ],
  chartBars:[], chartSvg:'', chartMeterName:'',
  // самообновление (ТЗ v0.9.0)
  updChecking:false, updChecked:false, updCurrent:null, updRemote:null,
  updAvailable:false, updCheckedAt:null, updCheckError:'', updAllowFromUi:true,
  updConfirmOpen:false, updStatus:{state:'idle'}, updResultHidden:false,
  _updPollFailStartedAt:null, _updPollTimer:null,
  // канал Uptime и конфиг wb-mqtt-serial (ТЗ v0.10.0)
  uptimeItems:[], uptimeAllowEdit:false, uptimePending:[], uptimeSha:null,
  uptimeConfigError:'', uptimeBusy:false, uptimeOpenId:null,
  uptimeRestartConfirm:false,
  // settings
  settingsLoading:false, regMeters:[], unregistered:[], allGroups:[],
  // массовое назначение зоны (§3.6 ТЗ)
  selectedMeters:[], bulkGroup:'',
  // zones
  zones:[], zoneEditId:null, zoneEditName:'', zoneNewName:'', confirmZone:null,
  mergeConfirm:null,
  scanLoading:false,
  editingId:null, editName:'', editGroup:'', editGroupNew:'', editNotes:'', editRole:'consumer',
  addingId:null, addName:'', addGroup:'', addGroupNew:'', addNotes:'',
  confirmTarget:null,
  // словарь каналов (§5 ТЗ)
  channelCategories:[],
  // детали счётчика: график истории параметра (задача 2, §4 ТЗ)
  detailChannel:null, detailChartLoading:false, detailChartError:'',
  detailChartData:null, detailChartSvg:'',
  detailChartPeriod:'today', detailChartFrom:'', detailChartTo:'',
  detailCatsOpen:lsGetJSON('wbem.detailCats',{}),
  _detailChartSeq:0, _detailChartLastCall:0,
  // reports
  rMode:'vedomost', rLoading:false,
  rPeriod:'this_month', rFrom:'', rTo:'',
  vedomostRows:[], rTotal:0, rPeriodLabel:'',
  profileMeterId:'', profilePeriod:'last_7d', profileFrom:'', profileTo:'',
  profileHours:[], profileTotal:0, profilePeak:{v:0,label:'',item:null},
  profileSvg:'', profileLoading:false,
  profilePresets:[
    {id:'today',label:'Сегодня'},{id:'yesterday',label:'Вчера'},
    {id:'last_7d',label:'7 дней'},{id:'this_month',label:'Этот месяц'},
    {id:'last_30d',label:'30 дней'},
  ],
  cmpPeriodA:'this_month', cmpPeriodB:'last_month',
  cmpRows:[], cmpTotalA:0, cmpTotalB:0,
  cmpLabelA:'', cmpLabelB:'', cmpLoading:false,
  // toast
  toast:null, _toastTimer:null,
  _timer:null,

  init(){
    this.refresh();
    this.loadChannelDictionary();
    this.reloadGroups();
    this._timer=setInterval(()=>{ if(this.tab=='dash') this.loadStatus(); },5000);
  },
  async loadChannelDictionary(){
    try{
      const r=await fetch('/api/channels/dictionary');

  get updIsActive(){

  async initUpdatePanel(){
    // Опрос статуса — при каждом открытии «Настроек»: если обновление
    // шло, когда пользователь закрыл вкладку, он должен увидеть
    // результат. Это ЛОКАЛЬНЫЙ опрос (файл статуса), не GitHub —
    // "автопроверки нет" (§1 ТЗ) касается только checkUpdate().
    await this.pollUpdateStatusOnce();
  },
  async checkUpdate(){
    this.updChecking=true; this.updCheckError='';
    try{
      const r=await fetch('/api/update/check');
      const d=await r.json();
      if(!r.ok){ this.updCheckError=d.error||'Ошибка проверки обновлений'; this.updChecking=false; return; }
      this.updCurrent=d.current; this.updRemote=d.remote;
      this.updAvailable=!!d.update_available; this.updAllowFromUi=!!d.allow_from_ui;
      this.updChecked=true; this.updCheckedAt=Date.now()/1000;
    }catch(e){ this.updCheckError='Не удалось связаться с сервисом: '+e; }
    this.updChecking=false;
  },
  async startUpdateNow(){
    this.updConfirmOpen=false;
    try{
      const r=await fetch('/api/update/start',
        {method:'POST', headers:{'Content-Type':'application/json'},
         body:JSON.stringify({commit:this.updRemote&&this.updRemote.commit})});
      const d=await r.json().catch(()=>({}));
      if(!r.ok){ this.showToast(d.error||'Не удалось запустить обновление',false); return; }
      this.updResultHidden=false; this.updStatus=d;
      this._updPollFailStartedAt=null;
      this._ensureUpdatePolling();
    }catch(e){ this.showToast('Ошибка: '+e,false); }
  },
  async pollUpdateStatusOnce(){
    try{
      const r=await fetch('/api/update/status');
      if(!r.ok) throw new Error('HTTP '+r.status);
      const d=await r.json();
      this._updPollFailStartedAt=null;
      const prevState=this.updStatus&&this.updStatus.state;
      this.updStatus=d;
      if(prevState!==d.state) this.updResultHidden=false;
      if(UPD_ACTIVE_STATES.includes(d.state)){ this._ensureUpdatePolling(); }
      else { this._stopUpdatePolling(); }
    }catch(e){
      // Сервис перезапускается — нормальная часть обновления, не ошибка.
      // Сдаёмся только после 120 секунд подряд неудачных попыток (§4.6 п.6).
      if(!this._updPollFailStartedAt) this._updPollFailStartedAt=Date.now();
      this._ensureUpdatePolling();
      if(Date.now()-this._updPollFailStartedAt>120000){
        this._stopUpdatePolling();
        this.updStatus={state:'unreachable'};
      }
    }
  },
  _ensureUpdatePolling(){
    if(this._updPollTimer) return;
    this._updPollTimer=setInterval(()=>this.pollUpdateStatusOnce(),2000);
  },
  _stopUpdatePolling(){
    if(this._updPollTimer){ clearInterval(this._updPollTimer); this._updPollTimer=null; }
  },

  // ---- Zones / grouping ----
  get groupedMeters(){
    const groups = {};
    this.meters.forEach(m=>{
      const z = m.group || '— Без зоны —';
      if(!groups[z]) groups[z]={name:z,meters:[]};
      groups[z].meters.push(m);
    });
    // Сортировка: сначала именованные зоны, потом "Без зоны"
    const named = Object.keys(groups).filter(k=>k!=='— Без зоны —').sort();
    const order = [...named, '— Без зоны —'].filter(k=>groups[k]);
    return order.map(k=>groups[k]);
  },
  zoneColor(zone){
    // Принимает либо имя зоны строкой, либо объект зоны {name,color}
    // (§3.7 ТЗ). Приоритет — цвет из БД, иначе детерминированный хеш
    // от имени (фолбэк для старых зон без цвета — ничего не ломается).
    const name = typeof zone==='string' ? zone : ((zone&&zone.name)||'');
    let color = (zone && typeof zone==='object') ? zone.color : null;
    if(!color){
      const z=(this.zones||[]).find(zz=>zz.name===name);
      if(z) color=z.color;
    }
    if(color) return color;
    if(name==='— Без зоны —') return 'var(--txt3)';
    // Детерминированный цвет из имени зоны
    let h=0;
    for(let i=0;i<name.length;i++) h=(h*31+name.charCodeAt(i))%360;
    return `hsl(${h},55%,45%)`;
  },
  zonePower(meters){
    let s=0;
    meters.forEach(m=>{const v=m.main_values&&m.main_values['Total P'];if(typeof v=='number')s+=v;});
    return s.toFixed(3);
  },

      .map(cc=>({id:cc.id,label:cc.label,open:cc.open,items:byCat[cc.id]||[]}))

  // ---- График истории параметра (задача 2, §4 ТЗ) ----
  openChannelChart(name){
    this.detailChannel=name;
    this.detailChartPeriod='today'; this.detailChartFrom=''; this.detailChartTo='';
    this.detailChartData=null; this.detailChartError=''; this.detailChartSvg='';

  },
  closeChannelChart(){
    this.detailChannel=null;
    this.detailChartData=null; this.detailChartError=''; this.detailChartSvg='';
  },
  detailChartQuery(){
    if(this.detailChartPeriod==='hour'){
      const to=new Date(), from=new Date(to.getTime()-3600*1000);
      return 'from='+dtLocal(from)+'&to='+dtLocal(to);
    }
    return this._rPeriodQuery(this.detailChartPeriod, this.detailChartFrom, this.detailChartTo);
  },
  async loadDetailChart(){
    if(!this.detail || !this.detailChannel) return;
    const myReq=++this._detailChartSeq;
    // Троттлинг ~300мс между запросами (известное ограничение — см.
    // CHANGELOG: wb_db_client.WbDbClient открывает новое MQTT-соединение
    // на каждый RPC-вызов, частые клики по параметрам иначе дают шквал
    // подключений к брокеру).
    const wait=Math.max(0,300-(Date.now()-this._detailChartLastCall));
    if(wait>0) await new Promise(res=>setTimeout(res,wait));
    if(myReq!==this._detailChartSeq) return;
    this._detailChartLastCall=Date.now();
    this.detailChartLoading=true; this.detailChartError='';
    this.detailChartData=null; this.detailChartSvg='';
    const q=this.detailChartQuery();
    try{
      const r=await fetch('/api/meters/'+encodeURIComponent(this.detail.device_id)+
        '/channel-history?control='+encodeURIComponent(this.detailChannel)+'&'+q);
      if(myReq!==this._detailChartSeq) return;
      if(!r.ok){
        let e={}; try{ e=await r.json(); }catch(_){}
        this.detailChartError=e.detail||e.error||'История недоступна: wb-mqtt-db не отвечает';
        this.detailChartLoading=false; return;
      }
      const d=await r.json();
      if(myReq!==this._detailChartSeq) return;
      this.detailChartData=d;
      this.renderDetailChartSvg();
    }catch(e){
      if(myReq===this._detailChartSeq)
        this.detailChartError='История недоступна: wb-mqtt-db не отвечает';
    }
    if(myReq===this._detailChartSeq) this.detailChartLoading=false;
  },
  renderDetailChartSvg(){
    const d=this.detailChartData;
    if(!d||!d.items||!d.items.length){ this.detailChartSvg=''; return; }
    const pts=d.items;
    const W=Math.max(700,Math.min(pts.length*4,1400)), H=220,
      padL=52, padR=14, padT=16, padB=28;
    const ts=pts.map(p=>p.t), vs=pts.map(p=>p.v);
    const tMin=Math.min(...ts), tMax=Math.max(...ts);
    const vMin=Math.min(...vs), vMax=Math.max(...vs);
    const vSpan=(vMax-vMin)||1, tSpan=(tMax-tMin)||1;
    const X=t=>padL+((t-tMin)/tSpan)*(W-padL-padR);
    const Y=v=>H-padB-((v-vMin)/vSpan)*(H-padT-padB);
    let svg=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px">`;
    for(let i=0;i<=4;i++){
      const y=padT+(H-padT-padB)*i/4;
      const val=vMax-(vSpan*i/4);
      svg+=`<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="var(--line)" stroke-dasharray="3,3"/>`;
      svg+=`<text x="${padL-4}" y="${y+4}" fill="var(--txt3)" font-size="10" text-anchor="end">${val.toFixed(2)}</text>`;
    }
    svg+=`<line x1="${padL}" y1="${H-padB}" x2="${W-padR}" y2="${H-padB}" stroke="var(--line)"/>`;
    const path=pts.map((p,i)=>(i===0?'M':'L')+X(p.t).toFixed(1)+','+Y(p.v).toFixed(1)).join(' ');
    svg+=`<path d="${path}" fill="none" stroke="var(--accent)" stroke-width="1.6"/>`;
    [0, Math.floor(pts.length/2), pts.length-1].forEach(i=>{
      const p=pts[i]; if(!p) return;
      svg+=`<text x="${X(p.t)}" y="${H-padB+14}" fill="var(--txt3)" font-size="9" text-anchor="middle">${fmtHour(p.t)}</text>`;
    });
    svg+=`</svg>`;
    this.detailChartSvg=svg;
  },
  downloadDetailChart(){
    const d=this.detailChartData;
    if(!d||!d.items||!d.items.length) return;
    const lines=['﻿',
      `wb-energy-meter — История ${d.label||d.control} (${d.device_id})`,'',
      'Время;Значение'+(d.units?(' ('+d.units+')'):'')];
    d.items.forEach(p=>{ lines.push([this.csvCell(fmtHour(p.t)),p.v].join(';')); });
    const blob=new Blob([lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=(`channel_${d.device_id}_${d.control}.csv`).replace(/[^\w.\-]+/g,'_');
    a.click();
  },

  // ---- Consumption ----
  setPreset(id){ this.period.preset=id; this.period.from=''; this.period.to='';

  setCustom(){ if(this.period.from&&this.period.to){

  async loadConsumption(){
    this.consLoading=true; this.chartBars=[]; this.chartSvg=''; this.chartMeterName='';
    try{
      const r=await fetch('/api/summary/consumption?'+this.periodQuery());
      const d=await r.json();

  async loadHourly(devId){
    try{
      const r=await fetch('/api/meters/'+encodeURIComponent(devId)+'/hourly?'+this.periodQuery());
      const d=await r.json();
      this.chartMeterName=d.display_name||devId;
      this.chartBars=(d.items||[]).map(it=>({t:it.period_start,v:it.consumption_kwh}));
      this.renderChart();
    }catch(e){ console.error(e); }

  renderChart(){
    const bars=this.chartBars.filter(b=>b.v!=null);
    if(!bars.length){ this.chartSvg='<div class="muted">Нет данных за период</div>'; return; }
    const W=Math.max(600,bars.length*14),H=200,pad=30;
    const max=Math.max(...bars.map(b=>b.v),0.001);
    const bw=(W-pad*2)/bars.length;
    let svg=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px">`;
    svg+=`<line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="var(--line)"/>`;
    bars.forEach((b,i)=>{
      const h=(b.v/max)*(H-pad*2),x=pad+i*bw,y=H-pad-h;
      svg+=`<rect class="bar" x="${x+1}" y="${y}" width="${Math.max(1,bw-2)}" height="${h}" `+
        `fill="var(--accent2)" rx="1"><title>${fmtTime(b.t)}: ${b.v.toFixed(3)} кВт·ч</title></rect>`;
    });
    svg+=`<text x="${pad}" y="14" fill="var(--txt2)" font-size="11">max ${max.toFixed(3)} кВт·ч</text>`;
    svg+=`</svg>`;
    this.chartSvg=svg;
  },

  async loadSettings(){

      this.regMeters=rm.items||[];

  async reloadGroups(){
    try{

  // ---- Reports ----
  async initReports(){
    // B2: было loadSettings() без await — loadVedomost() тут же читал
    // this.regMeters для колонки «Комментарий», на первом рендере она
    // была пустой.
    if(!this.regMeters.length) await this.loadSettings();
    if(this.rMode==='vedomost') this.loadVedomost();
    else if(this.rMode==='avail') this.loadAvail();
    else if(this.rMode==='balance') this.loadBalance();
    else if(this.rMode==='profile') this.loadProfile();
    else this.loadCompare();
  },
  _rPeriodQuery(preset, from_, to_){
    if(preset) return 'period='+preset;
    if(from_&&to_) return 'from='+from_+'&to='+to_;
    return 'period=this_month';
  },
  // B3: общая функция экранирования CSV-полей — используется во всех
  // выгрузках, чтобы `;`, кавычка или перевод строки в имени/комментарии
  // не ломали колонки.
  csvCell(v){
    const s=(v==null?'':String(v));
    return /[";\r\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  },
  async loadVedomost(){
    this.rLoading=true;
    const q=this._rPeriodQuery(this.rPeriod,this.rFrom,this.rTo);
    try{
      // Получаем notes из regMeters (уже загружены в настройках)
      const notesMap={};
      this.regMeters.forEach(m=>{ notesMap[m.device_id]=m.notes; });
      const r=await fetch('/api/summary/consumption?'+q);
      const d=await r.json();
      const items=d.items||[];
      this.rTotal=d.consumption_kwh_total||0;
      this.rPeriodLabel=d.period?
        (d.period.description||''):('');
      // Группируем по зонам
      const zones={};
      items.forEach(it=>{
        const z=it.group||'— Без зоны —';
        if(!zones[z]) zones[z]={name:z,items:[],total:0};
        zones[z].items.push({...it,notes:notesMap[it.device_id]||null});
        zones[z].total+=(it.consumption_kwh||0);
      });
      const rows=[];
      const named=Object.keys(zones).filter(k=>k!=='— Без зоны —').sort();
      const order=[...named,'— Без зоны —'].filter(k=>zones[k]);
      order.forEach(z=>{
        rows.push({_zone_sep:z,_zone_kwh:zones[z].total,_key:'z_'+z});
        zones[z].items.forEach((it,i)=>{
          rows.push({...it,_key:it.device_id+'_'+i,_zone_sep:null});
        });
      });
      this.vedomostRows=rows;
    }catch(e){ console.error(e); }
    this.rLoading=false;
  },
  downloadVedomost(){
    const lines=[];
    const pLabel=this.rPeriodLabel||this.rPeriod||'период';
    lines.push('\uFEFF'); // BOM для Excel
    lines.push(`wb-energy-meter — Ведомость расхода (${pLabel})`);
    lines.push('');
    lines.push('Зона;Счётчик;device_id;Комментарий;Расход кВт·ч;Качество');
    let curZone='';
    this.vedomostRows.forEach(r=>{
      if(r._zone_sep){ curZone=r._zone_sep; return; }
      const v=r.consumption_kwh!=null?r.consumption_kwh.toFixed(3):'';
      lines.push([this.csvCell(curZone),this.csvCell(r.display_name),this.csvCell(r.device_id),
        this.csvCell(r.notes||''),v,this.csvCell(r.quality||'')].join(';'));
    });
    lines.push('');
    lines.push(`;;ИТОГО;;${this.rTotal.toFixed(3)};`);
    const blob=new Blob([lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=`vedomost_${this.rPeriod||'custom'}_${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
  },

  async loadProfile(){
    if(!this.profileMeterId){ this.profileLoading=false; return; }
    this.profileLoading=true;
    const q=this._rPeriodQuery(this.profilePeriod,this.profileFrom,this.profileTo);
    try{
      const r=await fetch('/api/meters/'+encodeURIComponent(this.profileMeterId)+'/hourly?'+q);
      const d=await r.json();
      const items=d.items||[];
      this.profileHours=items.map(it=>({
        t:it.period_start, v:it.consumption_kwh, q:it.quality
      }));
      const vals=this.profileHours.filter(h=>h.v!=null).map(h=>h.v);
      this.profileTotal=vals.reduce((a,b)=>a+b,0);
      if(vals.length>0){
        const maxV=Math.max(...vals);
        // B5: ищем пик по объекту (единственная ссылка), а не по
        // значению — иначе при равных значениях подсвечивались бы все
        // совпавшие бары.
        const peak=this.profileHours.find(h=>h.v===maxV);
        this.profilePeak={v:maxV,label:peak?fmtHour(peak.t):'',item:peak||null};
      } else { this.profilePeak={v:0,label:'',item:null}; }
      this.renderProfileSvg();
    }catch(e){ console.error(e); }
    this.profileLoading=false;
  },
  renderProfileSvg(){
    const bars=this.profileHours.filter(b=>b.v!=null);
    if(!bars.length){ this.profileSvg='<div class="muted">Нет данных</div>'; return; }
    const W=Math.max(700,bars.length*12), H=220, padL=48, padR=12, padT=20, padB=30;
    const max=Math.max(...bars.map(b=>b.v),0.001);
    const bw=(W-padL-padR)/bars.length;
    let svg=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px">`;
    // Сетка
    for(let i=0;i<=4;i++){
      const y=padT+(H-padT-padB)*i/4;
      const val=(max*(4-i)/4);
      svg+=`<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="var(--line)" stroke-dasharray="3,3"/>`;
      svg+=`<text x="${padL-4}" y="${y+4}" fill="var(--txt3)" font-size="10" text-anchor="end">${val.toFixed(2)}</text>`;
    }
    // Ось X
    svg+=`<line x1="${padL}" y1="${H-padB}" x2="${W-padR}" y2="${H-padB}" stroke="var(--line)"/>`;
    bars.forEach((b,i)=>{
      const h=(b.v/max)*(H-padT-padB);
      const x=padL+i*bw, y=H-padB-h;
      const color=(b===this.profilePeak.item)?'var(--warn)':'var(--accent2)';
      svg+=`<rect class="bar" x="${x+1}" y="${y}" width="${Math.max(1,bw-2)}" height="${h}" `+
        `fill="${color}" rx="1"><title>${fmtHour(b.t)}: ${b.v.toFixed(3)} кВт·ч</title></rect>`;
      // Метки оси X каждые 24 часа (или каждые 4 для коротких периодов)
      const step=bars.length>72?24:bars.length>24?4:1;
      if(i%step===0){
        const d=new Date(b.t*1000);
        const lbl=bars.length>72?
          `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}`:
          `${String(d.getHours()).padStart(2,'0')}:00`;
        svg+=`<text x="${x+bw/2}" y="${H-padB+14}" fill="var(--txt3)" `+
          `font-size="9" text-anchor="middle">${lbl}</text>`;
      }
    });
    // Подсветка пика
    if(this.profilePeak.v>0){
      svg+=`<text x="${W-padR}" y="${padT}" fill="var(--warn)" `+
        `font-size="10" text-anchor="end">▲ пик: ${this.profilePeak.v.toFixed(3)} кВт·ч (${this.profilePeak.label})</text>`;
    }
    svg+=`</svg>`;
    this.profileSvg=svg;
  },
  downloadProfile(){
    if(!this.profileHours.length) return;
    const lines=['\uFEFF','wb-energy-meter — Профиль нагрузки','',
      'Дата-час;Расход кВт·ч;Качество'];
    this.profileHours.forEach(h=>{
      lines.push([this.csvCell(fmtHour(h.t)),h.v!=null?h.v.toFixed(4):'',this.csvCell(h.q||'')].join(';'));
    });
    lines.push('');
    lines.push(`;ИТОГО;${this.profileTotal.toFixed(3)}`);
    const blob=new Blob([lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=`profile_${this.profileMeterId}_${this.profilePeriod||'custom'}.csv`;
    a.click();
  },

  async loadCompare(){
    this.cmpLoading=true;
    try{
      const [da,db]=await Promise.all([
        fetch('/api/summary/consumption?period='+this.cmpPeriodA).then(r=>r.json()),
        fetch('/api/summary/consumption?period='+this.cmpPeriodB).then(r=>r.json()),
      ]);
      const labelOf=d=>(d.period&&d.period.description)||'период';
      this.cmpLabelA=labelOf(da); this.cmpLabelB=labelOf(db);
      const mapA={},mapB={};
      (da.items||[]).forEach(it=>{ mapA[it.device_id]=it; });
      (db.items||[]).forEach(it=>{ mapB[it.device_id]=it; });
      const ids=[...new Set([...Object.keys(mapA),...Object.keys(mapB)])];
      this.cmpRows=ids.map(id=>{
        const a=mapA[id]?.consumption_kwh??null;
        const b=mapB[id]?.consumption_kwh??null;
        const delta=(a!=null&&b!=null)?b-a:null;
        const pct=(delta!=null&&a!=null&&a>0)?(delta/a*100):null;
        return {
          device_id:id,
          display_name:(mapA[id]||mapB[id])?.display_name||id,
          group:(mapA[id]||mapB[id])?.group||'',
          a,b,delta,pct,
        };
      }).sort((x,y)=>(y.b||0)-(x.b||0));
      this.cmpTotalA=da.consumption_kwh_total||0;
      this.cmpTotalB=db.consumption_kwh_total||0;
    }catch(e){ console.error(e); }
    this.cmpLoading=false;
  },
  downloadCompare(){
    const lines=['\uFEFF','wb-energy-meter — Сравнение периодов','',
      `Счётчик;Зона;${this.cmpLabelA} кВт·ч;${this.cmpLabelB} кВт·ч;Δ кВт·ч;Δ %`];
    this.cmpRows.forEach(r=>{
      lines.push([this.csvCell(r.display_name),this.csvCell(r.group||''),
        r.a!=null?r.a.toFixed(3):'',
        r.b!=null?r.b.toFixed(3):'',
        r.delta!=null?r.delta.toFixed(3):'',
        r.pct!=null?r.pct.toFixed(1)+'%':''].join(';'));
    });
    lines.push('');
    lines.push([`ИТОГО`,'',this.cmpTotalA.toFixed(3),this.cmpTotalB.toFixed(3),
      (this.cmpTotalB-this.cmpTotalA).toFixed(3),
      this.cmpTotalA>0?((this.cmpTotalB-this.cmpTotalA)/this.cmpTotalA*100).toFixed(1)+'%':''].join(';'));
    const blob=new Blob([lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=`compare_${this.cmpPeriodA}_vs_${this.cmpPeriodB}.csv`;
    a.click();
  },

  // ---- Roles ----
  roleLabel(r){return {input:'Ввод',consumer:'Потребитель',other:'Прочее'}[r]||r||'—';},
  roleColor(r){return {input:'var(--ok)',consumer:'var(--accent2)',other:'var(--txt3)'}[r]||'var(--txt3)';},
  async saveRole(deviceId, role){
    try{
      const r=await fetch('/api/registry/meters/'+encodeURIComponent(deviceId)+'/role',
        {method:'PATCH',headers:{'Content-Type':'application/json'},
         body:JSON.stringify({role})});
      if(!r.ok){const e=await r.json();this.showToast(e.error||'Ошибка',false);return;}
      this.showToast('Роль изменена');
      await this.loadSettings(); await this.loadStatus();
    }catch(e){this.showToast('Ошибка: '+e,false);}
  },

  showToast(msg, ok=true){
    clearTimeout(this._toastTimer);
    this.toast={msg,ok};
    this._toastTimer=setTimeout(()=>{ this.toast=null; },3000);
  },
}; }

function lsGet(k,def){ try{ return localStorage.getItem(k)||def; }catch(e){ return def; } }
function lsGetJSON(k,def){
  try{ const v=localStorage.getItem(k); return v?JSON.parse(v):def; }catch(e){ return def; }
}

function dtLocal(d){
  const p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}
function fmtTime(ts){
  return new Date(ts*1000).toLocaleString('ru-RU',
    {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
}
function fmtHour(ts){
  const d=new Date(ts*1000);
  return d.toLocaleString('ru-RU',
    {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
}
function fmtSeconds(s){
  s=Math.round(s); if(s<0) return '—';
  if(s<60) return s+'с';
  if(s<3600){ return Math.floor(s/60)+'мин'; }
  if(s<86400){ const h=Math.floor(s/3600),m=Math.floor((s%3600)/60);
    return h+'ч'+(m?' '+m+'мин':''); }
  const d=Math.floor(s/86400),h=Math.floor((s%86400)/3600);
  return d+'д'+(h?' '+h+'ч':'');
}

                       padding:8px 12px;border-radius:7px;font-size:13px;font-family:inherit">
          <template x-for="p in planPlans" :key="p.id">
            <option :value="p.id" x-text="p.name+(p.is_default?' (по умолчанию)':'')"></option>
          </template>
        </select>
        <template x-for="p in presets" :key="p.id">
          <button :class="{active:planPeriod==p.id}"
                  style="background:var(--bg2);border:1px solid var(--line);color:var(--txt2);
                         cursor:pointer;padding:7px 12px;border-radius:7px;font-size:12px;font-weight:500"
                  :style="planPeriod==p.id?'background:var(--accent);color:#fff;border-color:var(--accent)':''"
                  @click="setPlanPeriod(p.id)" x-text="p.label"></button>
        </template>
        <div class="spacer"></div>
        <div class="plan-legend">
          <span><i class="ll-swatch" style="background:var(--ok)"></i>до 70% тока</span>
          <span><i class="ll-swatch" style="background:var(--warn)"></i>70–90%</span>
          <span><i class="ll-swatch" style="background:var(--err)"></i>выше 90%</span>
        </div>
        <button class="ico-btn" @click="togglePlanEdit()"
                x-text="planEditMode?'✓ Готово':'✎ Редактировать'"></button>
      </div>

      <div class="plan-layout" :class="{'plan-edit-open':planEditMode}">
        <div>
          <div id="site-plan-map" x-ref="planMap" x-init="initPlanMap()"></div>
        </div>

        <!-- Панель редактирования — обычный Alpine-контент СНАРУЖИ
             контейнера карты. Внутрь #site-plan-map Alpine ничего не
             биндит: слои, попапы и стили правит только JS через API
             Leaflet (см. AGENTS.md, ТЗ §3.4). -->
        <div class="plan-side" x-show="planEditMode">
          <div>
            <h3>Загрузить новый план</h3>
            <div class="plan-upload-form" style="margin-top:8px">
              <input type="text" placeholder="Название плана (например, «Цех 1, этаж 1»)"
                     x-model="planUploadName">
              <input type="file" accept="image/png,image/jpeg" x-ref="planFileInput">
              <button class="btn btn-primary btn-sm" :disabled="planUploadBusy"
                      @click="uploadPlan()">
                <span x-show="!planUploadBusy">Загрузить</span>
                <span x-show="planUploadBusy"><span class="spin" style="width:12px;height:12px"></span> Загрузка…</span>
              </button>
              <div class="muted" style="color:var(--err)" x-show="planUploadError" x-text="planUploadError"></div>
              <div class="muted">Принимаются PNG и JPEG, до 10 МБ. SVG не поддерживается — экспортируйте план в PNG.</div>
            </div>
          </div>

          <template x-if="planCurrent">
            <div>
              <h3>Зоны на плане</h3>
              <div class="plan-zone-list" style="margin-top:8px">
                <template x-for="g in zones" :key="g.id">
                  <div class="plan-zone-row">
                    <span class="pzr-dot" :style="`background:${g.color||'var(--txt3)'}`"></span>
                    <span class="pzr-name" x-text="g.name"></span>
                    <span class="pzr-check" x-show="isZoneOnPlan(g.id)" title="Уже нанесена на план">✓</span>
                    <button class="btn btn-sm btn-secondary"
                            :disabled="planDrawingGroupId!==null"
                            @click="startZoneDraw(g)"
                            x-text="isZoneOnPlan(g.id)?'Перерисовать':'Обвести'"></button>
                    <button class="btn btn-sm btn-danger" x-show="isZoneOnPlan(g.id)"
                            @click="planConfirmRemoveZone={group_id:g.id,name:g.name}">✕</button>
                  </div>
                </template>
                <div class="muted" x-show="!zones.length">
                  Сначала создайте зоны на вкладке «Настройки».
                </div>
              </div>
              <div class="muted" x-show="planDrawingGroupId!==null" style="margin-top:8px">
                Обведите контур на плане (клик — точка, двойной клик — завершить), затем
                поправьте вершины при необходимости.
              </div>
              <button class="btn btn-primary btn-sm" x-show="planHasPendingZoneDraw"
                      style="margin-top:8px" @click="saveZoneDraw()">Сохранить контур</button>
              <button class="btn btn-secondary btn-sm" x-show="planHasPendingZoneDraw"
                      style="margin-top:8px" @click="cancelZoneDraw()">Отмена</button>

              <h3 style="margin-top:6px">Кабельные связи</h3>
              <div class="plan-zone-list">
                <template x-for="l in (planCurrent.links||[])" :key="l.id">
                  <div class="plan-link-row">
                    <div class="plr-top">
                      <span x-text="(zoneNameById(l.from_zone_id)||'?')+' → '+(zoneNameById(l.to_zone_id)||'?')"></span>
                      <button class="btn btn-sm btn-danger"
                              @click="planConfirmDeleteLink={id:l.id,label:l.label||''}">✕</button>
                    </div>
                    <span class="muted" x-text="l.label||'без подписи'"></span>
                  </div>
                </template>
              </div>
              <button class="btn btn-sm" :class="planAddingLink?'btn-secondary':'btn-primary'"
                      @click="toggleAddLink()"
                      x-text="planAddingLink?'Отменить добавление связи':'Добавить связь'"></button>
              <div class="muted" x-show="planAddingLink && !planLinkFromZoneId">
                Кликните по зоне-источнику на плане.
              </div>
              <div class="muted" x-show="planAddingLink && planLinkFromZoneId && !planLinkForm.toZoneId">
                Теперь кликните по зоне-приёмнику.
              </div>
              <template x-if="planAddingLink && planLinkForm.toZoneId">
                <div style="display:flex;flex-direction:column;gap:8px">
                  <input type="text" placeholder="Подпись, например «АВВГ 4х95, 120 м»"
                         x-model="planLinkForm.label">
                  <select x-model="planLinkForm.sourceMeterId"
                          style="background:var(--bg3);border:1px solid var(--line);color:var(--txt);
                                 padding:7px 9px;border-radius:6px;font-size:13px;font-family:inherit">
                    <option value="">— без счётчика-источника —</option>
                    <template x-for="m in regMeters" :key="m.device_id">
                      <option :value="m.id" x-text="m.display_name"></option>
                    </template>
                  </select>
                  <input type="number" step="0.1" min="0" placeholder="Допустимый ток кабеля, А"
                         x-model="planLinkForm.ratedCurrentA">
                  <button class="btn btn-primary btn-sm" @click="saveLink()">Сохранить связь</button>
                </div>
              </template>

              <h3 style="margin-top:6px">План</h3>
              <div style="display:flex;gap:8px;flex-wrap:wrap">
                <button class="btn btn-sm btn-secondary" @click="renamePlanPrompt()">Переименовать</button>
                <button class="btn btn-sm btn-secondary" x-show="!planCurrent.is_default"
                        @click="setDefaultPlan()">Сделать по умолчанию</button>
                <button class="btn btn-sm btn-danger"
                        @click="planConfirmDeletePlan={id:planCurrent.id,name:planCurrent.name}">Удалить план</button>
              </div>
            </div>
          </template>
        </div>
      </div>
    </div>
  </div>

  <!-- ПЛАН v2 (ТЗ §7): просмотр + редактирование (Stage D) — список
       планов, карта, инспектор по клику, перетаскивание меток, добавление/
       удаление элементов и связей в локальном черновике (§7.3) с undo/redo,
       атомарное сохранение через /layout с обработкой конфликта ревизии
       (A35, §13). Своя L.Map (_planV2Map ниже, вне реактивности Alpine) —
       та же причина, что у v1 плана выше: Leaflet держит собственный DOM,
       Proxy-обёртка его ломает. Перетаскивание — через leaflet-geoman
       (layer.pm.enableLayerDrag()/'pm:dragend'): L.circleMarker не
       поддерживает draggable:true нативно (это только у L.Marker), а
       geoman уже используется в проекте для зон v1 — тот же приём. -->
  <div x-show="tab=='planv2'">
    <template x-if="!planV2Loading && planV2Plans.length===0">
      <div class="plan-empty" style="text-align:left;max-width:560px;margin:0 auto;line-height:1.5">
        <b>Планов v2 пока нет.</b><br>
        Создайте план ниже — но чтобы на нём можно было расставить точки учёта и узлы
        сети, они сначала должны появиться в новой модели данных. Если легаси-данные
        (счётчики, группы) ещё не переносились, справочник точек в редакторе плана
        будет пуст: перенесите их на вкладке «Настройки», либо прямо отсюда.
        <div style="margin-top:12px">
          <button class="btn btn-primary" @click="migrateLegacyConfirm=true"
                  :disabled="migrateLegacyBusy">Перенести легаси-данные</button>
        </div>
      </div>
    </template>
    <div x-show="planV2Plans.length>0">
      <div class="plan-toolbar">
        <select x-model.number="planV2CurrentId" @change="selectPlanV2(planV2CurrentId)">
          <template x-for="p in planV2Plans" :key="p.id">
            <option :value="p.id"
                    x-text="p.name + (p.plan_kind==='floor' ? ' (помещения)' : ' (однолинейная)')"></option>
          </template>
        </select>
        <div class="spacer"></div>
        <template x-if="planV2PendingCount()>0">
          <div style="display:flex;gap:8px;align-items:center">
            <button class="ico-btn" :disabled="!planV2History.length" @click="planV2Undo()"
                    title="Отменить последнее действие">↺</button>
            <button class="ico-btn" :disabled="!planV2Future.length" @click="planV2Redo()"
                    title="Вернуть отменённое">↻</button>
            <span class="muted mono" x-text="'изменений: '+planV2PendingCount()"></span>
            <button class="btn btn-sm btn-secondary" @click="planV2RequestDiscard()">Отменить черновик</button>
            <button class="btn btn-sm btn-primary" :disabled="planV2Saving" @click="planV2SaveLayout()">
              <span x-show="!planV2Saving">Сохранить</span>
              <span x-show="planV2Saving"><span class="spin" style="width:12px;height:12px"></span> Сохранение…</span>
            </button>
          </div>
        </template>
        <button class="ico-btn" @click="togglePlanV2Edit()"
                x-text="planV2EditMode?'✓ Готово':'✎ Редактировать'"></button>
      </div>

      <div class="plan-layout"
           :class="{'plan-edit-open': planV2EditMode || planV2SelectedItem || planV2SelectedEdgeView}">
        <div id="site-plan-v2-map" x-ref="planV2Map" :class="{'planv2-placing':planV2Placing}"></div>

        <div class="plan-side" x-show="planV2EditMode || planV2SelectedItem || planV2SelectedEdgeView">
          <template x-if="planV2SelectedItem">
            <div>
              <h3 x-text="planV2ItemKindLabel(planV2SelectedItem.kind)"></h3>
              <div x-show="planV2SelectedItem.label" x-text="planV2SelectedItem.label"></div>
              <div class="muted mono" x-text="'id: '+planV2SelectedItem.id"></div>
              <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
                <button class="ico-btn" @click="planV2SelectedItem=null">Закрыть</button>
                <!-- ТЗ §8.3: тот же инспектор, что и на вкладке «Структура» —
                     см. openInspector в <script>. Доступно только для
                     point/node/group — у location/port/annotation своего
                     инспектора в этой задаче нет (это координаты плана, не
                     предмет учёта/сети). -->
                <button class="btn btn-sm btn-secondary" x-show="planV2ItemInspectorTarget(planV2SelectedItem)"
                        @click="openInspectorForPlanItem(planV2SelectedItem)">Открыть в инспекторе</button>
                <button class="btn btn-sm btn-danger" x-show="planV2EditMode"
                        @click="planV2RemoveItem(planV2SelectedItem); planV2SelectedItem=null">Убрать с плана</button>
              </div>
            </div>
          </template>

          <template x-if="planV2SelectedEdgeView && !planV2SelectedItem">
            <div>
              <h3>Связь на плане</h3>
              <div class="muted mono" x-text="'edge_id: '+planV2SelectedEdgeView.edge_id"></div>
              <div class="muted" x-text="planV2SelectedEdgeView.waypoints ? 'Линия: нарисована вручную' : 'Линия: прямая между метками'"></div>
              <button class="btn btn-sm btn-secondary" style="margin-top:8px"
                      @click="openInspector('edge', planV2SelectedEdgeView.edge_id)">Открыть в инспекторе</button>

              <template x-if="planV2EditMode && planV2DrawingEdgeKey===String(planV2SelectedEdgeView.id)">
                <div style="display:flex;flex-direction:column;gap:8px;margin-top:10px">
                  <div class="muted">Кликайте по плану, чтобы добавлять точки линии; двойной клик — завершить.</div>
                  <div style="display:flex;gap:8px">
                    <button class="btn btn-sm btn-primary" :disabled="!planV2HasPendingEdgeDraw"
                            @click="planV2SaveDrawnWaypoints()">Сохранить линию</button>
                    <button class="btn btn-sm btn-secondary" @click="planV2CancelDrawWaypoints()">Отмена</button>
                  </div>
                </div>
              </template>
              <template x-if="planV2EditMode && planV2DrawingEdgeKey!==String(planV2SelectedEdgeView.id)">
                <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
                  <button class="btn btn-sm btn-secondary" :disabled="planV2DrawingEdgeKey!==null"
                          @click="planV2StartDrawWaypoints(planV2SelectedEdgeView)"
                          x-text="planV2SelectedEdgeView.waypoints ? 'Перерисовать линию' : 'Нарисовать линию'"></button>
                  <button class="btn btn-sm btn-secondary" x-show="planV2SelectedEdgeView.waypoints"
                          :disabled="planV2DrawingEdgeKey!==null"
                          @click="planV2ClearWaypoints(planV2SelectedEdgeView)">Сделать прямой</button>
                </div>
              </template>

              <div style="display:flex;gap:8px;margin-top:10px">
                <button class="ico-btn" @click="planV2SelectedEdgeView=null">Закрыть</button>
                <button class="btn btn-sm btn-danger" x-show="planV2EditMode && planV2DrawingEdgeKey===null"
                        @click="planV2RemoveEdgeView(planV2SelectedEdgeView); planV2SelectedEdgeView=null">Удалить связь</button>
              </div>
            </div>
          </template>

          <template x-if="planV2EditMode && !planV2SelectedItem && !planV2SelectedEdgeView">
            <div>
              <h3>Добавить элемент</h3>
              <div style="display:flex;flex-direction:column;gap:8px">
                <select x-model="planV2AddKind">
                  <option value="">— тип элемента —</option>
                  <option value="point">Точка учёта</option>
                  <option value="location">Место</option>
                  <option value="node">Узел сети</option>
                  <option value="port">Переход на другой план</option>
                  <option value="annotation">Подпись</option>
                </select>
                <select x-show="planV2AddKind==='point'" x-model.number="planV2AddRefId">
                  <option value="">— точка —</option>
                  <template x-for="p in planV2Points" :key="p.id">
                    <option :value="p.id" x-text="p.name"></option>
                  </template>
                </select>
                <select x-show="planV2AddKind==='location'" x-model.number="planV2AddRefId">
                  <option value="">— место —</option>
                  <template x-for="l in planV2Locations" :key="l.id">
                    <option :value="l.id" x-text="l.name"></option>
                  </template>
                </select>
                <select x-show="planV2AddKind==='node' || planV2AddKind==='port'" x-model.number="planV2AddRefId">
                  <option value="">— узел —</option>
                  <template x-for="n in planV2Nodes" :key="n.id">
                    <option :value="n.id" x-text="n.name"></option>
                  </template>
                </select>
                <select x-show="planV2AddKind==='port'" x-model.number="planV2AddTargetPlanId">
                  <option value="">— ведёт на план (необязательно) —</option>
                  <template x-for="p in planV2Plans" :key="p.id">
                    <option :value="p.id" x-text="p.name"></option>
                  </template>
                </select>
                <input type="text" placeholder="Подпись (необязательно)" x-model="planV2AddLabel"
                       x-show="planV2AddKind">
                <button class="btn btn-sm btn-primary" x-show="planV2AddKind && !planV2Placing"
                        @click="planV2StartPlace()">Разместить на карте</button>
                <div class="muted" x-show="planV2Placing">Кликните на плане, чтобы поставить метку.</div>
                <button class="btn btn-sm btn-secondary" x-show="planV2Placing" @click="planV2CancelPlace()">Отмена</button>
              </div>

              <h3 style="margin-top:14px">Элементы на плане</h3>
              <div class="plan-zone-list">
                <template x-for="it in _planV2EffectiveItems()" :key="it.id">
                  <div class="plan-zone-row">
                    <span class="pzr-dot" :style="`background:${planV2ItemColor(it.kind)}`"></span>
                    <span class="pzr-name" x-text="(it.label||planV2ItemKindLabel(it.kind))"></span>
                    <button class="btn btn-sm btn-danger" @click="planV2RemoveItem(it)">✕</button>
                  </div>
                </template>
                <div class="muted" x-show="!_planV2EffectiveItems().length">Элементов пока нет.</div>
              </div>

              <h3 style="margin-top:14px">Связи (edge_views)</h3>
              <div class="plan-zone-list">
                <template x-for="v in _planV2EffectiveEdgeViews()" :key="v.id">
                  <div class="plan-zone-row" style="cursor:pointer"
                       @click="planV2SelectedItem=null; planV2SelectedEdgeView=v">
                    <span class="pzr-name" x-text="'edge_id: '+v.edge_id+(v.waypoints?' 🖊':'')"></span>
                    <button class="btn btn-sm btn-danger" @click.stop="planV2RemoveEdgeView(v)">✕</button>
                  </div>
                </template>
                <div class="muted" x-show="!_planV2EffectiveEdgeViews().length">Связей пока нет.</div>
              </div>
              <button class="btn btn-sm" :class="planV2AddingEdgeView?'btn-secondary':'btn-primary'"
                      @click="planV2ToggleAddingEdgeView()"
                      x-text="planV2AddingEdgeView?'Отменить добавление связи':'Добавить связь'"></button>
              <template x-if="planV2AddingEdgeView">
                <div style="display:flex;flex-direction:column;gap:8px;margin-top:8px">
                  <select x-model.number="planV2EdgeForm.edgeId">
                    <option value="">— электрическая связь (edge) —</option>
                    <template x-for="e in planV2Edges" :key="e.id">
                      <option :value="e.id" x-text="(e.code||('#'+e.id))+' '+(e.name||'')"></option>
                    </template>
                  </select>
                  <select x-model="planV2EdgeForm.fromItemKey">
                    <option value="">— откуда (необязательно) —</option>
                    <template x-for="it in planV2NodeLikeItems()" :key="it.id">
                      <option :value="String(it.id)" x-text="it.label||('элемент '+it.id)"></option>
                    </template>
                  </select>
                  <select x-model="planV2EdgeForm.toItemKey">
                    <option value="">— куда (необязательно) —</option>
                    <template x-for="it in planV2NodeLikeItems()" :key="it.id">
                      <option :value="String(it.id)" x-text="it.label||('элемент '+it.id)"></option>
                    </template>
                  </select>
                  <button class="btn btn-primary btn-sm" @click="planV2SaveEdgeDraft()">Добавить в черновик</button>
                </div>
              </template>
            </div>
          </template>
        </div>
      </div>
    </div>
  </div>

  <!-- CONSUMPTION -->
  <template x-if="tab=='consumption'">
    <div>
      <div class="periods">
        <template x-for="p in presets" :key="p.id">
          <button :class="{active:period.preset==p.id}" @click="setPreset(p.id)" x-text="p.label"></button>
        </template>
        <div class="custom">
          <input type="date" x-model="period.from">
          <span class="muted">—</span>
          <input type="date" x-model="period.to">
          <button @click="setCustom()">Применить</button>
        </div>
      </div>
      <template x-if="consLoading">
        <div class="empty"><span class="spin"></span> считаю расход…</div>
      </template>
      <template x-if="!consLoading">
        <div>
          <table>
            <thead><tr><th>Счётчик</th><th>Группа</th>
              <th class="num">Расход, кВт·ч</th><th>Качество</th></tr></thead>
            <tbody>
              <template x-for="it in consItems" :key="it.device_id">
                <tr @click="openDetail(it.device_id)" style="cursor:pointer">
                  <td x-text="it.display_name"></td>
                  <td class="muted" x-text="it.group||'—'"></td>
                  <td class="num mono" x-text="it.consumption_kwh!=null?fmt(it.consumption_kwh,3):'—'"></td>
                  <td><span class="q" :style="qualityStyle(it.quality)" x-text="qualityLabel(it.quality)"></span></td>
                </tr>
              </template>
            </tbody>
            <tfoot><tr><td colspan="2">Итого</td>
              <td class="num mono" x-text="fmt(consTotal,3)"></td>
              <td x-text="consAnyUnknown?'частично':''"></td></tr></tfoot>
          </table>
          <div class="chart-wrap" x-show="chartBars.length>0">
            <h3 x-text="'Почасовой расход — '+(chartMeterName||'')"></h3>
            <div x-html="chartSvg"></div>
            <div class="muted" style="margin-top:8px">Кликните на счётчик для графика</div>
          </div>
        </div>
      </template>
    </div>
  </template>

  <!-- SETTINGS -->
  <template x-if="tab=='settings'">
    <div>
      <!-- Плашка о неприменённых изменениях конфига драйвера (ТЗ v0.10.0) -->
      <template x-if="uptimePending.length>0">
        <div class="wbs-banner">
          <div>
            <b>Конфиг опроса изменён для <span x-text="uptimePending.length"></span>
              счётчиков, но драйвер не перезапущен.</b><br>
            Изменения вступят в силу после перезапуска.
            <span class="mono" style="font-size:11px" x-text="uptimePending.join(', ')"></span>
          </div>
          <button class="btn btn-primary" @click="uptimeRestartConfirm=true"
                  :disabled="uptimeBusy">Перезапустить опрос</button>
        </div>
      </template>

      <!-- Обновление (самообновление из GitHub, ТЗ v0.9.0) -->
      <div class="settings-section">
        <h2>Обновление</h2>

        <!-- 6. Идёт обновление -->
        <template x-if="updIsActive">
          <div class="upd-card">
            <div class="upd-progress">
              <span class="spin"></span>
              <span class="upd-step" x-text="updStatus.step_label || updStateLabel(updStatus.state)"></span>
            </div>
            <div class="upd-msg">
              Сервис может на короткое время перестать отвечать — это
              нормальная часть перезапуска, страница продолжает опрашивать
              статус автоматически.
            </div>
          </div>
        </template>

        <!-- Сервис не отвечает 120 c подряд во время опроса -->
        <template x-if="updStatus && updStatus.state=='unreachable'">
          <div class="upd-banner upd-banner-err">
            Не удалось связаться с сервисом. Обновите страницу через минуту
            или проверьте по SSH:
            <code>journalctl -u wb-energy-meter -n 50</code>
          </div>
        </template>

        <!-- 7/8/9. Терминальные состояния: успех / откат / провал -->
        <template x-if="updIsTerminal && !updResultHidden">
          <div class="upd-banner"
               :class="updStatus.state=='success' ? 'upd-banner-ok'
                       : (updStatus.state=='rolled_back' ? 'upd-banner-warn' : 'upd-banner-err')">
            <div class="upd-row">
              <b x-text="updStatus.state=='success'
                    ? ('Обновлено до ' + (updStatus.to_version || ''))
                    : (updStatus.state=='rolled_back'
                        ? ('Обновление не встало, вернулись на ' + (updStatus.from_version || 'предыдущую версию'))
                        : 'Обновление не удалось')"></b>
              <button class="btn btn-sm btn-secondary" @click="updResultHidden=true">Скрыть</button>
            </div>
            <div class="upd-msg" x-show="updStatus.error" x-text="updStatus.error"></div>
            <template x-if="updStatus.state=='success'">
              <button class="btn btn-sm btn-primary" style="margin-top:10px"
                      @click="location.reload()">Перезагрузить страницу</button>
            </template>
            <template x-if="(updStatus.log_tail||[]).length">
              <details style="margin-top:10px">
                <summary style="cursor:pointer;color:var(--txt2);font-size:12px">Журнал обновления</summary>
                <div class="upd-log" x-text="(updStatus.log_tail||[]).join('\n')"></div>
              </details>
            </template>
          </div>
        </template>

        <!-- 1-4. Покой / проверка / нет обновлений / есть обновление -->
        <template x-if="!updIsActive && (!updStatus || updStatus.state!='unreachable') && !(updIsTerminal && !updResultHidden)">
          <div class="upd-card" :class="{'upd-avail': updChecked && updAvailable}">
            <div class="upd-row">
              <div>
                <template x-if="!updChecked">
                  <div class="upd-meta">Текущая версия: <b x-text="'v'+(version||'—')"></b></div>
                </template>
                <template x-if="updChecked && !updAvailable">
                  <div class="upd-meta">
                    У вас последняя версия
                    <span class="muted" x-show="updCheckedAt">
                      · проверено <span x-text="fmtTime(updCheckedAt)"></span></span>
                  </div>
                </template>
                <template x-if="updChecked && updAvailable">
                  <div>
                    <div class="upd-meta">
                      Доступно обновление: <b x-text="updRemote.version"></b>
                      <span class="mono muted" x-text="' · '+updShortSha(updRemote.commit)"></span>
                    </div>
                    <div class="upd-msg" x-show="updRemote.message" x-text="updRemote.message"></div>
                    <div class="upd-msg" x-show="updRemote.date"
                         x-text="updRemote.date ? fmtTime(new Date(updRemote.date).getTime()/1000) : ''"></div>
                  </div>
                </template>
                <template x-if="updCheckError">
                  <div class="upd-msg" style="color:var(--err)" x-text="updCheckError"></div>
                </template>
              </div>
              <div style="display:flex;gap:8px;align-items:center">
                <button class="btn btn-sm btn-secondary" @click="checkUpdate()" :disabled="updChecking">
                  <span x-show="updChecking"><span class="spin"></span> Проверка…</span>
                  <span x-show="!updChecking">Проверить обновления</span>
                </button>
                <template x-if="updChecked && updAvailable && updAllowFromUi">
                  <button class="btn btn-sm btn-primary" @click="updConfirmOpen=true">Обновить сейчас</button>
                </template>
              </div>
            </div>
            <template x-if="updChecked && updAvailable && !updAllowFromUi">
              <div class="upd-msg" style="color:var(--warn)">
                Обновление через веб-интерфейс запрещено администратором
                (update.allow_from_ui: false в конфиге). Обновите вручную по
                SSH: scripts/install-from-github.sh
              </div>
            </template>
          </div>
        </template>
      </div>

      <!-- Перенос легаси-данных в новую модель точек учёта -->
      <div class="settings-section">
        <h2>Перенос легаси-данных</h2>
        <div class="muted" style="margin-bottom:12px;line-height:1.5">
          Переносит существующие счётчики и группы в новую модель точек учёта.
          Без этого шага справочник точек учёта в редакторе плана будет пуст.
          Действие безопасно повторять — уже перенесённые счётчики просто пропускаются.
          Перед переносом автоматически делается бэкап базы данных.
        </div>
        <div style="display:flex;gap:8px;align-items:center;margin-bottom:12px">
          <button class="btn btn-primary" @click="migrateLegacyConfirm=true"
                  :disabled="migrateLegacyBusy">Перенести легаси-данные</button>
        </div>
        <!-- Во время миграции -->
        <template x-if="migrateLegacyBusy">
          <div style="padding:12px;background:var(--bg3);border-radius:6px;
                      display:flex;gap:8px;align-items:center;color:var(--txt2)">
            <span class="spin"></span>
            <span>Выполняется перенос…</span>
          </div>
        </template>
        <!-- После успешной миграции -->
        <template x-if="migrateLegacyResult && !migrateLegacyError">
          <div class="upd-banner upd-banner-ok" style="line-height:1.5">
            <b>Перенос завершён</b><br>

            пропущено (уже перенесены): <b x-text="(migrateLegacyResult.skipped_points||[]).length"></b>

                <ul style="margin:4px 0 0 16px;padding:0">

        </template>

      <!-- Управление зонами -->

        <h2>Зоны</h2>
        <table class="reg-table" style="margin-bottom:12px">
          <thead><tr>
            <th style="width:36px">Цвет</th>
            <th>Название</th><th>Счётчиков</th><th style="width:200px">Действия</th>
          </tr></thead>

            <template x-for="z in zones" :key="z.id">
              <tr>
                <td>
                  <input type="color" :value="z.color||'#2f9e8f'"
                    @change="changeZoneColor(z,$event.target.value)"
                    title="Цвет зоны"
                    style="width:26px;height:22px;border:none;background:none;
                           cursor:pointer;padding:0;vertical-align:middle">
                </td>
                <template x-if="zoneEditId !== z.id">
                  <td style="font-weight:600" x-text="z.name"></td>
                </template>
                <template x-if="zoneEditId === z.id">
                  <td class="edit-row">
                    <input x-model="zoneEditName"
                           @keydown.enter="saveZoneEdit(z.id)"
                           @keydown.escape="zoneEditId=null">
                  </td>
                </template>
                <td class="muted" x-text="z.meter_count + ' шт'"></td>
                <td>
                  <template x-if="zoneEditId !== z.id">
                    <div style="display:flex;gap:6px">
                      <button class="btn btn-sm btn-secondary" @click="startZoneEdit(z)">✏ Переименовать</button>
                      <button class="btn btn-sm btn-danger" @click="askDeleteZone(z)">✕</button>
                    </div>
                  </template>
                  <template x-if="zoneEditId === z.id">
                    <div style="display:flex;gap:6px">
                      <button class="btn btn-sm btn-success" @click="saveZoneEdit(z.id)">✓ Сохранить</button>
                      <button class="btn btn-sm btn-secondary" @click="zoneEditId=null">Отмена</button>
                    </div>
                  </template>
                </td>
              </tr>
            </template>
            <template x-if="zones.length===0">
              <tr><td colspan="4" style="text-align:center;color:var(--txt3);padding:16px">
                Зон пока нет. Создайте первую.
              </td></tr>
            </template>
          </tbody>
        </table>
        <!-- Создать новую зону -->
        <div style="display:flex;gap:8px;align-items:center">
          <input x-model="zoneNewName" placeholder="Название новой зоны"
                 @keydown.enter="createZone()"
                 style="background:var(--bg3);border:1px solid var(--line);
                        color:var(--txt);padding:7px 11px;border-radius:6px;
                        font-size:13px;font-family:inherit;width:220px">
          <button class="btn btn-primary" @click="createZone()">+ Создать зону</button>
        </div>
      </div>

      <!-- Зарегистрированные счётчики -->
      <div class="settings-section">
        <h2>Зарегистрированные счётчики</h2>
        <template x-if="settingsLoading">
          <div class="empty"><span class="spin"></span> загрузка…</div>
        </template>
        <template x-if="!settingsLoading">
          <div>
            <!-- Панель массового назначения зоны -->
            <div class="bulk-bar" x-show="selectedMeters.length>0">
              <span>Выбрано <b x-text="selectedMeters.length"></b></span>
              <select x-model="bulkGroup">
                <option value="">— Без зоны —</option>
                <template x-for="g in allGroups" :key="g">
                  <option :value="g" x-text="g"></option>
                </template>
              </select>
              <button class="btn btn-sm btn-primary" @click="applyBulkGroup()">Применить</button>
              <button class="btn btn-sm btn-secondary" @click="selectedMeters=[]">Отмена</button>
            </div>
            <table class="reg-table">
              <thead><tr>
                <th style="width:26px">
                  <input type="checkbox" :checked="allSelected" @change="toggleSelectAll($event)">
                </th>
                <th>Имя</th><th>Группа</th><th>Комментарий</th><th>Роль</th><th>device_id</th>
                <th>Serial</th><th style="width:120px">Uptime</th>
                <th style="width:160px">Действия</th>
              </tr></thead>
              <tbody>
                <template x-for="m in regMeters" :key="m.device_id">
                  <tr>
                    <!-- Чекбокс выбора для массового назначения зоны -->
                    <td><input type="checkbox" :value="m.device_id" x-model="selectedMeters"></td>

                    <!-- Имя -->
                    <td>
                      <template x-if="editingId !== m.device_id">
                        <span x-text="m.display_name"></span>
                      </template>
                      <template x-if="editingId === m.device_id">
                        <input x-model="editName" @keydown.enter="saveEdit(m.device_id)" @keydown.escape="editingId=null"
                               style="background:var(--bg3);border:1px solid var(--accent);
                                      color:var(--txt);padding:5px 9px;border-radius:5px;
                                      font-size:13px;font-family:inherit;width:100%">
                      </template>
                    </td>

                    <!-- Группа: выпадающий список вместо свободного текста (A8) -->
                    <td>
                      <template x-if="editingId !== m.device_id">
                        <span class="muted" x-text="m.group_name||'—'"></span>
                      </template>
                      <template x-if="editingId === m.device_id">
                        <div>
                          <select x-model="editGroup"
                                  style="background:var(--bg3);border:1px solid var(--accent);
                                         color:var(--txt);padding:5px 9px;border-radius:5px;
                                         font-size:13px;font-family:inherit;width:100%">
                            <option value="">— Без зоны —</option>
                            <template x-for="g in allGroups" :key="g">
                              <option :value="g" x-text="g"></option>
                            </template>
                            <option value="__new__">+ Новая зона…</option>
                          </select>
                          <template x-if="editGroup==='__new__'">
                            <input x-model="editGroupNew" placeholder="имя новой зоны"
                                   @keydown.enter="saveEdit(m.device_id)"
                                   style="margin-top:5px;background:var(--bg3);border:1px solid var(--accent);
                                          color:var(--txt);padding:5px 9px;border-radius:5px;
                                          font-size:13px;font-family:inherit;width:100%">
                          </template>
                        </div>
                      </template>
                    </td>

                    <!-- Комментарий -->
                    <td>
                      <template x-if="editingId !== m.device_id">
                        <span class="muted" style="font-style:italic;font-size:12px;max-width:180px;
                            overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block"
                            x-text="m.notes||'—'" :title="m.notes||''"></span>
                      </template>
                      <template x-if="editingId === m.device_id">
                        <input x-model="editNotes" placeholder="комментарий (необяз.)"
                               @keydown.escape="editingId=null"
                               style="font-style:italic;background:var(--bg3);border:1px solid var(--accent);
                                      color:var(--txt);padding:5px 9px;border-radius:5px;
                                      font-size:13px;font-family:inherit;width:100%">
                      </template>
                    </td>

                    <!-- Роль -->
                    <td style="white-space:nowrap">
                      <template x-if="editingId !== m.device_id">
                        <span :style="`color:${roleColor(m.role)};font-weight:600;font-size:12px`"
                              x-text="roleLabel(m.role)"></span>
                      </template>
                      <template x-if="editingId === m.device_id">
                        <span>
                          <button class="role-btn" :class="editRole==='input'?'active-input':''"
                            @click="editRole='input'">Ввод</button>
                          <button class="role-btn" :class="editRole==='consumer'?'active-consumer':''"
                            @click="editRole='consumer'">Потребитель</button>
                          <button class="role-btn" :class="editRole==='other'?'active-other':''"
                            @click="editRole='other'">Прочее</button>
                        </span>
                      </template>
                    </td>

                    <td class="muted mono" style="font-size:12px" x-text="m.device_id"></td>
                    <td class="muted mono" style="font-size:12px" x-text="m.serial_number||'—'"></td>

                    <!-- Uptime: бейдж состояния канала (ТЗ v0.10.0).
                         Клик раскрывает пояснение из detail. -->
                    <td>
                      <span class="badge" style="cursor:pointer"
                            :style="uptimeBadgeStyle(uptimeStateOf(m.device_id))"
                            :title="uptimeDetailOf(m.device_id)"
                            @click="uptimeOpenId = (uptimeOpenId===m.device_id ? null : m.device_id)"
                            x-text="uptimeLabel(uptimeStateOf(m.device_id))"></span>
                      <template x-if="uptimeOpenId===m.device_id">
                        <div class="wbs-detail" x-text="uptimeDetailOf(m.device_id)"></div>
                      </template>
                    </td>

                    <td>
                      <template x-if="editingId !== m.device_id">
                        <div style="display:flex;gap:6px">
                          <button class="btn btn-sm btn-secondary"
                            @click="startEdit(m)">✏ Изменить</button>
                          <button class="btn btn-sm btn-danger"
                            @click="askDelete(m)">✕</button>
                        </div>
                      </template>
                      <template x-if="editingId === m.device_id">
                        <div style="display:flex;gap:6px">
                          <button class="btn btn-sm btn-success"
                            @click="saveEdit(m.device_id)">✓ Сохранить</button>
                          <button class="btn btn-sm btn-secondary"
                            @click="editingId=null">Отмена</button>
                        </div>
                      </template>
                    </td>
                  </tr>
                </template>
                <template x-if="regMeters.length===0">
                  <tr><td colspan="9" style="text-align:center;color:var(--txt3);padding:20px">
                    Реестр пуст. Добавьте счётчики через кнопку «Сканировать».
                  </td></tr>
                </template>
              </tbody>
            </table>
          </div>
        </template>
      </div>

      <!-- Опрос канала Uptime (ТЗ v0.10.0) -->
      <div class="settings-section">
        <h2>Опрос канала Uptime</h2>
        <div class="wbs-intro">
          WB-MAP3E отдаёт данные только когда меняется нагрузка, поэтому
          молчащий счётчик неотличим от оборванной линии. Канал
          <b>Uptime</b> растёт каждые 2 секунды и служит пульсом связи.
          Ниже — счётчики, у которых он не включён.
        </div>

        <div class="wbs-manual">
          <b>Как включить вручную</b> (работает всегда, независимо от
          кнопок ниже): Device Manager → устройство → HW Info → Uptime →
          «in queue order», затем сохранить конфигурацию.
        </div>

        <template x-if="uptimeConfigError">
          <div class="upd-banner upd-banner-warn" style="margin-top:12px">
            Проверить конфиг драйвера не удалось:
            <span x-text="uptimeConfigError"></span>
          </div>
        </template>

        <template x-if="!uptimeAllowEdit">
          <div class="wbs-note">
            Автоматическая правка выключена в конфиге сервиса
            (<code>wb_serial.allow_edit</code>). Включите канал вручную:
            Device Manager → устройство → HW Info → Uptime → in queue order.
          </div>
        </template>
        <template x-if="uptimeAllowEdit">
          <div class="wbs-note">
            Кнопка «Включить» правит <code>/etc/wb-mqtt-serial.conf</code> —
            файл, который отвечает за опрос <b>всех</b> устройств
            контроллера. Перед записью делается бэкап, отступы в файле
            будут нормализованы (4 пробела).
          </div>
        </template>

        <table class="reg-table" style="margin-top:12px">
          <thead><tr>
            <th>Счётчик</th><th style="width:130px">Состояние</th>
            <th>Пояснение</th><th style="width:140px">Действие</th>
          </tr></thead>
          <tbody>
            <template x-for="u in uptimeProblems" :key="u.device_id">
              <tr>
                <td>
                  <span x-text="u.display_name||u.device_id"></span><br>
                  <span class="muted mono" style="font-size:11px" x-text="u.device_id"></span>
                </td>
                <td>
                  <span class="badge" :style="uptimeBadgeStyle(u.state)"
                        x-text="uptimeLabel(u.state)"></span>
                </td>
                <td class="muted" style="font-size:12px" x-text="u.detail"></td>
                <td>
                  <template x-if="u.can_enable">
                    <button class="btn btn-sm btn-primary" :disabled="uptimeBusy"
                            @click="enableUptime(u.device_id)">Включить</button>
                  </template>
                  <template x-if="!u.can_enable">
                    <span class="muted" style="font-size:12px">вручную</span>
                  </template>
                </td>
              </tr>
            </template>
            <template x-if="uptimeProblems.length===0">
              <tr><td colspan="4" style="text-align:center;color:var(--txt3);padding:16px">
                Счётчиков с невключённым каналом Uptime нет.
              </td></tr>
            </template>
          </tbody>
        </table>
      </div>

      <!-- Незарегистрированные счётчики -->
      <div class="settings-section">
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px">
          <h2 style="margin:0;border:none;padding:0">Найдены в MQTT, не в реестре</h2>
          <button class="btn btn-secondary" @click="scanUnregistered()" style="font-size:12px">
            <span x-show="!scanLoading">🔍 Сканировать</span>
            <span x-show="scanLoading"><span class="spin"></span> Сканирование…</span>
          </button>
        </div>
        <template x-if="unregistered.length===0 && !scanLoading">
          <div style="color:var(--txt3);font-size:13px;padding:12px 0">
            Все счётчики из MQTT уже в реестре.
          </div>
        </template>
        <div class="unregistered-list">
          <template x-for="u in unregistered" :key="u.device_id">
            <div class="unrg-item">
              <div class="unrg-info">
                <div class="unrg-id" x-text="u.device_id"></div>
                <div class="unrg-sub">
                  <span x-text="u.mqtt_name ? 'MQTT: '+u.mqtt_name : ''"></span>
                  <span x-show="u.serial"> · серийник: <span x-text="u.serial"></span></span>
                  <span x-show="u.last_update_age_s!=null">
                    · обновление <span x-text="fmtAge(u.last_update_age_s)"></span>
                  </span>
                </div>
              </div>
              <!-- Форма быстрого добавления -->
              <template x-if="addingId !== u.device_id">
                <button class="btn btn-primary btn-sm"
                  @click="startAdd(u)">+ Добавить</button>
              </template>
              <template x-if="addingId === u.device_id">
                <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
                  <input x-model="addName" placeholder="Имя счётчика"
                         style="background:var(--bg3);border:1px solid var(--accent);
                                color:var(--txt);padding:5px 9px;border-radius:5px;
                                font-size:13px;font-family:inherit;width:180px"
                         @keydown.enter="confirmAdd(u.device_id)" @keydown.escape="addingId=null">
                  <select x-model="addGroup"
                         style="background:var(--bg3);border:1px solid var(--line);
                                color:var(--txt);padding:5px 9px;border-radius:5px;
                                font-size:13px;font-family:inherit;width:150px">
                    <option value="">— Без зоны —</option>
                    <template x-for="g in allGroups" :key="g">
                      <option :value="g" x-text="g"></option>
                    </template>
                    <option value="__new__">+ Новая зона…</option>
                  </select>
                  <template x-if="addGroup==='__new__'">
                    <input x-model="addGroupNew" placeholder="имя новой зоны"
                           style="background:var(--bg3);border:1px solid var(--accent);
                                  color:var(--txt);padding:5px 9px;border-radius:5px;
                                  font-size:13px;font-family:inherit;width:150px"
                           @keydown.enter="confirmAdd(u.device_id)" @keydown.escape="addingId=null">
                  </template>
                  <input x-model="addNotes" placeholder="Комментарий"
                         style="background:var(--bg3);border:1px solid var(--line);
                                color:var(--txt);padding:5px 9px;border-radius:5px;
                                font-size:13px;font-family:inherit;width:160px;font-style:italic"
                         @keydown.enter="confirmAdd(u.device_id)" @keydown.escape="addingId=null">
                  <button class="btn btn-success btn-sm" @click="confirmAdd(u.device_id)">✓</button>
                  <button class="btn btn-secondary btn-sm" @click="addingId=null">✕</button>
                </div>
              </template>
            </div>
          </template>
        </div>
      </div>
    </div>
  </template>


  <!-- REPORTS -->
  <template x-if="tab=='reports'">
    <div>
      <!-- Под-вкладки -->
      <div class="report-tabs">
        <button :class="{active:rMode=='vedomost'}" @click="rMode='vedomost';loadVedomost()">
          📋 Ведомость расхода
        </button>
        <button :class="{active:rMode=='profile'}" @click="rMode='profile';loadProfile()">
          📈 Профиль нагрузки
        </button>
        <button :class="{active:rMode=='compare'}" @click="rMode='compare';loadCompare()">
          ⚖ Сравнение периодов
        </button>
        <button :class="{active:rMode=='avail'}" @click="rMode='avail';loadAvail()">
          🕒 Доступность
        </button>
        <button :class="{active:rMode=='balance'}" @click="rMode='balance';loadBalance()">
          ⚡ Баланс
        </button>

        <div>
          <div class="report-row">
            <label>Период:</label>
            <template x-for="p in presets" :key="p.id">
              <button :class="{'periods':true,'active':rPeriod===p.id}"
                style="background:var(--bg2);border:1px solid var(--line);
                       color:var(--txt2);cursor:pointer;padding:7px 12px;
                       border-radius:6px;font-size:12px;font-weight:500"
                :style="rPeriod===p.id?'background:var(--accent);color:#fff;border-color:var(--accent)':''"
                @click="rPeriod=p.id;rFrom='';rTo='';loadVedomost()"
                x-text="p.label"></button>
            </template>
            <input type="date" x-model="rFrom"
              style="background:var(--bg2);border:1px solid var(--line);color:var(--txt);
                     padding:7px 9px;border-radius:6px;font-size:13px;font-family:inherit">
            <span class="muted">—</span>
            <input type="date" x-model="rTo"
              style="background:var(--bg2);border:1px solid var(--line);color:var(--txt);
                     padding:7px 9px;border-radius:6px;font-size:13px;font-family:inherit">
            <button style="background:var(--bg3);border:1px solid var(--line);color:var(--txt);
                           cursor:pointer;padding:7px 14px;border-radius:6px;font-size:13px"
              @click="rPeriod='';loadVedomost()">Применить</button>
            <div class="spacer"></div>
            <button class="dl-btn" @click="downloadVedomost()">⬇ Скачать CSV</button>
          </div>

          <template x-if="rLoading">
            <div class="empty"><span class="spin"></span> загрузка…</div>
          </template>

          <template x-if="!rLoading">
            <div>
              <table class="rep-table">
                <thead><tr>
                  <th>Счётчик</th>
                  <th>Комментарий</th>
                  <th class="num">Расход, кВт·ч</th>
                  <th>Качество</th>
                </tr></thead>
                <tbody>
                  <template x-for="row in vedomostRows" :key="row._key">
                    <!-- Разделитель зоны -->
                    <template x-if="row._zone_sep">
                      <tr class="zone-sep">
                        <td colspan="4">
                          <span :style="`background:${zoneColor(row._zone_sep)};
                            width:9px;height:9px;border-radius:2px;
                            display:inline-block;margin-right:7px;vertical-align:middle`"></span>
                          <span x-text="row._zone_sep"></span>
                          <span class="muted" x-text="' · ' + row._zone_kwh.toFixed(3) + ' кВт·ч'"></span>
                        </td>
                      </tr>
                    </template>
                    <!-- Строка счётчика -->
                    <template x-if="!row._zone_sep">
                      <tr>
                        <td>
                          <div style="font-weight:600;font-size:13px" x-text="row.display_name"></div>
                          <div class="muted" style="font-size:11px" x-text="row.device_id"></div>
                        </td>
                        <td class="muted" style="font-style:italic;font-size:12px"
                            x-text="row.notes||'—'"></td>
                        <td class="num" x-text="row.consumption_kwh!=null?fmt(row.consumption_kwh,3):'—'"></td>
                        <td>
                          <span class="q" :style="qualityStyle(row.quality)"

                      </tr>
                    </template>
                  </template>
                </tbody>
                <tfoot><tr>
                  <td colspan="2">Итого</td>
                  <td class="num" x-text="fmt(rTotal,3)"></td>
                  <td></td>
                </tr></tfoot>
              </table>
              <div class="muted" style="margin-top:8px" x-text="rPeriodLabel"></div>
            </div>
          </template>
        </div>
      </template>

      <!-- ===== ПРОФИЛЬ НАГРУЗКИ ===== -->

<!doctype html>
<html lang="ru" x-data="app()" :data-theme="theme" x-init="init()">
<head>
<meta charset="utf-8">
<title>wb-energy-meter</title>
<meta name="viewport" content="width=1100">
<!-- Вендорено локально (ТЗ v0.11.0) — см. wb_energy_meter/static/vendor/VENDOR.md -->
<link rel="stylesheet" href="/static/vendor/leaflet.css">
<link rel="stylesheet" href="/static/vendor/leaflet-geoman.css">
<style>
:root[data-theme="dark"]{
  --bg:#0d1117;--bg2:#161b22;--bg3:#1c2330;--line:#2d3543;
  --txt:#e6edf3;--txt2:#9aa7b6;--txt3:#6b7886;
  --accent:#2f9e8f;--accent2:#3dd6c0;
  --ok:#3fb950;--warn:#d29922;--idle:#7d8590;--err:#f85149;--info:#58a6ff;
}
:root[data-theme="light"]{
  --bg:#f4f6f9;--bg2:#ffffff;--bg3:#eef1f5;--line:#d6dde6;
  --txt:#1a2027;--txt2:#5a6675;--txt3:#8a96a3;
  --accent:#1a7d70;--accent2:#149484;
  --ok:#1a7f37;--warn:#9a6700;--idle:#8a96a3;--err:#cf222e;--info:#0969da;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:14px;line-height:1.4;min-height:100vh}
.mono{font-family:"SF Mono","JetBrains Mono",Consolas,monospace;font-variant-numeric:tabular-nums}
header{background:var(--bg2);border-bottom:1px solid var(--line);
  padding:0 24px;height:56px;display:flex;align-items:center;gap:20px;
  position:sticky;top:0;z-index:10}
.logo{font-weight:700;font-size:17px;letter-spacing:-.3px}
.logo span{color:var(--accent2)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.conn{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--txt2)}
nav{display:flex;gap:4px;margin-left:8px}
nav button{background:none;border:none;color:var(--txt2);cursor:pointer;
  padding:8px 14px;border-radius:6px;font-size:13px;font-weight:500}
nav button:hover{background:var(--bg3);color:var(--txt)}
nav button.active{background:var(--accent);color:#fff}
.spacer{flex:1}
.ico-btn{background:var(--bg3);border:1px solid var(--line);color:var(--txt2);
  cursor:pointer;padding:7px 11px;border-radius:6px;font-size:13px}
.ico-btn:hover{color:var(--txt);border-color:var(--accent)}
main{padding:24px;max-width:1400px;margin:0 auto}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:14px;margin-bottom:24px}
.tile{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.tile .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.6px;
  color:var(--txt3);margin-bottom:8px;font-weight:600}
.tile .val{font-size:28px;font-weight:700}
.tile .val small{font-size:14px;color:var(--txt2);font-weight:500}
.tile .sub{font-size:12px;color:var(--txt2);margin-top:4px}
.statusline{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px}
.statusline span{display:flex;align-items:center;gap:5px;font-size:12px}
/* cards */
.section-title{font-size:13px;text-transform:uppercase;letter-spacing:.6px;
  color:var(--txt3);font-weight:600;margin:0 0 12px 2px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:10px;
  overflow:hidden;cursor:pointer;transition:border-color .15s}
.card:hover{border-color:var(--accent)}
.card-head{display:flex;align-items:center;gap:10px;padding:14px 16px 10px}
.card-head .nm{font-weight:600;font-size:15px;flex:1;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.badge{font-size:10px;font-weight:700;text-transform:uppercase;
  letter-spacing:.4px;padding:3px 7px;border-radius:5px}
.card-grp{font-size:11px;color:var(--txt3);padding:0 16px 6px}
.card-body{padding:0 16px 14px;display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.metric .k{font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--txt3)}
.metric .v{font-size:18px;font-weight:600;margin-top:2px}
.metric .v small{font-size:11px;color:var(--txt2);font-weight:400}
.phases{grid-column:1/-1;display:flex;gap:6px;margin-top:2px}
.phase{flex:1;background:var(--bg3);border-radius:5px;padding:6px 4px;text-align:center}
.phase .pk{font-size:9px;color:var(--txt3)}
.phase .pv{font-size:13px;font-weight:600;margin-top:1px}
.card-footer{grid-column:1/-1;display:flex;justify-content:space-between;
  align-items:center;margin-top:4px;padding-top:8px;border-top:1px solid var(--line)}
.card-footer .cf-item{font-size:11px;color:var(--txt3)}
.card-footer .cf-val{color:var(--txt2);font-weight:500}
.cf-ok{color:var(--ok)}.cf-warn{color:var(--warn)}.cf-err{color:var(--err)}
.reason{grid-column:1/-1;font-size:11px;color:var(--txt2);
  background:var(--bg3);border-radius:6px;padding:8px 10px;margin-top:2px}
/* table */
table{width:100%;border-collapse:collapse;background:var(--bg2);
  border:1px solid var(--line);border-radius:10px;overflow:hidden}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line)}
th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;
  color:var(--txt3);font-weight:600;background:var(--bg3)}
td.num{text-align:right}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--bg3)}
tfoot td{font-weight:700;background:var(--bg3);border-top:2px solid var(--line)}
/* periods */
.periods{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
.periods button{background:var(--bg2);border:1px solid var(--line);
  color:var(--txt2);cursor:pointer;padding:8px 14px;border-radius:7px;
  font-size:13px;font-weight:500}
.periods button:hover{color:var(--txt);border-color:var(--accent)}
.periods button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.periods .custom{display:flex;gap:6px;align-items:center;margin-left:8px}
.periods input[type=date]{background:var(--bg2);border:1px solid var(--line);
  color:var(--txt);padding:7px 9px;border-radius:6px;font-size:13px;font-family:inherit}
.q{font-size:10px;font-weight:700;text-transform:uppercase;padding:2px 7px;
  border-radius:4px;letter-spacing:.3px}
.chart-wrap{background:var(--bg2);border:1px solid var(--line);
  border-radius:10px;padding:18px;margin-top:18px}
.chart-wrap h3{font-size:14px;margin-bottom:14px;font-weight:600}
.bar:hover{opacity:.8}
.empty{text-align:center;color:var(--txt3);padding:50px 20px;font-size:14px}
.spin{display:inline-block;width:18px;height:18px;
  border:2px solid var(--line);border-top-color:var(--accent);
  border-radius:50%;animation:sp .7s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);
  display:flex;align-items:flex-start;justify-content:center;
  padding:40px 20px;z-index:50;overflow-y:auto}
.modal{background:var(--bg2);border:1px solid var(--line);border-radius:12px;
  max-width:880px;width:100%;box-shadow:0 4px 16px rgba(0,0,0,.4)}
.modal-head{display:flex;align-items:center;gap:12px;padding:18px 22px;
  border-bottom:1px solid var(--line);position:sticky;top:0;
  background:var(--bg2);border-radius:12px 12px 0 0}
.modal-head .nm{font-size:18px;font-weight:700;flex:1}
.modal-body{padding:22px}
.ctrl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.ctrl{background:var(--bg3);border-radius:7px;padding:10px 12px;
  border:1px solid transparent;position:relative}
.ctrl-clickable{cursor:pointer;transition:border-color .12s,background .12s}
.ctrl-clickable:hover{border-color:var(--accent);background:var(--bg2)}
.ctrl[data-hint]:hover::after{
  content:attr(data-hint);position:absolute;left:0;top:100%;margin-top:6px;
  background:var(--bg3);border:1px solid var(--line);color:var(--txt2);
  font-size:12px;max-width:280px;padding:8px 10px;border-radius:6px;
  z-index:60;pointer-events:none;line-height:1.4;white-space:normal;
  box-shadow:0 4px 12px rgba(0,0,0,.25)}
.ctrl .ck{font-size:10px;color:var(--txt3);text-transform:uppercase;
  letter-spacing:.3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctrl .cv{font-size:16px;font-weight:600;margin-top:3px}
.cat-header{display:flex;align-items:center;gap:8px;cursor:pointer;
  padding:9px 2px;user-select:none}
.cat-header:hover{color:var(--accent2)}
.cat-arrow{color:var(--txt3);font-size:10px;width:10px;display:inline-block}
.cat-block{margin-top:8px}
.bulk-bar{display:flex;align-items:center;gap:10px;margin-bottom:10px;
  background:var(--bg2);border:1px solid var(--accent);border-radius:8px;
  padding:9px 14px;font-size:13px}
.close{background:none;border:none;color:var(--txt2);cursor:pointer;
  font-size:22px;line-height:1;padding:4px 8px;border-radius:6px}
.close:hover{background:var(--bg3);color:var(--txt)}
.warn-item{font-size:12px;color:var(--warn);background:var(--bg3);
  border-left:3px solid var(--warn);padding:8px 12px;
  border-radius:0 6px 6px 0;margin-bottom:6px}
.muted{color:var(--txt3);font-size:12px}
/* zones */
.zone-header{display:flex;align-items:center;gap:12px;margin:20px 0 10px;padding-left:4px}
.zone-badge{width:12px;height:12px;border-radius:3px;flex-shrink:0}
.zone-title{font-size:14px;font-weight:700;letter-spacing:-.2px}
.zone-summary{font-size:12px;color:var(--txt2);margin-left:4px}
.zone-section{margin-bottom:20px}
.zone-section:first-child .zone-header{margin-top:0}
/* settings page */
.settings-section{margin-bottom:28px}
.settings-section h2{font-size:15px;font-weight:700;margin-bottom:14px;
  padding-bottom:8px;border-bottom:1px solid var(--line)}
/* update panel (самообновление, ТЗ v0.9.0) */
.upd-card{background:var(--bg2);border:1px solid var(--line);border-radius:10px;
  padding:14px 18px}
.upd-card.upd-avail{border-color:var(--accent)}
.upd-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:space-between}
.upd-meta{color:var(--txt);font-size:13px}
.upd-msg{font-size:12px;color:var(--txt3);margin-top:5px}
.upd-progress{display:flex;align-items:center;gap:10px}
.upd-step{font-size:13px;font-weight:500}
.upd-banner{border-radius:8px;padding:14px 18px;font-size:13px}
.upd-banner-ok{background:rgba(63,185,80,.12);border:1px solid var(--ok)}
.upd-banner-warn{background:rgba(210,153,34,.12);border:1px solid var(--warn)}
.upd-banner-err{background:rgba(248,81,73,.12);border:1px solid var(--err)}
.upd-log{background:var(--bg3);border-radius:6px;padding:10px 12px;margin-top:8px;
  font-family:monospace;font-size:11px;white-space:pre-wrap;max-height:220px;overflow:auto}
.reg-table{width:100%;border-collapse:collapse;background:var(--bg2);
  border:1px solid var(--line);border-radius:10px;overflow:hidden}
.reg-table th,.reg-table td{text-align:left;padding:10px 14px;
  border-bottom:1px solid var(--line)}
.reg-table th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;
  color:var(--txt3);font-weight:600;background:var(--bg3)}
.reg-table tr:last-child td{border-bottom:none}
.reg-table tbody tr:hover{background:var(--bg3)}
.btn{border:none;cursor:pointer;padding:6px 12px;border-radius:6px;
  font-size:12px;font-weight:600;transition:opacity .1s}
.btn:hover{opacity:.8}
.btn-sm{padding:4px 10px;font-size:11px}
.btn-primary{background:var(--accent);color:#fff}
.btn-danger{background:var(--err);color:#fff}
.btn-secondary{background:var(--bg3);border:1px solid var(--line);color:var(--txt)}
.btn-success{background:var(--ok);color:#fff}
/* inline edit inputs */
.edit-row input,.edit-row select{background:var(--bg3);border:1px solid var(--accent);
  color:var(--txt);padding:5px 9px;border-radius:5px;font-size:13px;
  font-family:inherit;width:100%}
/* scan results */
.unregistered-list{display:flex;flex-direction:column;gap:8px}
.unrg-item{background:var(--bg2);border:1px solid var(--line);border-radius:8px;
  padding:12px 16px;display:flex;align-items:center;gap:12px}
.unrg-item .unrg-info{flex:1}
.unrg-item .unrg-id{font-family:monospace;font-size:13px;font-weight:600}
.unrg-item .unrg-sub{font-size:11px;color:var(--txt3);margin-top:2px}
/* канал Uptime и конфиг драйвера (ТЗ v0.10.0) */
.wbs-banner{background:rgba(230,170,20,.12);border:1px solid var(--warn);
  border-radius:8px;padding:14px 18px;margin-bottom:20px;font-size:13px;
  line-height:1.5;display:flex;gap:16px;align-items:center;
  justify-content:space-between;flex-wrap:wrap}
.wbs-intro{font-size:13px;color:var(--txt2);line-height:1.55;max-width:760px}
.wbs-manual{margin-top:10px;font-size:12.5px;color:var(--txt2);
  background:var(--bg3);border-left:3px solid var(--accent);
  border-radius:0 6px 6px 0;padding:10px 14px;line-height:1.5}
.wbs-note{margin-top:10px;font-size:12px;color:var(--txt3);line-height:1.5}
.wbs-detail{margin-top:6px;font-size:11.5px;color:var(--txt2);
  line-height:1.45;max-width:260px}
/* confirm dialog */
.confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);
  display:flex;align-items:center;justify-content:center;z-index:100}
.confirm-box{background:var(--bg2);border:1px solid var(--line);
  border-radius:12px;padding:28px;max-width:400px;width:90%;
  box-shadow:0 8px 32px rgba(0,0,0,.5)}
.confirm-box h3{font-size:16px;font-weight:700;margin-bottom:10px}
.confirm-box p{color:var(--txt2);font-size:14px;margin-bottom:20px}
.confirm-box .actions{display:flex;gap:10px;justify-content:flex-end}
/* toast */
.toast{position:fixed;bottom:24px;right:24px;z-index:200;
  padding:12px 20px;border-radius:8px;font-size:14px;font-weight:500;
  box-shadow:0 4px 16px rgba(0,0,0,.3);animation:fadein .2s ease}
@keyframes fadein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.toast-ok{background:var(--ok);color:#fff}
.toast-err{background:var(--err);color:#fff}
/* reports */
.report-tabs{display:flex;gap:4px;margin-bottom:20px;background:var(--bg2);
  border:1px solid var(--line);border-radius:8px;padding:4px}
.report-tabs button{flex:1;background:none;border:none;color:var(--txt2);
  cursor:pointer;padding:9px 12px;border-radius:6px;font-size:13px;font-weight:500}
.report-tabs button:hover{color:var(--txt);background:var(--bg3)}
.report-tabs button.active{background:var(--accent);color:#fff}
.report-row{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.report-row label{font-size:12px;color:var(--txt2);font-weight:500}
.report-row select{background:var(--bg2);border:1px solid var(--line);
  color:var(--txt);padding:7px 10px;border-radius:6px;font-size:13px;font-family:inherit}
.dl-btn{background:var(--ok);color:#fff;border:none;cursor:pointer;
  padding:8px 16px;border-radius:7px;font-size:13px;font-weight:600}
.dl-btn:hover{opacity:.88}
.rep-table{width:100%;border-collapse:collapse;background:var(--bg2);
  border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:4px}
.rep-table th,.rep-table td{text-align:left;padding:10px 14px;
  border-bottom:1px solid var(--line);font-size:13px}
.rep-table th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;
  color:var(--txt3);font-weight:600;background:var(--bg3)}
.rep-table td.num{text-align:right;font-family:monospace}
.rep-table tr:last-child td{border-bottom:none}
.rep-table tfoot td{font-weight:700;background:var(--bg3);
  border-top:2px solid var(--line)}
.rep-table tbody tr:hover{background:var(--bg3)}
.zone-sep td{background:var(--bg3)!important;font-weight:700;color:var(--txt2);
  font-size:11px;text-transform:uppercase;letter-spacing:.5px;padding:6px 14px}
.delta-pos{color:var(--err)}
.delta-neg{color:var(--ok)}
.delta-neu{color:var(--txt2)}
.profile-wrap{background:var(--bg2);border:1px solid var(--line);
  border-radius:10px;padding:18px;margin-top:4px}
.profile-meta{display:flex;gap:24px;flex-wrap:wrap;margin-bottom:16px}
.profile-meta .pm{background:var(--bg3);border-radius:7px;padding:10px 16px}
.profile-meta .pm .pk{font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--txt3)}
.profile-meta .pm .pv{font-size:20px;font-weight:700;margin-top:3px}
.cmp-header{font-size:12px;color:var(--txt3);font-weight:600}
/* roles */
.role-btn{border:1px solid var(--line);background:var(--bg3);color:var(--txt2);
  cursor:pointer;padding:4px 10px;border-radius:5px;font-size:11px;font-weight:600}
.role-btn.active-input{background:#1a7f37;color:#fff;border-color:#1a7f37}
.role-btn.active-consumer{background:var(--accent);color:#fff;border-color:var(--accent)}
.role-btn.active-other{background:var(--txt3);color:#fff;border-color:var(--txt3)}
/* availability */
.avail-bar-wrap{background:var(--bg3);border-radius:4px;overflow:hidden;height:8px;
  width:120px;display:inline-block;vertical-align:middle}
.avail-bar{height:100%;border-radius:4px;transition:width .3s}
.avail-100{background:var(--ok)}.avail-99{background:var(--ok)}
.avail-95{background:var(--warn)}.avail-low{background:var(--err)}
.incident-row{background:var(--bg3);border-radius:6px;padding:8px 12px;
  margin-bottom:6px;font-size:12px}
.incident-row .ir-time{color:var(--txt2);font-family:monospace}
.incident-row .ir-dur{color:var(--txt3);margin-left:12px}
/* план объекта (ТЗ v0.11.0) — карта Leaflet держит собственный DOM,
   вкладка на x-show (не x-if), контейнеру нужна явная высота (см.
   AGENTS.md) */
#site-plan-map{height:calc(100vh - 220px);min-height:420px;
  border-radius:10px;border:1px solid var(--line);background:var(--bg3)}
#site-plan-v2-map{height:calc(100vh - 220px);min-height:420px;
  border-radius:10px;border:1px solid var(--line);background:var(--bg3)}
#site-plan-v2-map.planv2-placing{cursor:crosshair}
.leaflet-container{background:var(--bg3);font-family:inherit;outline:none}
.leaflet-popup-content-wrapper{background:var(--bg2);color:var(--txt);
  border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.4)}
.leaflet-popup-tip{background:var(--bg2)}
.leaflet-popup-close-button{color:var(--txt2) !important}
.plan-popup{min-width:210px;font-size:13px}
.plan-popup .pp-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.plan-popup .pp-dot{width:11px;height:11px;border-radius:3px;flex-shrink:0}
.plan-popup .pp-title{font-weight:700;font-size:15px}
.plan-popup .pp-power{font-size:26px;font-weight:700;margin-bottom:6px;
  font-family:"SF Mono","JetBrains Mono",Consolas,monospace}
.plan-popup .pp-power small{font-size:13px;color:var(--txt2);font-weight:500}
.plan-popup .pp-row{display:flex;justify-content:space-between;gap:10px;
  font-size:12px;color:var(--txt2);padding:3px 0}
.plan-popup .pp-worst{font-size:11px;color:var(--warn);background:var(--bg3);
  border-radius:6px;padding:6px 8px;margin-top:6px;line-height:1.4}
.plan-popup .pp-link{display:block;margin-top:8px;font-size:12px;
  color:var(--accent2);text-decoration:none;font-weight:600;cursor:pointer}
.plan-popup .pp-link:hover{text-decoration:underline}
.plan-zone-alarm{animation:planZonePulse 2s ease-in-out infinite}
@keyframes planZonePulse{
  0%,100%{stroke-opacity:1;stroke-width:3}
  50%{stroke-opacity:.35;stroke-width:5}
}
.plan-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.plan-layout{display:grid;grid-template-columns:1fr;gap:16px;align-items:start}
.plan-layout.plan-edit-open{grid-template-columns:1fr 340px}
.plan-side{background:var(--bg2);border:1px solid var(--line);border-radius:10px;
  padding:16px;display:flex;flex-direction:column;gap:16px;
  max-height:calc(100vh - 220px);overflow:auto}
.plan-side h3{font-size:12px;text-transform:uppercase;letter-spacing:.5px;
  color:var(--txt3);font-weight:600}
.plan-zone-list{display:flex;flex-direction:column;gap:6px}
.plan-zone-row{display:flex;align-items:center;gap:8px;background:var(--bg3);
  border-radius:7px;padding:7px 10px;font-size:13px}
.plan-zone-row .pzr-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.plan-zone-row .pzr-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plan-zone-row .pzr-check{color:var(--ok);font-size:13px}
.plan-link-row{background:var(--bg3);border-radius:7px;padding:8px 10px;
  font-size:12px;display:flex;flex-direction:column;gap:4px}
.plan-link-row .plr-top{display:flex;justify-content:space-between;align-items:center}
.plan-empty{text-align:center;color:var(--txt3);padding:60px 20px}
.plan-upload-form{display:flex;flex-direction:column;gap:8px}
.plan-upload-form input[type=text],.plan-upload-form input[type=file],
.plan-upload-form input[type=number]{background:var(--bg3);border:1px solid var(--line);
  color:var(--txt);padding:7px 9px;border-radius:6px;font-size:13px;font-family:inherit}
.plan-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--txt2)}
.plan-legend span{display:flex;align-items:center;gap:5px}
.plan-legend .ll-swatch{width:16px;height:3px;border-radius:2px;display:inline-block}
.plan-pill{font-size:10px;font-weight:700;text-transform:uppercase;
  letter-spacing:.3px;padding:2px 7px;border-radius:5px;background:var(--accent);color:#fff}
/* Структура/инспектор (ТЗ §8.3, партия 3, задача 1) — три колонки:
   дерево+поиск / список детей с метриками / инспектор, тем же визуальным
   языком, что и .plan-side (панель) и .rep-table (таблицы). */
.structure-layout{display:grid;grid-template-columns:260px 1fr 340px;gap:16px;
  align-items:start}
.structure-col{background:var(--bg2);border:1px solid var(--line);border-radius:10px;
  padding:14px;max-height:calc(100vh - 220px);overflow:auto}
.structure-search input[type=text]{width:100%;box-sizing:border-box;
  background:var(--bg3);border:1px solid var(--line);color:var(--txt);
  padding:7px 9px;border-radius:6px;font-size:13px;font-family:inherit;margin-bottom:10px}
.structure-tree-row{display:flex;align-items:center;gap:6px;padding:6px 8px;
  border-radius:6px;font-size:13px;cursor:pointer}
.structure-tree-row:hover{background:var(--bg3)}
.structure-tree-row.active{background:var(--bg3);color:var(--accent2);font-weight:600}
.structure-tree-row .stc{color:var(--txt3);font-size:11px;margin-left:auto}
.structure-list-row{display:flex;align-items:center;gap:10px;padding:8px 10px;
  border-radius:6px;font-size:13px;cursor:pointer}
.structure-list-row:hover{background:var(--bg3)}
.structure-list-row.active{background:var(--bg3);color:var(--accent2)}
.structure-field{margin-bottom:12px}
.structure-field .sf-lbl{font-size:11px;text-transform:uppercase;letter-spacing:.5px;
  color:var(--txt3);margin-bottom:3px}
.structure-field .sf-val{font-size:13px}
.structure-chip{display:inline-block;background:var(--bg3);border:1px solid var(--line);
  border-radius:12px;padding:3px 10px;font-size:12px;margin:2px 4px 2px 0;cursor:pointer}
.structure-chip:hover{border-color:var(--accent2)}
</style>
</head>
<body>
<!-- ЗАГЛУШКА "ИНТЕРФЕЙС НЕ ЗАПУСТИЛСЯ" (ТЗ v0.11.1, §3).
     ВАЖНО: только голый HTML/CSS/JS, ни одной директивы Alpine
     (x-show/x-if/x-text/x-data) — она обязана работать именно тогда,
     когда Alpine НЕ загрузился (белый экран 09.09.2026, см. AGENTS.md:
     /static/vendor/<file> падал на несовместимости с Werkzeug 1.0.1,
     alpine.min.js не грузился, Alpine не стартовал вообще). Стили —
     только инлайном, без CSS-переменных темы (--bg/--txt/... проставляет
     Alpine через :data-theme на <html>, при сломанном Alpine их не
     будет — все цвета ниже заданы явно). Показывается не сразу, а через
     1.5с (см. <script> ниже), чтобы не мигать при нормальной загрузке,
     и удаляется, как только реально стартовал Alpine-компонент —
     init() ниже (x-init="init()" на <html>) вызывает
     window.__wbemBootOk(). -->
<div id="boot-error" style="display:none;position:fixed;inset:0;z-index:99999;
  background:#1b1e24;color:#eef0f3;font-family:-apple-system,'Segoe UI',Arial,sans-serif;
  padding:32px;box-sizing:border-box;overflow:auto">
  <div style="max-width:640px;margin:40px auto;background:#24282f;
    border:1px solid #3a3f48;border-radius:10px;padding:28px 32px">
    <h1 style="margin:0 0 12px 0;font-size:20px;line-height:1.3;color:#ff6b6b">
      Интерфейс не запустился</h1>
    <p id="boot-error-missing" style="margin:0 0 16px 0;font-size:14px;
      line-height:1.5;color:#eef0f3"></p>
    <p style="margin:0 0 8px 0;font-size:14px;color:#c7cbd3">
      Проверьте на контроллере:</p>
    <pre style="margin:0 0 8px 0;padding:10px 12px;background:#14161a;
      border-radius:6px;font-size:13px;line-height:1.5;color:#9fe3a0;
      overflow-x:auto"><code id="boot-error-curl">curl -sI http://127.0.0.1:8080/static/vendor/alpine.min.js</code></pre>
    <pre style="margin:0;padding:10px 12px;background:#14161a;
      border-radius:6px;font-size:13px;line-height:1.5;color:#9fe3a0;
      overflow-x:auto"><code>journalctl -u wb-energy-meter -n 50</code></pre>
  </div>
</div>
<script>
(function(){
  // Заглушка вместо белого экрана (ТЗ v0.11.1, §3). Работает независимо
  // от Alpine: собственный таймер показа + перехват ошибок загрузки
  // ресурсов через window.addEventListener('error', ..., true) — capture
  // phase, единственный способ поймать ошибку загрузки <script>/<link>
  // (у обычного bubbling-обработчика event.target для таких ошибок не
  // виден).
  var missing = [];
  var timer = null;

  function render(){
    var box = document.getElementById('boot-error');
    var p = document.getElementById('boot-error-missing');
    var curl = document.getElementById('boot-error-curl');
    if(!box || !p) return;
    if(missing.length){
      p.textContent = 'Не загрузились файлы: ' + missing.join(', ');
      if(curl) curl.textContent = 'curl -sI http://127.0.0.1:8080' + missing[0];
    } else {
      p.textContent = 'Интерфейс не смог стартовать (Alpine.js). Список ' +
        'конкретных файлов собрать не удалось — см. журнал сервиса ниже.';
    }
    box.style.display = 'block';
  }

  function onResourceError(ev){
    var t = ev && ev.target;
    if(!t || t === window) return; // обычная JS-ошибка, не загрузка ресурса
    var src = (t.getAttribute && (t.getAttribute('src') || t.getAttribute('href'))) || '';
    if(src && missing.indexOf(src) === -1) missing.push(src);
    render(); // ресурс не загрузился — не ждём таймер, показываем сразу
  }

  window.addEventListener('error', onResourceError, true);
  timer = setTimeout(render, 1500);

  // Вызывается из init() Alpine-компонента ниже: раз init() выполнился —
  // Alpine жив, заглушка не нужна.
  window.__wbemBootOk = function(){
    if(timer){ clearTimeout(timer); timer = null; }
    window.removeEventListener('error', onResourceError, true);
    var box = document.getElementById('boot-error');
    if(box && box.parentNode) box.parentNode.removeChild(box);
  };
})();
</script>
<header>
  <div class="logo">wb<span>·</span>energy<span>·</span>meter</div>
  <div class="conn">
    <span class="dot" :style="`background:${mqtt.connected?'var(--ok)':'var(--err)'}`"></span>
    <span x-text="mqtt.connected?'MQTT online':'MQTT offline'"></span>
  </div>
  <nav>
    <!-- Классический набор (см. константу UI_SET_TABS / DEFAULT_UI_SET в
         основном script-блоке ниже — она же решает, какой набор открыт по
         умолчанию). -->
    <button x-show="uiSet=='classic'" :class="{active:tab=='dash'}" @click="tab='dash'">Дашборд</button>
    <button x-show="uiSet=='classic'" :class="{active:tab=='plan'}" @click="tab='plan';openPlanTab()">План</button>
    <button x-show="uiSet=='classic'" :class="{active:tab=='consumption'}" @click="tab='consumption';loadConsumption()">Расход</button>
    <button x-show="uiSet=='classic'" :class="{active:tab=='settings'}" @click="tab='settings';loadSettings();initUpdatePanel()">Настройки</button>
    <button x-show="uiSet=='classic'" :class="{active:tab=='reports'}" @click="tab='reports';initReports()">Отчёты</button>
    <!-- Новый набор (ТЗ v2, этапы D/E не завершены — см. CHANGELOG.md). -->
    <button x-show="uiSet=='v2'" :class="{active:tab=='overviewv2'}" @click="tab='overviewv2';openOverviewV2Tab()">Обзор</button>
    <button x-show="uiSet=='v2'" :class="{active:tab=='planv2'}" @click="tab='planv2';openPlanV2Tab()">План v2</button>
    <button x-show="uiSet=='v2'" :class="{active:tab=='reportsv2'}" @click="tab='reportsv2';openReportsV2Tab()">Отчёты</button>
    <button x-show="uiSet=='v2'" :class="{active:tab=='structurev2'}" @click="tab='structurev2';openStructureTab()">Структура</button>
  </nav>
  <div class="spacer"></div>
  <span class="muted mono" x-text="version?'v'+version:''"></span>
  <button class="ico-btn" @click="toggleUiSet()" x-text="uiSet=='v2'?'Классический':'Новый интерфейс'"
          title="Переключить набор вкладок: классический интерфейс или новый (ТЗ v2, в разработке — см. CHANGELOG.md)"></button>
  <button class="ico-btn" @click="toggleTheme()" x-text="theme=='dark'?'☀ Светлая':'🌙 Тёмная'"></button>
  <button class="ico-btn" @click="refresh()">⟳ Обновить</button>
</header>

<main>
  <!-- DASHBOARD -->
  <template x-if="tab=='dash'">
    <div>
      <div class="tiles">
        <div class="tile">
          <div class="lbl">Счётчиков</div>
          <div class="val mono" x-text="meters.length"></div>
          <div class="statusline">
            <template x-for="(n,st) in byStatus" :key="st">
              <span>
                <span class="dot" :style="`background:${statusColor(st)}`"></span>
                <span x-text="statusLabel(st)+': '+n"></span>
              </span>
            </template>
          </div>
        </div>
        <div class="tile">
          <div class="lbl">Суммарная мощность</div>
          <div class="val mono"><span x-text="totalPowerKw"></span><small> кВт</small></div>
          <div class="sub">сумма Total P по всем счётчикам</div>
        </div>
        <div class="tile">
          <div class="lbl">Накопленная энергия</div>
          <div class="val mono"><span x-text="totalEnergy"></span><small> кВт·ч</small></div>
          <div class="sub">сумма Total AP energy</div>
        </div>
        <div class="tile">
          <div class="lbl">MQTT</div>
          <div class="val mono" x-text="mqtt.messages"></div>
          <div class="sub">ошибок: <span x-text="mqtt.errors"></span> · аптайм <span x-text="uptimeStr"></span></div>
        </div>
      </div>
      <div class="section-title">Счётчики</div>
      <template x-if="loading">
        <div class="empty"><span class="spin"></span> загрузка…</div>
      </template>
      <template x-if="!loading && meters.length==0">
        <div class="empty">Нет счётчиков. Добавьте на вкладке <b>Настройки</b>.</div>
      </template>
      <template x-for="zone in groupedMeters" :key="zone.name">
        <div class="zone-section">
          <div class="zone-header">
            <span class="zone-badge" :style="`background:${zoneColor(zone.name)}`"></span>
            <span class="zone-title" x-text="zone.name"></span>
            <span class="zone-summary"
              x-text="zone.meters.length + ' шт · ' + zonePower(zone.meters) + ' кВт'"></span>
          </div>
          <div class="cards">
            <template x-for="m in zone.meters" :key="m.device_id">
              <div class="card" @click="openDetail(m.device_id)">
            <div class="card-head">
              <span class="dot" :style="`background:${statusColor(m.status)};width:10px;height:10px`"></span>
              <span class="nm" x-text="m.display_name"></span>
              <span class="badge" :style="badgeStyle(m.status)" x-text="statusLabel(m.status)"></span>
              <template x-if="m.role==='input'">
                <span style="font-size:10px;font-weight:700;color:var(--ok);
                  border:1px solid var(--ok);padding:2px 6px;border-radius:4px">ВВОД</span>
              </template>
            </div>
            <div class="card-grp" x-text="m.group||'— без группы —'"></div>
            <template x-if="m.notes">
              <div style="font-size:11px;color:var(--txt2);font-style:italic;
                          padding:0 16px 6px;line-height:1.4"
                   x-text="m.notes"></div>
            </template>
            <div class="card-body">
              <div class="metric">
                <div class="k">Мощность</div>
                <div class="v mono"><span x-text="fmt(m.main_values['Total P'],3)"></span><small> кВт</small></div>
              </div>
              <div class="metric">
                <div class="k">Энергия</div>
                <div class="v mono"><span x-text="fmt(m.main_values['Total AP energy'],2)"></span><small> кВт·ч</small></div>
              </div>
              <div class="phases">
                <template x-for="ph in ['L1','L2','L3']" :key="ph">
                  <div class="phase">
                    <div class="pk" x-text="'U'+ph"></div>
                    <div class="pv mono" x-text="fmt(m.main_values['Urms '+ph],0)"></div>
                  </div>
                </template>
              </div>
              <div class="card-footer">
                <div class="cf-item">
                  <template x-if="meterUptime(m)">
                    <span>⏱ аптайм: <span class="cf-val" x-text="meterUptime(m)"></span></span>
                  </template>
                  <template x-if="!meterUptime(m)">
                    <span class="muted">⏱ аптайм: —</span>
                  </template>
                </div>
                <div :class="updateAgeClass(m.last_update_age_s)">
                  <span x-text="fmtAge(m.last_update_age_s)"></span>
                </div>
              </div>
              <template x-if="m.status!='ok' && m.status_reason">
                <div class="reason" x-text="m.status_reason"></div>
              </template>
            </div>
          </div>
        </template>
      </div>
    </div>
  </template>
    </div>
  </template>

  <!-- ОБЗОР v2 (ТЗ §8.2) -->
  <template x-if="tab=='overviewv2'">
    <div>
      <div class="tiles">
        <div class="tile">
          <div class="lbl">Мощность сейчас</div>
          <div class="val mono"><span x-text="overviewV2TotalPowerKw()!=null?fmt(overviewV2TotalPowerKw(),1):'—'"></span><small> кВт</small></div>
          <div class="sub">сумма по точкам с данными</div>
        </div>
        <div class="tile">
          <div class="lbl">Энергия (снимок)</div>
          <div class="val mono"><span x-text="overviewV2TotalEnergyKwh()!=null?fmt(overviewV2TotalEnergyKwh(),1):'—'"></span><small> кВт·ч</small></div>
          <div class="sub">сумма Total AP energy, не расчёт за период</div>
        </div>
        <div class="tile">
          <div class="lbl">Требует внимания</div>
          <div class="val mono" x-text="overviewV2Problems().length"></div>
          <div class="sub" x-show="overviewV2Problems().length>0"
               x-text="'не привязано: '+overviewV2Problems().filter(p=>p.kind==='unbound').length+' · нет связи: '+overviewV2Problems().filter(p=>p.kind==='no_connection').length+' · не подключалось: '+overviewV2Problems().filter(p=>p.kind==='never_seen').length+' · ошибка: '+overviewV2Problems().filter(p=>p.kind==='device_error').length"></div>
        </div>
        <div class="tile" x-show="overviewV2Snapshot">
          <div class="lbl">Снимок на</div>
          <div class="val mono" style="font-size:16px" x-text="overviewV2Snapshot?overviewV2Snapshot.as_of.split('T')[1].slice(0,8):'—'"></div>
          <div class="sub" x-text="overviewV2Snapshot?overviewV2Snapshot.as_of.split('T')[0]:'—'"></div>
        </div>
      </div>

      <!-- Итог объекта за период (ТЗ §8.2, партия 2 задача 2) —
           /api/v2/overview/summary: ввод/ветви/небаланс через
           accounting_service, ОТДЕЛЬНО от живого снимка выше (снимок —
           "сейчас"; здесь — накопленный расход за выбранный период). -->
      <div style="margin-top:20px;margin-bottom:24px;padding:16px;background:var(--bg2);
                  border:1px solid var(--line);border-radius:8px">
        <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px">
          <div class="section-title" style="margin:0">Итог объекта за период</div>
          <div class="spacer"></div>
          <label class="muted" style="font-size:12px">с
            <input type="date" x-model="ovFrom" @change="loadOvSummary()"
                   style="background:var(--bg);border:1px solid var(--line);color:var(--txt);
                          border-radius:6px;padding:4px 8px;font-size:12px;margin-left:4px">
          </label>
          <label class="muted" style="font-size:12px">по
            <input type="date" x-model="ovTo" @change="loadOvSummary()"
                   style="background:var(--bg);border:1px solid var(--line);color:var(--txt);
                          border-radius:6px;padding:4px 8px;font-size:12px;margin-left:4px">
          </label>
          <button class="btn" @click="loadOvSummary()" :disabled="ovLoading">Обновить</button>
        </div>

        <template x-if="ovLoading && !ovSummary">
          <div class="empty"><span class="spin"></span> считаем…</div>
        </template>
        <template x-if="ovError">
          <div class="empty" style="color:var(--err)" x-text="ovError"></div>
        </template>

        <template x-if="!ovLoading && ovSummary">
          <div>
            <template x-if="ovSummary.object_total">
              <div style="margin-bottom:12px">
                <div class="val mono" style="font-size:28px">
                  <span x-text="fmt(ovSummary.object_total.value,1)"></span>
                  <small x-text="ovSummary.object_total.unit"></small>
                </div>
                <div class="muted" style="font-size:12px;cursor:pointer" @click="ovToggleDisclosure('object')">
                  <span x-text="ovDisclosureOpen.object?'▾':'▸'"></span> Из чего рассчитано
                </div>
                <div x-show="ovDisclosureOpen.object" style="font-size:12px;margin-top:4px" class="muted">
                  Сумма назначенного ввода объекта (точки:
                  <span x-text="(ovSummary.object_input_point_ids||[]).map(ovPointName).join(', ')||'—'"></span>)
                </div>
              </div>
            </template>
            <template x-if="!ovSummary.object_total && ovSummary.object_total_unavailable_reason==='no_input_assigned'">
              <div style="margin-bottom:12px">
                <div class="empty" style="text-align:left">
                  Для объекта не назначен ввод — итог не может быть посчитан честно
                  (сумма всех счётчиков подряд была бы неверной, если это не буквально
                  весь ввод объекта).
                  <div style="margin-top:8px">
                    <button class="btn btn-primary" @click="ovGoConfigureBoundary()">Настроить границу объекта</button>
                  </div>
                </div>
              </div>
            </template>
            <template x-if="!ovSummary.object_total && ovSummary.object_total_unavailable_reason && ovSummary.object_total_unavailable_reason!=='no_input_assigned'">
              <div class="empty" style="color:var(--err);text-align:left;margin-bottom:12px"
                   x-text="ovSummary.object_total_unavailable_reason"></div>
            </template>

            <div style="display:flex;gap:8px;align-items:baseline;margin-bottom:12px;padding:8px 0;
                        border-top:1px solid var(--line);border-bottom:1px solid var(--line)">
              <span class="muted" style="font-size:12px">Небаланс:</span>
              <span class="mono" :style="ovSummary.imbalance_value==null?'':(ovSummary.imbalance_value<0?'color:var(--err)':'color:var(--ok)')"
                    x-text="ovSummary.imbalance_value!=null?(ovSummary.imbalance_value>0?'+':'')+fmt(ovSummary.imbalance_value,1)+' кВт·ч':'не определён (не все ветви известны)'"></span>
              <!-- A08: критерий требует «Небаланс −10, −10%» — процент часть
                   результата, а не украшение. Значение приходит с сервера
                   (imbalance_percent), на фронте НЕ считается: экран, отчёт и
                   CSV обязаны показывать одно число из одного расчёта (A43).
                   При неопределённой или неположительной базе сервер вернёт
                   null с причиной — показываем прочерк, а не фиктивные 100%
                   (A11). -->
              <span class="mono" x-show="ovSummary.imbalance_value!=null"
                    :style="ovSummary.imbalance_percent==null?'color:var(--txt3)':(ovSummary.imbalance_percent<0?'color:var(--err)':'color:var(--ok)')"
                    x-text="ovSummary.imbalance_percent!=null?'('+(ovSummary.imbalance_percent>0?'+':'')+ovSummary.imbalance_percent.toFixed(2)+'% от итога объекта)':'(% не определён)'"
                    :title="ovSummary.imbalance_percent==null?('Процент не рассчитан: '+(ovSummary.imbalance_percent_reason||'нет данных')):''"></span>
            </div>

            <table class="rep-table" x-show="(ovSummary.branches||[]).length>0">
              <thead><tr>
                <th>Ветвь</th><th class="num">кВт·ч</th><th class="num">% объекта</th><th>Статус</th>
              </tr></thead>
              <tbody>
                <template x-for="b in (ovSummary.branches||[])" :key="b.group_id">
                  <tr>
                    <td x-text="b.name"></td>
                    <td class="num mono" x-text="b.mode==='sum'&&b.result?fmt(b.result.value,1):'—'"></td>
                    <td class="num mono" x-text="b.percentage_of_object!=null?fmt(b.percentage_of_object,1)+'%':'—'"></td>
                    <td class="muted" style="font-size:11px"
                        x-text="b.mode==='comparison'?'электрическое пересечение — точки ниже':(b.result?'':'нет данных')"></td>
                  </tr>
                </template>
              </tbody>
            </table>

            <template x-for="b in (ovSummary.branches||[]).filter(x=>x.mode==='comparison')" :key="'cmp_'+b.group_id">
              <div style="margin-top:8px;padding:8px;background:var(--bg);border-radius:6px;font-size:12px">
                <div class="muted" x-text="b.name+' — '+(b.conflict_reason||'подтверждённое электрическое пересечение')"></div>
                <template x-for="pid in Object.keys(b.points||{})" :key="pid">
                  <div style="display:flex;justify-content:space-between;padding:2px 0">
                    <span x-text="ovPointName(pid)"></span>
                    <span class="mono" x-text="b.points[pid].value!=null?fmt(b.points[pid].value,1)+' кВт·ч':'нет данных'"></span>
                  </div>
                </template>
              </div>
            </template>

            <div class="muted" style="font-size:11px;margin-top:6px" x-show="(ovSummary.ungrouped_point_ids||[]).length>0"
                 x-text="(ovSummary.ungrouped_point_ids||[]).length+' точек не входит ни в одну ветвь'"></div>
          </div>
        </template>
      </div>

      <template x-if="overviewV2Loading && !overviewV2Snapshot">
        <div class="empty"><span class="spin"></span> загрузка…</div>
      </template>
      <template x-if="overviewV2Error">
        <div class="empty" style="color:var(--err)" x-text="overviewV2Error"></div>
      </template>
      <template x-if="!overviewV2Loading && overviewV2Snapshot && overviewV2Snapshot.points.length===0">
        <div class="empty" style="text-align:left;line-height:1.5">
          <b>Точек учёта пока нет.</b><br>
          Новый интерфейс использует отдельную модель данных (точки учёта, места,
          электросеть, группы) — она не заполняется автоматически, а старые счётчики
          и группы из классического интерфейса в неё не попадают сами собой.
          Перенесите их одной операцией (безопасно повторять, перед переносом
          делается бэкап БД) — либо создайте точки вручную на вкладке «Настройки».
          <div style="margin-top:12px">
            <button class="btn btn-primary" @click="migrateLegacyConfirm=true"
                    :disabled="migrateLegacyBusy">Перенести легаси-данные</button>
          </div>
        </div>
      </template>
      <template x-if="overviewV2Groups.length>0 || overviewV2GroupsError">
        <div style="margin-bottom:24px">
          <div class="section-title">Ветки (группы верхнего уровня)</div>
          <template x-if="overviewV2GroupsError">
            <div class="empty" style="color:var(--err)" x-text="overviewV2GroupsError"></div>
          </template>
          <template x-if="!overviewV2GroupsError && overviewV2Groups.length>0">
            <table class="rep-table">
              <thead><tr>
                <th>Ветвь</th>
                <th class="num">P сейчас, кВт</th>
                <th class="num">E (снимок), кВт·ч</th>
                <th class="num">Точки</th>
              </tr></thead>
              <tbody>
                <template x-for="row in overviewV2BranchRows()" :key="row.group.id">
                  <tr>
                    <td>
                      <span style="display:inline-block;width:10px;height:10px;border-radius:3px;
                                   margin-right:6px;vertical-align:middle"
                            :style="`background:${row.group.color||'var(--txt3)'}`"></span>
                      <span x-text="row.group.name"></span>
                      <span class="muted" style="font-size:11px" x-show="row.group.category"
                            x-text="'('+row.group.category+')'"></span>
                    </td>
                    <td class="num mono" x-text="row.power_kw!=null?fmt(row.power_kw,1):'—'"></td>
                    <td class="num mono" x-text="row.energy_kwh!=null?fmt(row.energy_kwh,1):'—'"></td>
                    <td class="num mono" x-text="row.knownCount+'/'+row.pointCount"></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </template>
          <div class="muted" style="font-size:11px;margin-top:6px" x-show="overviewV2UngroupedCount()>0"
               x-text="overviewV2UngroupedCount()+' точек не входит ни в одну группу'"></div>
          <div class="muted" style="font-size:11px;margin-top:4px">
            Суммы по веткам — разбивка текущего снимка по составу группы, не проверенный итог объекта;
            ветки могут пересекаться (точка вправе состоять в нескольких группах, ТЗ §4.4).
          </div>
        </div>
      </template>
      <template x-if="overviewV2Problems().length>0">
        <div>
        <div class="section-title">Требует внимания</div>
        <div style="margin-bottom:24px">
          <template x-for="prob in overviewV2Problems()" :key="prob.point.point_id">
            <div style="display:flex;align-items:center;gap:12px;padding:10px 14px;
                        background:var(--bg2);border:1px solid var(--line);margin-bottom:8px;
                        border-radius:6px">
              <span class="badge" :style="badgeStyle(prob.point.device_status)"
                    x-text="prob.kind==='unbound'?'не привязана':statusLabel(prob.point.device_status)"></span>
              <span style="flex:1">
                <div style="font-weight:600" x-text="prob.point.name||prob.point.code"></div>
                <div class="muted" style="font-size:11px" x-text="'('+prob.point.code+')'"></div>
              </span>
              <span class="muted" style="font-size:11px;text-align:right"
                    x-text="prob.kind==='unbound'?'не привязана к прибору':(prob.kind==='no_connection'?'нет связи с устройством':prob.kind==='never_seen'?'устройство ещё не подключалось':'ошибка устройства')"></span>
            </div>
          </template>
        </div>
        </div>
      </template>
      <!-- Незавершённая конфигурация (ТЗ §8.2/§13, партия 3 задача 4) —
           /api/v2/validation: прибор/место/группа/план/измерение связи/
           изолированный узел. Сервер уже отсортировал по влиянию —
           порядок с бэкенда не переставляем. Каждая строка кликабельна —
           тот же общий инспектор (openInspector), что и в Плане v2,
           Отчётах и на вкладке «Структура» (ТЗ: "тот же инспектор...
           открывается идентично из плана, дерева, отчёта и списка
           проблем"). Отдельно от блока выше: тот смотрит на живую связь
           с устройством по снимку, этот — на завершённость настройки. -->
      <template x-if="validationResult && validationResult.issues.length>0">
        <div>
        <div class="section-title">Незавершённая конфигурация</div>
        <div style="margin-bottom:24px">
          <template x-for="issue in validationResult.issues" :key="issue.kind+'_'+issue.entity_type+'_'+issue.entity_id">
            <div style="display:flex;align-items:center;gap:12px;padding:10px 14px;
                        background:var(--bg2);border:1px solid var(--line);margin-bottom:8px;
                        border-radius:6px;cursor:pointer"
                 @click="openInspector(issue.entity_type, issue.entity_id)">
              <span class="badge" style="background:var(--warn)22;color:var(--warn);border:1px solid var(--warn)55"
                    x-text="validationIssueLabel(issue.kind)"></span>
              <span style="flex:1">
                <div style="font-weight:600" x-text="issue.label||('#'+issue.entity_id)"></div>
                <div class="muted" style="font-size:11px" x-show="issue.code" x-text="'('+issue.code+')'"></div>
              </span>
            </div>
          </template>
        </div>
        </div>
      </template>
      <template x-if="validationError">
        <div class="muted" style="font-size:11px;margin-bottom:16px" x-text="validationError"></div>
      </template>
      <template x-if="overviewV2Snapshot && overviewV2Snapshot.points.length>0">
        <div>
        <div class="section-title">Все точки учёта</div>
        <table class="rep-table">
          <thead><tr>
            <th>Код</th>
            <th>Имя</th>
            <th>Статус</th>
            <th class="num">Мощность, кВт</th>
            <th class="num">Энергия, кВт·ч</th>
            <th class="num">U L1, В</th>
            <th class="num">U L2, В</th>
            <th class="num">U L3, В</th>
            <th>Обновлено</th>
          </tr></thead>
          <tbody>
            <template x-for="p in overviewV2Snapshot.points" :key="p.point_id">
              <tr>
                <td style="font-family:monospace;font-size:12px" x-text="p.code"></td>
                <td x-text="p.name"></td>
                <td>
                  <span class="badge" :style="badgeStyle(p.binding_status==='unbound'?'unknown':p.device_status)"
                        x-text="p.binding_status==='unbound'?'не привязана':statusLabel(p.device_status)"></span>
                </td>
                <td class="num mono" x-text="p.power_w!=null?fmt(p.power_w/1000,2):'—'"></td>
                <td class="num mono" x-text="p.energy_total_kwh!=null?fmt(p.energy_total_kwh,1):'—'"></td>
                <td class="num mono" x-text="p.voltage_v?fmt(p.voltage_v.L1,0):'—'"></td>
                <td class="num mono" x-text="p.voltage_v?fmt(p.voltage_v.L2,0):'—'"></td>
                <td class="num mono" x-text="p.voltage_v?fmt(p.voltage_v.L3,0):'—'"></td>
                <td :class="updateAgeClass(p.last_update_age_s)">
                  <span x-text="fmtAge(p.last_update_age_s)"></span>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
        </div>
      </template>
    </div>
  </template>

  <!-- ОТЧЁТЫ v2 (ТЗ §8.4, партия 2 задача 3): срезы point/branch/group/
       balance_scope поверх /api/v2/reports/query — тот же расчётный
       слой, что и Обзор/metrics-query. Существующая классическая
       вкладка "Отчёты" (v1, tab=='reports' ниже) не тронута. -->
  <template x-if="tab=='reportsv2'">
    <div>
      <div class="section-title">Отчёты (§8.4)</div>
      <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px">
        <label class="muted" style="font-size:12px;display:block">Срез
          <select x-model="rv2Dimension" @change="rv2ScopeIds=[]; rv2Result=null; rv2Error=null"
                  style="display:block;background:var(--bg2);border:1px solid var(--line);color:var(--txt);
                         border-radius:6px;padding:6px 10px;font-size:13px;margin-top:2px">
            <option value="point">Точка</option>
            <option value="branch">Ветвь (все верхнего уровня)</option>
            <option value="group">Группа</option>
            <option value="balance_scope">Граница баланса</option>
          </select>
        </label>
        <label class="muted" style="font-size:12px;display:block" x-show="rv2Dimension!=='branch'">
          Состав (Ctrl/Cmd — несколько)
          <select multiple x-model="rv2ScopeIds" size="4"
                  style="display:block;background:var(--bg2);border:1px solid var(--line);color:var(--txt);
                         border-radius:6px;padding:6px 10px;font-size:13px;margin-top:2px;min-width:180px">
            <template x-for="opt in rv2ScopeOptions()" :key="opt.id">
              <option :value="opt.id" x-text="opt.label"></option>
            </template>
          </select>
        </label>
        <label class="muted" style="font-size:12px">с
          <input type="date" x-model="rv2From" style="display:block;margin-top:2px;background:var(--bg2);
                 border:1px solid var(--line);color:var(--txt);border-radius:6px;padding:6px 10px;font-size:13px">
        </label>
        <label class="muted" style="font-size:12px">по
          <input type="date" x-model="rv2To" style="display:block;margin-top:2px;background:var(--bg2);
                 border:1px solid var(--line);color:var(--txt);border-radius:6px;padding:6px 10px;font-size:13px">
        </label>
        <label class="muted" style="font-size:12px" x-show="rv2Dimension==='branch'||rv2Dimension==='group'">
          Состав группы
          <select x-model="rv2CompositionMode" style="display:block;margin-top:2px;background:var(--bg2);
                  border:1px solid var(--line);color:var(--txt);border-radius:6px;padding:6px 10px;font-size:13px">
            <option value="as_was">как было на начало периода (A21)</option>
            <option value="current">текущий (A22)</option>
          </select>
        </label>
        <label class="muted" style="font-size:12px">
          <input type="checkbox" x-model="rv2CompareEnabled"> Сравнить с периодом
        </label>
        <template x-if="rv2CompareEnabled">
          <div style="display:flex;gap:8px">
            <label class="muted" style="font-size:12px">с
              <input type="date" x-model="rv2CompareFrom" style="display:block;margin-top:2px;background:var(--bg2);
                     border:1px solid var(--line);color:var(--txt);border-radius:6px;padding:6px 10px;font-size:13px">
            </label>
            <label class="muted" style="font-size:12px">по
              <input type="date" x-model="rv2CompareTo" style="display:block;margin-top:2px;background:var(--bg2);
                     border:1px solid var(--line);color:var(--txt);border-radius:6px;padding:6px 10px;font-size:13px">
            </label>
          </div>
        </template>
        <button class="btn btn-primary" @click="runRv2Query()" :disabled="rv2Loading">Показать</button>
        <button class="btn" @click="downloadRv2Csv()" :disabled="!rv2Result">⬇ Скачать CSV</button>
      </div>

      <template x-if="rv2Loading">
        <div class="empty"><span class="spin"></span> считаем…</div>
      </template>
      <template x-if="rv2Error">
        <div class="empty" style="color:var(--err)" x-text="rv2Error"></div>
      </template>
      <template x-if="!rv2Loading && rv2Result">
        <div>
          <div class="muted" style="font-size:11px;margin-bottom:8px">
            Ревизия конфигурации: <span x-text="rv2Result.configuration_revision_id"></span> ·
            режим состава: <span x-text="rv2Result.composition_mode==='as_was'?'как было на начало периода':'текущий'"></span>
          </div>
          <table class="rep-table">
            <thead><tr>
              <th>Название</th><th class="num">Значение</th><th>Ед.</th><th>Доступность</th>
              <th>Флаги / конфликт</th><th>Состав</th>
              <template x-if="rv2Result.compare_period"><th class="num">Сравнение</th></template>
              <template x-if="rv2Result.compare_period"><th class="num">Изменение</th></template>
              <template x-if="rv2Result.compare_period"><th class="num">Изменение %</th></template>
              <template x-if="rv2Result.compare_period"><th>Состав менялся</th></template>
            </tr></thead>
            <tbody>
              <template x-for="row in rv2Result.rows" :key="row.dimension+'_'+row.id">
                <tr>
                  <!-- ТЗ §8.3: тот же общий инспектор, что и на «Структуре» —
                       balance_scope сюда не попадает (для неё нет отдельного
                       вида инспектора в этой задаче), точка/ветвь/группа
                       открывают карточку по клику. -->
                  <td>
                    <span x-show="row.dimension==='point'||row.dimension==='branch'||row.dimension==='group'"
                          style="cursor:pointer;text-decoration:underline dotted"
                          @click="openInspector(row.dimension==='point'?'point':'group', row.id)"
                          x-text="row.name"></span>
                    <span x-show="row.dimension==='balance_scope'" x-text="row.name"></span>
                  </td>
                  <td class="num mono" x-text="row.result&&row.result.value!=null?fmt(row.result.value,3):'—'"></td>
                  <td x-text="row.result?row.result.unit:''"></td>
                  <td x-text="row.result?row.result.availability:'—'"></td>
                  <td class="muted" style="font-size:11px" x-text="row.conflict_reason||(row.result?(row.result.quality_flags||[]).join(', '):'нет данных')"></td>
                  <td class="muted" style="font-size:11px" x-text="(row.member_point_ids||[]).length+' точ.'"></td>
                  <template x-if="rv2Result.compare_period">
                    <td class="num mono" x-text="row.compare_result&&row.compare_result.value!=null?fmt(row.compare_result.value,3):'—'"></td>
                  </template>
                  <template x-if="rv2Result.compare_period">
                    <td class="num mono" x-text="row.delta_value!=null?fmt(row.delta_value,3):'—'"></td>
                  </template>
                  <template x-if="rv2Result.compare_period">
                    <td class="num mono" x-text="row.delta_percentage!=null?fmt(row.delta_percentage,1)+'%':'—'"></td>
                  </template>
                  <template x-if="rv2Result.compare_period">
                    <td x-text="row.composition_changed===true?'да':(row.composition_changed===false?'нет':'—')"></td>
                  </template>
                </tr>
              </template>
            </tbody>
          </table>
          <div class="muted" style="font-size:11px;margin-top:8px">
            Числа взяты как есть из accounting_service (та же формула, что и в Обзоре и metrics/query) —
            округление на экране (3 знака) и в CSV (тоже 3 знака) согласовано.
          </div>
        </div>
      </template>
    </div>
  </template>

  <!-- СТРУКТУРА/ИНСПЕКТОР (ТЗ §8.3, партия 3, задача 1): дерево мест +
       поиск слева, дочерние элементы с метриками в центре, read-only
       инспектор справа. Инспектор общий для всего приложения — тот же
       structInspector открывается из Плана v2, Отчётов и «Требует
       внимания» на Обзоре через openInspector(kind,id) (см. <script>
       ниже, метод openInspector). Инспектор НЕ считает ничего сам —
       только показывает то, что уже посчитано существующими ручками v2
       (snapshot, metrics/query, points/<id>/bindings, points/<id>/groups,
       topology/*, groups/<id>/effective-members) — см. докстринг
       v2_structure_points в api_v2.py и модульный докстринг там же.
       Непривязанные/неразмещённые точки не прячутся — бакет «Без места»
       в дереве и явный статус «не привязана» в центре/инспекторе. -->
  <template x-if="tab=='structurev2'">
    <div>
      <div class="section-title">Структура (§8.3)</div>
      <template x-if="structError">
        <div class="empty" style="color:var(--err)" x-text="structError"></div>
      </template>
      <div class="structure-layout">
        <!-- дерево мест + поиск (A02: поиск по имени/коду/MQTT ID/
             серийнику/пути через /api/v2/structure/points?q=) -->
        <div class="structure-col structure-search">
          <input type="text" placeholder="Поиск: имя, код, MQTT ID, серийник, путь"
                 x-model="structQuery" @input="structureSearch()">
          <template x-if="structQuery.trim()===''">
            <div>
              <div class="structure-tree-row" :class="{active:structSelectedLocationId==='unplaced'}"
                   @click="structSelectedLocationId='unplaced'">
                <span>Без места</span>
                <span class="stc" x-text="structUnplacedPoints().length"></span>
              </div>
              <template x-for="row in structLocationRows()" :key="row.id">
                <div class="structure-tree-row" :class="{active:structSelectedLocationId===row.id}"
                     :style="'padding-left:'+(8+row.depth*14)+'px'"
                     @click="structSelectedLocationId=row.id">
                  <span x-text="row.name"></span>
                  <span class="stc" x-text="row.pointCount"></span>
                </div>
              </template>
              <div class="muted" style="font-size:11px;margin-top:10px" x-show="structLocations.length===0">
                Мест ещё не заведено.
              </div>
            </div>
          </template>
          <template x-if="structQuery.trim()!==''">
            <div class="muted" style="font-size:11px">Результаты поиска — в списке справа.</div>
          </template>
        </div>

        <!-- дочерние элементы с метриками (снимок — из /api/v2/snapshot,
             числа не пересчитываются здесь) -->
        <div class="structure-col">
          <template x-if="structLoading">
            <div class="empty"><span class="spin"></span> загрузка…</div>
          </template>
          <template x-if="!structLoading">
            <div>
              <div class="muted" style="font-size:11px;margin-bottom:8px" x-text="structCenterTitle()"></div>
              <template x-if="structCenterPoints().length===0">
                <div class="empty">Точек нет.</div>
              </template>
              <table class="rep-table" x-show="structCenterPoints().length>0">
                <thead><tr>
                  <th>Код</th><th>Имя</th><th>Статус</th>
                  <th class="num">Мощность, кВт</th><th>Место</th><th>На плане</th>
                </tr></thead>
                <tbody>
                  <template x-for="p in structCenterPoints()" :key="p.point_id">
                    <tr class="structure-list-row"
                        :class="{active:structInspector && structInspector.kind==='point' && structInspector.id===p.point_id}"
                        @click="openInspector('point', p.point_id)">
                      <td style="font-family:monospace;font-size:12px" x-text="p.code"></td>
                      <td x-text="p.name"></td>
                      <td>
                        <span class="badge"
                              :style="badgeStyle(!p.bound?'unknown':(structSnapshotFor(p.point_id)?structSnapshotFor(p.point_id).device_status:'unknown'))"
                              x-text="!p.bound?'не привязана':statusLabel(structSnapshotFor(p.point_id)?structSnapshotFor(p.point_id).device_status:'unknown')"></span>
                      </td>
                      <td class="num mono"
                          x-text="structSnapshotFor(p.point_id) && structSnapshotFor(p.point_id).power_w!=null?fmt(structSnapshotFor(p.point_id).power_w/1000,2):'—'"></td>
                      <td class="muted" style="font-size:11px" x-text="p.location_path||'—'"></td>
                      <td x-text="p.placed_on_plan?'да':'нет'"></td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </template>
        </div>

        <!-- read-only инспектор: точка/группа/узел/связь. Порядок полей
             точки — точно по ТЗ §8.3: имя/код → статус/свежесть →
             расход за период → фазные напряжения/токи → чем питается/что
             питает → место установки → группы → текущий прибор →
             история замен. -->
        <div class="structure-col">
          <template x-if="!structInspector">
            <div class="muted" style="font-size:12px">
              Выберите точку слева или в списке, чтобы увидеть карточку.
              Группы, узлы сети и связи открываются по ссылкам из карточки
              точки, из Плана v2, Отчётов или «Требует внимания» на Обзоре.
            </div>
          </template>
          <template x-if="structInspector && structInspectorLoading">
            <div class="empty"><span class="spin"></span> загрузка…</div>
          </template>
          <template x-if="structInspector && !structInspectorLoading && structInspectorError">
            <div style="color:var(--err);font-size:13px" x-text="structInspectorError"></div>
          </template>

          <!-- точка -->
          <template x-if="structInspector && !structInspectorLoading && !structInspectorError && structInspector.kind==='point'">
            <div>
              <div style="display:flex;justify-content:space-between;align-items:flex-start">
                <div>
                  <h3 style="margin:0 0 2px" x-text="structInspector.data.name"></h3>
                  <div class="muted mono" style="font-size:12px" x-text="structInspector.data.code"></div>
                </div>
                <button class="ico-btn" @click="closeInspector()">✕</button>
              </div>

              <div class="structure-field" style="margin-top:14px">
                <div class="sf-lbl">Статус / свежесть</div>
                <div class="sf-val">
                  <span class="badge"
                        :style="badgeStyle(!structInspector.snapshot?'unknown':(structInspector.snapshot.binding_status==='unbound'?'unknown':structInspector.snapshot.device_status))"
                        x-text="!structInspector.snapshot?'—':(structInspector.snapshot.binding_status==='unbound'?'не привязана':statusLabel(structInspector.snapshot.device_status))"></span>
                  <span class="muted" style="font-size:11px;margin-left:8px"
                        x-text="structInspector.snapshot?fmtAge(structInspector.snapshot.last_update_age_s):''"></span>
                </div>
              </div>

              <div class="structure-field">
                <div class="sf-lbl">Расход за период</div>
                <div class="sf-val"
                     x-text="!structInspector.consumption?'—':(structInspector.consumption.value!=null?fmt(structInspector.consumption.value,2)+' '+structInspector.consumption.unit:'нет данных ('+structInspector.consumption.availability+')')"></div>
                <div class="muted" style="font-size:11px" x-text="structPeriodLabel()"></div>
              </div>

              <div class="structure-field" x-show="structInspector.snapshot && structInspector.snapshot.voltage_v">
                <div class="sf-lbl">Напряжение по фазам, В</div>
                <div class="sf-val mono">
                  L1: <span x-text="structInspector.snapshot && structInspector.snapshot.voltage_v?fmt(structInspector.snapshot.voltage_v.L1,0):'—'"></span> ·
                  L2: <span x-text="structInspector.snapshot && structInspector.snapshot.voltage_v?fmt(structInspector.snapshot.voltage_v.L2,0):'—'"></span> ·
                  L3: <span x-text="structInspector.snapshot && structInspector.snapshot.voltage_v?fmt(structInspector.snapshot.voltage_v.L3,0):'—'"></span>
                </div>
              </div>
              <div class="structure-field" x-show="structInspector.snapshot && structInspector.snapshot.current_a">
                <div class="sf-lbl">Ток по фазам, А</div>
                <div class="sf-val mono">
                  L1: <span x-text="structInspector.snapshot && structInspector.snapshot.current_a?fmt(structInspector.snapshot.current_a.L1,2):'—'"></span> ·
                  L2: <span x-text="structInspector.snapshot && structInspector.snapshot.current_a?fmt(structInspector.snapshot.current_a.L2,2):'—'"></span> ·
                  L3: <span x-text="structInspector.snapshot && structInspector.snapshot.current_a?fmt(structInspector.snapshot.current_a.L3,2):'—'"></span>
                </div>
              </div>

              <div class="structure-field">
                <div class="sf-lbl">Чем питается / что питает (по опубликованной схеме)</div>
                <template x-if="structFeed(structInspector.id).measuredEdges.length===0">
                  <div class="sf-val muted">Точка не назначена измерением ни одной опубликованной связи.</div>
                </template>
                <template x-for="f in structFeed(structInspector.id).measuredEdges" :key="f.edge.id">
                  <div class="sf-val" style="margin-bottom:6px">
                    <div class="muted" style="font-size:11px" x-text="'Измеряет связь: '+(f.edge.name||f.edge.code||('#'+f.edge.id))"></div>
                    <div x-text="'Питается от: '+(f.fedBy.length?f.fedBy.map(x=>x.name||x.code).join(', '):'— (ввод / верхний узел схемы)')"></div>
                    <div x-text="'Питает: '+(f.feeds.length?f.feeds.map(x=>x.name||x.code).join(', '):'— (конечных потребителей на схеме нет)')"></div>
                  </div>
                </template>
              </div>

              <div class="structure-field">
                <div class="sf-lbl">Место установки</div>
                <div class="sf-val" x-text="structInspector.data.location_path||'не задано'"></div>
              </div>

              <div class="structure-field">
                <div class="sf-lbl">Группы</div>
                <template x-if="structInspector.groups.length===0">
                  <div class="sf-val muted">Ни в одной группе</div>
                </template>
                <template x-for="g in structInspector.groups" :key="g.id">
                  <span class="structure-chip" @click="openInspector('group', g.id)" x-text="g.name"></span>
                </template>
              </div>

              <div class="structure-field">
                <div class="sf-lbl">Текущий прибор</div>
                <div class="sf-val" x-show="structInspector.data.meter_device_id">
                  <div x-text="'Адрес: '+structInspector.data.meter_controller_key+' / '+structInspector.data.meter_device_id"></div>
                  <div class="muted" style="font-size:11px" x-show="structInspector.data.meter_serial"
                       x-text="'Серийный: '+structInspector.data.meter_serial"></div>
                </div>
                <div class="sf-val muted" x-show="!structInspector.data.meter_device_id">Прибор не привязан</div>
              </div>

              <div class="structure-field">
                <div class="sf-lbl">История замен</div>
                <template x-if="structInspector.bindings.length===0">
                  <div class="sf-val muted">Записей нет</div>
                </template>
                <template x-for="b in structInspector.bindings" :key="b.id">
                  <div class="sf-val muted" style="font-size:11px;margin-bottom:4px">
                    <span x-text="fmtTime(b.valid_from)"></span> — <span x-text="b.valid_to?fmtTime(b.valid_to):'по н.в.'"></span>
                    · источник #<span x-text="b.meter_source_id"></span>
                    <span x-show="b.replacement_note" x-text="' · '+b.replacement_note"></span>
                  </div>
                </template>
              </div>
            </div>
          </template>

          <!-- группа: состав/сумма вместо атрибутов прибора -->
          <template x-if="structInspector && !structInspectorLoading && !structInspectorError && structInspector.kind==='group'">
            <div>
              <div style="display:flex;justify-content:space-between;align-items:flex-start">
                <div>
                  <h3 style="margin:0 0 2px" x-text="structInspector.data.name"></h3>
                  <div class="muted" style="font-size:12px" x-text="structInspector.data.category||'группа'"></div>
                </div>
                <button class="ico-btn" @click="closeInspector()">✕</button>
              </div>
              <div class="structure-field" style="margin-top:14px">
                <div class="sf-lbl">Состав (рекурсивно, дедуплицирован, с происхождением)</div>
                <template x-for="m in structInspector.members" :key="m.point_id">
                  <div class="sf-val" style="font-size:12px;margin-bottom:3px;cursor:pointer"
                       @click="openInspector('point', m.point_id)">
                    <span x-text="m.name||m.code"></span>
                    <span class="muted" x-show="m.via && m.via.length>1" x-text="' (через: '+m.via.join(', ')+')'"></span>
                  </div>
                </template>
                <div class="muted" style="font-size:11px" x-show="structInspector.members.length===0">Пусто</div>
              </div>
              <div class="structure-field">
                <div class="sf-lbl">Сумма за период</div>
                <div class="sf-val"
                     x-text="!structInspector.sum?'—':(structInspector.sum.value!=null?fmt(structInspector.sum.value,2)+' '+structInspector.sum.unit:'нет данных ('+structInspector.sum.availability+')')"></div>
                <div class="muted" style="font-size:11px" x-show="structInspector.sum && (structInspector.sum.quality_flags||[]).length"
                     x-text="(structInspector.sum.quality_flags||[]).join(', ')"></div>
                <div class="muted" style="font-size:11px" x-text="structPeriodLabel()"></div>
              </div>
            </div>
          </template>

          <!-- узел сети -->
          <template x-if="structInspector && !structInspectorLoading && !structInspectorError && structInspector.kind==='node'">
            <div>
              <div style="display:flex;justify-content:space-between;align-items:flex-start">
                <div>
                  <h3 style="margin:0 0 2px" x-text="structInspector.data.name"></h3>
                  <div class="muted" style="font-size:12px" x-text="structNodeKindLabel(structInspector.data.kind)"></div>
                </div>
                <button class="ico-btn" @click="closeInspector()">✕</button>
              </div>
              <div class="structure-field" style="margin-top:14px">
                <div class="sf-lbl">Код</div>
                <div class="sf-val mono" x-text="structInspector.data.code"></div>
              </div>
              <div class="structure-field">
                <div class="sf-lbl">Связи (опубликованные)</div>
                <template x-for="e in structNodeEdges(structInspector.data.id)" :key="e.id">
                  <div class="sf-val" style="cursor:pointer;margin-bottom:4px" @click="openInspector('edge', e.id)"
                       x-text="(e.name||e.code||('#'+e.id))+' — '+(e.from_node_id===structInspector.data.id?'от этого узла':'к этому узлу')"></div>
                </template>
                <div class="muted" style="font-size:11px" x-show="structNodeEdges(structInspector.data.id).length===0">
                  Связей нет — узел изолирован (см. «Требует внимания» на Обзоре).
                </div>
              </div>
            </div>
          </template>

          <!-- связь -->
          <template x-if="structInspector && !structInspectorLoading && !structInspectorError && structInspector.kind==='edge'">
            <div>
              <div style="display:flex;justify-content:space-between;align-items:flex-start">
                <div>
                  <h3 style="margin:0 0 2px" x-text="structInspector.data.name||structInspector.data.code||('Связь #'+structInspector.data.id)"></h3>
                  <div class="muted" style="font-size:12px" x-text="'состояние: '+structInspector.data.state"></div>
                </div>
                <button class="ico-btn" @click="closeInspector()">✕</button>
              </div>
              <div class="structure-field" style="margin-top:14px">
                <div class="sf-lbl">Концы</div>
                <div class="sf-val" x-text="'от: '+structNodeName(structInspector.data.from_node_id)+' → к: '+structNodeName(structInspector.data.to_node_id)"></div>
              </div>
              <div class="structure-field">
                <div class="sf-lbl">Измерение</div>
                <template x-if="structInspector.data.primary_point_id">
                  <div class="sf-val" style="cursor:pointer" @click="openInspector('point', structInspector.data.primary_point_id)"
                       x-text="'точка учёта #'+structInspector.data.primary_point_id"></div>
                </template>
                <div class="sf-val muted" x-show="!structInspector.data.primary_point_id">
                  Без измерения (см. «Требует внимания» на Обзоре).
                </div>
              </div>
              <div class="structure-field">
                <div class="sf-lbl">Фазы / номинальный ток</div>
                <div class="sf-val mono"
                     x-text="(structInspector.data.phase_count||'—')+' фаз, '+(structInspector.data.rated_current_a!=null?structInspector.data.rated_current_a+' А':'ток не указан')"></div>
              </div>
              <div class="structure-field" x-show="structInspector.data.cable_note">
                <div class="sf-lbl">Кабель</div>
                <div class="sf-val" x-text="structInspector.data.cable_note"></div>
              </div>
            </div>
          </template>
        </div>
      </div>
    </div>
  </template>

  <!-- ПЛАН ОБЪЕКТА (ТЗ v0.11.0). Сознательно НЕ template x-if: x-if
       уничтожает DOM при переключении вкладок, а Leaflet держит
       собственный DOM внутри контейнера карты — при повторном входе
       получится либо мусор, либо "Map container is already initialized".
       x-show просто скрывает блок через display:none, карта создаётся
       один раз в x-init контейнера и переживает переключения вкладок. -->
  <div x-show="tab=='plan'">
    <template x-if="!planLoading && planPlans.length===0 && !planEditMode">
      <div class="plan-empty">
        <p style="margin-bottom:14px">Планов объекта пока нет.</p>
        <!-- Именно togglePlanEdit(), а не `planEditMode=true`: он ещё и
             дёргает invalidateSize(). Контейнер карты в этот момент
             становится видимым впервые, а Leaflet посчитал свой размер,
             когда блок был display:none, — без invalidateSize() карта
             отрисуется мусором (см. AGENTS.md, грабли про Leaflet). -->
        <button class="btn btn-primary" @click="togglePlanEdit()">Загрузить план</button>
      </div>
    </template>

    <!-- ВАЖНО: условие включает `|| planEditMode`, а не только
         `planPlans.length>0`. Форма загрузки плана лежит ВНУТРИ этого
         блока (panel .plan-side ниже), поэтому при условии лишь на
         количество планов получалась «курица и яйцо»: кнопка «Загрузить
         план» из пустого состояния ставила planEditMode=true, но сам
         блок с формой оставался скрыт — ведь планов всё ещё ноль.
         Пользователь видел неработающую кнопку и ни одного элемента
         управления, загрузить первый план было физически нечем.
         Регрессия закрыта тестом test_plan_upload_form_reachable_when_no_plans. -->
    <div x-show="planPlans.length>0 || planEditMode">
      <div class="plan-toolbar">
        <select x-model.number="planCurrentId" @change="selectPlan(planCurrentId)"
                style="background:var(--bg2);border:1px solid var(--line);color:var(--txt);

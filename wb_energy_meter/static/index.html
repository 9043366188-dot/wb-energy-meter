  // === План v2 (ТЗ §7): выбор плана, отрисовка фона/элементов/связей,
  // инспектор по клику, редактирование локальным черновиком (Stage D,
  // §7.3) — перетаскивание, добавление/удаление элементов и edge_views,
  // undo/redo, атомарное сохранение через /layout (A35). Формула координат
  // (lat=H-y, lng=x) в _planV2XyToLatLng ВЕРИФИЦИРОВАНА реальным
  // leaflet.js в headless-проверке (см. wb_energy_meter/plan_geo_v2.py,
  // коммит db36c2a) — не менять без повторной проверки.
  //
  // ВАЖНО про _planV2RenderBase() vs _planV2RenderItems(): фон и
  // map.fitBounds() перерисовываются ТОЛЬКО при выборе/загрузке плана
  // (_planV2RenderBase) — иначе каждое перетаскивание метки сбрасывало бы
  // масштаб/позицию карты обратно на "показать весь план". Черновик,
  // drag/add/remove и undo/redo дёргают только _planV2RenderItems()
  // (метки + линии связей), фон и вид карты не трогают.
  initPlanV2Map(){
    if(_planV2Map) return;
    const el=this.$refs.planV2Map;
    _planV2Map=L.map(el, {crs:L.CRS.Simple, minZoom:-4, zoomControl:true,
                          attributionControl:false});
    _planV2Map.setView([0,0],0);
    _planV2Map.on('click', (e)=>this._planV2OnMapClick(e));
    _planV2Map.on('pm:create', (e)=>this._planV2OnPmCreate(e));
    window.addEventListener('resize', ()=>{ if(_planV2Map) _planV2Map.invalidateSize(); });
  },

  // ---- Overview v2 (ТЗ §8.2) ----
  async openOverviewV2Tab(){
    if(!this.overviewV2Inited){
      this.overviewV2Inited=true;
      await Promise.all([this.loadOverviewV2Snapshot(), this.loadOverviewV2Groups(),
                          this.initOvAccounting(), this.loadValidation()]);
    }
  },
  async loadValidation(){
    // §8.2/§13 (партия 3, задача 4): сводка незавершённой настройки —
    // сервер уже отсортировал issues по влиянию (no_meter впереди no_plan
    // и т.п., см. _VALIDATION_IMPACT_RANK в api_v2.py), на фронте порядок
    // не трогаем. Необязательно для остального Обзора при ошибке.
    this.validationLoading=true; this.validationError=null;
    try{
      const r=await fetch('/api/v2/validation');
      if(!r.ok) throw new Error(`HTTP ${r.status}`);
      this.validationResult=await r.json();
    }catch(e){
      this.validationError='Не удалось получить сводку конфигурации: '+e.message;
    }finally{
      this.validationLoading=false;
    }
  },
  validationIssueLabel(kind){
    return {
      no_meter:'нет прибора', no_location:'нет места', no_group:'нет группы',
      no_plan:'не размещена на плане', node_without_edges:'узел изолирован',
      edge_without_measurement:'связь без измерения',
    }[kind] || kind;
  },
  async loadOverviewV2Groups(){
    // Корневые группы (parent_id=null) + их ЭФФЕКТИВНЫЙ состав
    // (GroupRepoV2.resolve_effective_members на бэкенде -- сама группа +
    // все дочерние, дедуплицировано по точке). Не критично для остального
    // экрана: при ошибке просто не показываем таблицу веток, снимок и
    // KPI-плитки работают независимо от групп.
    try{
      const r=await fetch('/api/v2/groups?parent_id=null');
      if(!r.ok) throw new Error(`HTTP ${r.status}`);
      const groups=await r.json();
      const members={};
      await Promise.all(groups.map(async g=>{
        const rm=await fetch(`/api/v2/groups/${g.id}/effective-members`);
        if(!rm.ok) throw new Error(`HTTP ${rm.status} (группа ${g.id})`);
        const dm=await rm.json();
        members[g.id]=new Set(dm.points.map(p=>p.point_id));
      }));
      this.overviewV2Groups=groups;
      this.overviewV2GroupMembers=members;
      this.overviewV2GroupsError=null;
    }catch(e){
      this.overviewV2Groups=[];
      this.overviewV2GroupMembers={};
      this.overviewV2GroupsError=`Не удалось загрузить группы: ${e.message}`;
    }
  },
  overviewV2BranchRows(){
    // ТЗ §8.2 "Распределение 1 уровня": по каждой корневой группе -- сумма
    // ТЕКУЩЕГО снимка (не период-баланс) по её эффективному составу.
    // ВАЖНО: это информационная разбивка по веткам, а не компоненты
    // проверенного итога объекта -- ветки могут пересекаться по точкам
    // (ТЗ §4.4 разрешает одной точке состоять в нескольких группах,
    // например в дереве категории "арендаторы" И "производство"
    // одновременно), поэтому сумма строк таблицы НЕ обязана и не должна
    // совпадать с overviewV2TotalPowerKw()/overviewV2TotalEnergyKwh() --
    // те считаются по ВСЕМ точкам снимка независимо от групп. Здесь та же
    // null-vs-0 защита (A10), что и в overviewV2TotalPowerKw().
    if(!this.overviewV2Snapshot || !this.overviewV2Snapshot.points) return [];
    const byId={};
    for(const p of this.overviewV2Snapshot.points) byId[p.point_id]=p;
    return this.overviewV2Groups.map(g=>{
      const memberIds=this.overviewV2GroupMembers[g.id]||new Set();
      const pts=[...memberIds].map(id=>byId[id]).filter(Boolean);
      const withPower=pts.filter(p=>p.power_w!=null);
      const withEnergy=pts.filter(p=>p.energy_total_kwh!=null);
      return {
        group:g,
        pointCount:pts.length,
        knownCount:withPower.length,
        power_kw: withPower.length>0 ? withPower.reduce((s,p)=>s+p.power_w,0)/1000 : null,
        energy_kwh: withEnergy.length>0 ? withEnergy.reduce((s,p)=>s+p.energy_total_kwh,0) : null,
      };
    });
  },
  overviewV2UngroupedCount(){
    // Точки снимка, не входящие НИ В ОДНУ корневую группу (по любому
    // пути) -- индикатор полноты структуры, не "небаланс" (для него
    // нужен проверенный balance-scope, не просто сумма по составу).
    if(!this.overviewV2Snapshot || !this.overviewV2Snapshot.points) return 0;
    const grouped=new Set();
    for(const g of this.overviewV2Groups){
      const ids=this.overviewV2GroupMembers[g.id];
      if(ids) for(const id of ids) grouped.add(id);
    }
    return this.overviewV2Snapshot.points.filter(p=>!grouped.has(p.point_id)).length;
  },
  async loadOverviewV2Snapshot(){
    const shouldShowLoading=!this.overviewV2Snapshot;
    if(shouldShowLoading) this.overviewV2Loading=true;
    try{
      const r=await fetch('/api/v2/snapshot');
      if(!r.ok){ throw new Error(`HTTP ${r.status}`); }
      const d=await r.json();
      this.overviewV2Snapshot=d;
      this.overviewV2Error=null;
    }catch(e){
      this.overviewV2Error=`Не удалось загрузить снимок: ${e.message}`;
    }finally{
      this.overviewV2Loading=false;
    }
  },
  overviewV2TotalPowerKw(){
    // ТЗ A10: точка с настоящим нулевым чтением ("исправна, но нагрузки
    // нет") — это 0, а не "нет данных". Отличаем по наличию хотя бы
    // одного НЕ-null значения, а не по знаку суммы (сумма из одних
    // истинных нулей тоже 0, и это не то же самое, что "нечего сложить").
    if(!this.overviewV2Snapshot || !this.overviewV2Snapshot.points) return null;
    const known=this.overviewV2Snapshot.points.filter(p=>p.power_w!=null);
    if(known.length===0) return null;
    return known.reduce((sum,p)=>sum+p.power_w, 0)/1000;
  },
  overviewV2TotalEnergyKwh(){
    if(!this.overviewV2Snapshot || !this.overviewV2Snapshot.points) return null;
    const known=this.overviewV2Snapshot.points.filter(p=>p.energy_total_kwh!=null);
    if(known.length===0) return null;
    return known.reduce((sum,p)=>sum+p.energy_total_kwh, 0);
  },
  overviewV2Problems(){
    if(!this.overviewV2Snapshot || !this.overviewV2Snapshot.points) return [];
    const probs=[];
    for(const p of this.overviewV2Snapshot.points){
      if(p.binding_status==='unbound'){
        probs.push({point:p, kind:'unbound'});
      }else if(['never_seen','no_connection','device_error'].includes(p.device_status)){
        probs.push({point:p, kind:p.device_status});
      }
    }
    return probs;
  },

  // ---- Итог объекта за период (ТЗ §8.2, партия 2 задача 2) ----
  _ovDefaultDates(){
    // По умолчанию — с начала текущего месяца по сегодня (без сегодняшнего
    // дня целиком, т.к. `to` — конец полуоткрытого периода [from,to)).
    const today=new Date();
    const first=new Date(today.getFullYear(), today.getMonth(), 1);
    const fmt=d=>d.toISOString().slice(0,10);
    return {from: fmt(first), to: fmt(today)};
  },
  async initOvAccounting(){
    if(!this.ovFrom || !this.ovTo){
      const d=this._ovDefaultDates();
      this.ovFrom=d.from; this.ovTo=d.to;
    }
    await this._loadOvPointNames();
    await this.loadOvSummary();
  },
  async _loadOvPointNames(){
    // Имена точек для disclosure/раздельных строк при конфликте (A04) —
    // не критично для остального блока, при ошибке просто покажем "#id".
    if(Object.keys(this.ovPointNames).length>0) return;
    try{
      const r=await fetch('/api/v2/points');
      if(!r.ok) return;
      const pts=await r.json();
      const names={};
      (pts||[]).forEach(p=>{ names[p.id]=p.name||p.code; });
      this.ovPointNames=names;
    }catch(e){ /* необязательно */ }
  },
  ovPointName(id){ return this.ovPointNames[id] || ('#'+id); },
  async loadOvSummary(){
    // Даты <input type=date> ("YYYY-MM-DD") принимаются backend'ом
    // напрямую (periods.py::parse_user_datetime) — конвертация в unix

  ovGoConfigureBoundary(){

  // ---- Отчёты v2 (ТЗ §8.4, партия 2 задача 3) ----
  async openReportsV2Tab(){

      const d=this._ovDefaultDates();  // тот же дефолт периода, что и у "Итог объекта за период"

  async _loadRv2Options(){
    // Списки для пикера состава (точка/группа/граница баланса) —
    // необязательно для самого расчёта, при ошибке пикеры просто пустые.
    try{
      const [pr, gr, br] = await Promise.all([
        fetch('/api/v2/points'), fetch('/api/v2/groups'), fetch('/api/v2/balance-scopes')]);
      this.rv2Points = pr.ok ? await pr.json() : [];
      this.rv2Groups = gr.ok ? await gr.json() : [];
      this.rv2BalanceScopes = br.ok ? await br.json() : [];
    }catch(e){ /* необязательно */ }
  },
  rv2ScopeOptions(){
    if(this.rv2Dimension==='point') return this.rv2Points.map(p=>({id:p.id, label:(p.name||p.code)}));
    if(this.rv2Dimension==='group') return this.rv2Groups.map(g=>({id:g.id, label:g.name}));
    if(this.rv2Dimension==='balance_scope') return this.rv2BalanceScopes.map(s=>({id:s.id, label:s.name}));
    return [];
  },
  async runRv2Query(){
    if(!this.rv2From || !this.rv2To) return;
    if(this.rv2Dimension!=='branch' && this.rv2ScopeIds.length===0){
      this.rv2Error='Выберите хотя бы один элемент состава'; this.rv2Result=null; return;
    }
    this.rv2Loading=true; this.rv2Error=null;
    try{
      const tz=(Intl.DateTimeFormat().resolvedOptions().timeZone)||'UTC';
      const body={
        dimension:this.rv2Dimension, from:this.rv2From, to:this.rv2To, timezone:tz,
        composition_mode:this.rv2CompositionMode,
      };
      if(this.rv2Dimension!=='branch') body.scope_ids=this.rv2ScopeIds.map(Number);
      if(this.rv2CompareEnabled && this.rv2CompareFrom && this.rv2CompareTo){
        body.compare={from:this.rv2CompareFrom, to:this.rv2CompareTo};
      }
      const r=await fetch('/api/v2/reports/query', {
        method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
      const d=await r.json();
      if(!r.ok) throw new Error(d.message||`HTTP ${r.status}`);
      this.rv2Result=d;
    }catch(e){
      this.rv2Error=`Не удалось получить отчёт: ${e.message}`;
      this.rv2Result=null;
    }finally{
      this.rv2Loading=false;
    }
  },
  downloadRv2Csv(){
    // A45: csvCell() уже нейтрализует префиксы формул (=+-@) — те же
    // правила, что и в существующих выгрузках v1. Числа НЕ идут через
    // csvCell (пишутся как есть, округлённые до 3 знаков — то же
    // округление, что и на экране, см. таблицу выше).
    if(!this.rv2Result) return;
    const d=this.rv2Result;
    const hasCmp = !!d.compare_period;
    const r3=v=>v!=null?Math.round(v*1000)/1000:'';
    const head=['Срез','ID','Название','Точки состава','Значение','Известная частичная сумма',
      'Единица','Доступность','Флаги качества','Ожидалось часов','Валидно часов',
      'С','По','Часовой пояс','Ревизия конфигурации','Режим состава','Конфликт'];
    if(hasCmp) head.push('Сравнение: с','Сравнение: по','Значение сравнения','Изменение',
      'Изменение %','Состав изменился','Конфликт сравнения');
    const lines=['﻿', `wb-energy-meter — Отчёт v2 (${d.dimension}, состав: ${d.composition_mode})`,
      '', head.join(';')];
    (d.rows||[]).forEach(row=>{
      const res=row.result;
      const names=(row.member_point_ids||[]).map(id=>this.ovPointName(id)).join(', ');
      const cells=[
        this.csvCell(row.dimension), row.id, this.csvCell(row.name), this.csvCell(names),
        r3(res?res.value:null), r3(res?res.known_value:null),
        this.csvCell(res?res.unit:''), this.csvCell(res?res.availability:''),
        this.csvCell(res?(res.quality_flags||[]).join('|'):''),
        res?res.expected_count:'', res?res.valid_count:'',
        this.csvCell(d.period.from), this.csvCell(d.period.to), this.csvCell(d.period.timezone),
        d.configuration_revision_id, this.csvCell(d.composition_mode),
        this.csvCell(row.conflict_reason||''),
      ];
      if(hasCmp){
        const cr=row.compare_result;
        cells.push(
          this.csvCell(d.compare_period.from), this.csvCell(d.compare_period.to),
          r3(cr?cr.value:null), r3(row.delta_value), row.delta_percentage!=null?row.delta_percentage:'',
          row.composition_changed===true?'да':(row.composition_changed===false?'нет':''),
          this.csvCell(row.compare_conflict_reason||''),
        );
      }
      lines.push(cells.join(';'));
    });
    const blob=new Blob([lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=`report_v2_${d.dimension}_${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
  },

  // ------------------------------------------------------------------
  // Структура/инспектор (ТЗ §8.3, партия 3, задача 1). openInspector —
  // единственная точка входа, которой пользуются также План v2, Отчёты
  // и «Требует внимания» на Обзоре: переключает на эту вкладку и грузит
  // карточку, поэтому инспектор гарантированно один и тот же везде (ТЗ:
  // "тот же инспектор... открывается идентично из плана, дерева, отчёта
  // и списка проблем"). Сам инспектор ничего не считает — только читает
  // уже существующие ручки v2 (см. докстринг v2_structure_points и
  // модульный докстринг в api_v2.py).
  // ------------------------------------------------------------------
  async openStructureTab(){
    if(this.structInited) return;
    this.structInited=true;
    await this._loadStructureLists();
  },
  async _loadStructureLists(){
    this.structLoading=true; this.structError=null;
    try{
      const [pr, lr, gr, nr, er] = await Promise.all([
        fetch('/api/v2/structure/points'),
        fetch('/api/v2/locations'),
        fetch('/api/v2/groups'),
        fetch('/api/v2/topology/nodes'),
        fetch('/api/v2/topology/edges?state=published'),
      ]);
      if(!pr.ok) throw new Error('structure/points: HTTP '+pr.status);
      this.structPoints = await pr.json();
      this.structLocations = lr.ok ? await lr.json() : [];
      this.structGroups = gr.ok ? await gr.json() : [];
      this.structNodes = nr.ok ? await nr.json() : [];
      this.structEdges = er.ok ? await er.json() : [];
      await this._loadStructureSnapshot();
    }catch(e){
      this.structError = 'Не удалось загрузить структуру: '+e.message;
    }finally{
      this.structLoading=false;
    }
  },
  async _loadStructureSnapshot(){
    // Метрики центра/списка (мощность, статус) — из общего снимка,
    // ничего не пересчитывается здесь (см. модульный докстринг
    // v2_snapshot в api_v2.py).
    try{
      const r=await fetch('/api/v2/snapshot');
      const d=await r.json();
      this._structSnapshotById = {};
      (d.points||[]).forEach(p=>{ this._structSnapshotById[p.point_id]=p; });
    }catch(e){ this._structSnapshotById = this._structSnapshotById||{}; }
  },
  structSnapshotFor(pointId){
    return (this._structSnapshotById||{})[pointId] || null;
  },
  async structureSearch(){
    // A02: поиск по имени/коду/MQTT ID/серийнику/пути через
    // /api/v2/structure/points?q= — сервер уже фильтрует и не прячет
    // непривязанные/неразмещённые точки. _structSearchSeq защищает от
    // устаревшего ответа, если пользователь печатает быстро.
    const seq = ++this._structSearchSeq;
    const q = this.structQuery.trim();
    try{
      const r = await fetch('/api/v2/structure/points'+(q?('?q='+encodeURIComponent(q)):''));
      const d = await r.json();
      if(seq !== this._structSearchSeq) return;
      if(q){
        this._structSearchResults = d.points||[];
      }else{
        this.structPoints = d.points||[];
        this._structSearchResults = null;
        await this._loadStructureSnapshot();
      }
    }catch(e){ /* поиск best-effort, не валим экран */ }
  },
  structLocationRows(){
    // Плоский отсортированный список мест с отступом по глубине —
    // визуально дерево, без рекурсивных Alpine-компонентов (тот же приём,
    // что и остальной интерфейс — минимум магии в разметке).
    const byParent = {};
    (this.structLocations||[]).filter(l=>!l.archived_at).forEach(l=>{
      const key = l.parent_id==null ? 'root' : String(l.parent_id);
      (byParent[key] = byParent[key]||[]).push(l);
    });
    const countsByLoc = this._structPointCountsByLocation();
    const rows = [];
    const walk = (parentKey, depth) => {
      const children = (byParent[parentKey]||[]).slice()
        .sort((a,b)=>(a.sort_order-b.sort_order)||String(a.name).localeCompare(String(b.name)));
      children.forEach(l=>{
        rows.push({id:l.id, name:l.name, depth, pointCount: countsByLoc[l.id]||0});
        walk(String(l.id), depth+1);
      });
    };
    walk('root', 0);
    return rows;
  },
  _structPointCountsByLocation(){
    const counts = {};
    (this.structPoints||[]).forEach(p=>{
      if(p.location_id!=null) counts[p.location_id]=(counts[p.location_id]||0)+1;
    });
    return counts;
  },
  structUnplacedPoints(){
    // §8.3: "непривязанные/неразмещённые точки — в отдельной доступной
    // коллекции, никогда не пропадают молча" — этот бакет и есть та
    // коллекция для мест (по прибору — badge "не привязана" в списке).
    return (this.structPoints||[]).filter(p=>p.location_id==null);
  },
  structCenterTitle(){
    if(this.structQuery.trim()!=='') return `Результаты поиска «${this.structQuery.trim()}»`;
    if(this.structSelectedLocationId==='unplaced') return 'Точки без места установки';
    if(this.structSelectedLocationId==null) return 'Выберите место слева';
    const loc = (this.structLocations||[]).find(l=>l.id===this.structSelectedLocationId);
    return loc ? ('Место: '+loc.name) : '';
  },
  structCenterPoints(){
    if(this.structQuery.trim()!=='') return this._structSearchResults || [];
    if(this.structSelectedLocationId==='unplaced') return this.structUnplacedPoints();
    if(this.structSelectedLocationId==null) return [];
    return (this.structPoints||[]).filter(p=>p.location_id===this.structSelectedLocationId);
  },
  structPeriodLabel(){
    const d=this._ovDefaultDates();
    return `Период: ${d.from} — ${d.to} (текущий месяц, как на Обзоре)`;
  },
  structNodeKindLabel(kind){
    return {source:'Ввод', panel:'Щит', junction:'Узел', load:'Нагрузка'}[kind]||kind;
  },
  structNodeName(nodeId){
    const n=(this.structNodes||[]).find(x=>x.id===nodeId);
    return n ? (n.name||n.code||('#'+nodeId)) : ('#'+nodeId);
  },
  structNodeEdges(nodeId){
    return (this.structEdges||[]).filter(e=>e.from_node_id===nodeId || e.to_node_id===nodeId);
  },
  structFeed(pointId){
    // "Чем питается / что питает" (§8.3): связи, где ЭТА точка назначена
    // измерением (primary_point_id), и соседние сегменты по уже
    // опубликованной схеме сети (черновики сюда не попадают — они ещё не
    // прошли проверку леса, см. topology/publish).
    const measuredEdges = (this.structEdges||[]).filter(e=>e.primary_point_id===pointId).map(edge=>{
      const fedBy = (this.structEdges||[]).filter(e2=>e2.to_node_id===edge.from_node_id)
        .map(e2=>({name: e2.name, code: e2.code}));
      const feeds = (this.structEdges||[]).filter(e2=>e2.from_node_id===edge.to_node_id)
        .map(e2=>({name: e2.name, code: e2.code}));
      return {edge, fedBy, feeds};
    });
    return {measuredEdges};
  },
  async openInspector(kind, id){
    if(id==null) return;
    if(this.tab!=='structurev2'){ this.tab='structurev2'; }
    if(!this.structInited){ this.structInited=true; await this._loadStructureLists(); }
    this.structInspector = {kind, id, data:null};
    this.structInspectorLoading = true; this.structInspectorError = null;
    try{
      if(kind==='point') await this._loadPointInspector(id);
      else if(kind==='group') await this._loadGroupInspector(id);
      else if(kind==='node') await this._loadNodeInspector(id);
      else if(kind==='edge') await this._loadEdgeInspector(id);
      else throw new Error('неизвестный тип объекта: '+kind);
    }catch(e){
      this.structInspectorError = 'Не удалось загрузить карточку: '+e.message;
    }finally{
      this.structInspectorLoading = false;
    }
  },
  closeInspector(){ this.structInspector=null; this.structInspectorError=null; },
  async _loadPointInspector(id){
    const period=this._ovDefaultDates();
    const tz=(Intl.DateTimeFormat().resolvedOptions().timeZone)||'UTC';
    const [pointR, snapR, bindingsR, groupsR] = await Promise.all([
      fetch('/api/v2/points/'+id),
      fetch('/api/v2/snapshot?point_ids='+id),
      fetch('/api/v2/points/'+id+'/bindings'),
      fetch('/api/v2/points/'+id+'/groups'),
    ]);
    if(!pointR.ok) throw new Error('точка не найдена (HTTP '+pointR.status+')');
    const point = await pointR.json();
    // location_path/meter_* берём из уже загруженного structure/points —
    // §8.3 требует, чтобы инспектор пользовался уже имеющимися ручками, а
    // не пересчитывал путь по местам заново на фронте.
    const structItem = (this.structPoints||[]).find(p=>p.point_id===id) || {};
    const data = Object.assign({}, point, {
      location_path: structItem.location_path,
      meter_device_id: structItem.meter_device_id,
      meter_controller_key: structItem.meter_controller_key,
      meter_serial: structItem.meter_serial,
    });
    const snap = snapR.ok ? (await snapR.json()).points : [];
    const bindings = bindingsR.ok ? (await bindingsR.json()) : [];
    const memberships = groupsR.ok ? (await groupsR.json()) : [];
    const groups = memberships.filter(m=>m.valid_to==null).map(m=>{
      const g=(this.structGroups||[]).find(x=>x.id===m.group_id);
      return {id: m.group_id, name: g?g.name:('#'+m.group_id)};
    });
    this.structInspector = {
      kind:'point', id, data,
      snapshot: (snap&&snap[0]) || null,
      bindings: (bindings||[]).slice().sort((a,b)=>b.valid_from-a.valid_from),
      groups,
      consumption: null,
    };
    // Расход за период — отдельным запросом, чтобы карточка сразу
    // показывала остальное, даже если metrics/query недоступен/медленный.
    try{
      const r = await fetch('/api/v2/metrics/query', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({mode:'measured', point_ids:[id], from:period.from, to:period.to, timezone:tz}),
      });
      if(r.ok) this.structInspector.consumption = await r.json();
    }catch(e){ /* не критично для остальной карточки */ }
  },
  async _loadGroupInspector(id){
    // §8.3: у группы вместо атрибутов прибора — состав и сумма/качество.
    const period=this._ovDefaultDates();
    const tz=(Intl.DateTimeFormat().resolvedOptions().timeZone)||'UTC';
    const [groupR, membersR] = await Promise.all([
      fetch('/api/v2/groups/'+id),
      fetch('/api/v2/groups/'+id+'/effective-members'),
    ]);
    if(!groupR.ok) throw new Error('группа не найдена (HTTP '+groupR.status+')');
    const data = await groupR.json();
    const membersResp = membersR.ok ? await membersR.json() : {points:[]};
    const members = membersResp.points || [];
    this.structInspector = {kind:'group', id, data, members, sum:null};
    if(members.length>0){
      try{
        const r = await fetch('/api/v2/metrics/query', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({mode:'sum', point_ids:members.map(m=>m.point_id), from:period.from, to:period.to, timezone:tz}),
        });
        if(r.ok) this.structInspector.sum = await r.json();
      }catch(e){ /* сумма необязательна для остальной карточки */ }
    }
  },
  async _loadNodeInspector(id){
    const r = await fetch('/api/v2/topology/nodes/'+id);
    if(!r.ok) throw new Error('узел не найден (HTTP '+r.status+')');
    const data = await r.json();
    this.structInspector = {kind:'node', id, data};
  },
  async _loadEdgeInspector(id){
    const r = await fetch('/api/v2/topology/edges/'+id);
    if(!r.ok) throw new Error('связь не найдена (HTTP '+r.status+')');
    const data = await r.json();
    this.structInspector = {kind:'edge', id, data};
  },

  async openPlanV2Tab(){
    if(!_planV2Map) this.initPlanV2Map();
    if(!this.planV2Inited){
      this.planV2Inited=true;
      await this.loadPlanV2List();
    }
    this.$nextTick(()=>{ if(_planV2Map) _planV2Map.invalidateSize(); });
  },
  async loadPlanV2List(){
    this.planV2Loading=true;
    try{
      const r=await fetch('/api/v2/plans');
      const d=await r.json();
      this.planV2Plans=Array.isArray(d)?d:[];
      if(this.planV2Plans.length>0 && !this.planV2CurrentId){
        await this.selectPlanV2(this.planV2Plans[0].id);
      }
    }catch(e){ console.error(e); }
    this.planV2Loading=false;
  },
  async selectPlanV2(id){
    if(!id) return;
    // Переключение плана с несохранённым черновиком отменяет черновик —
    // черновик привязан к конкретному плану и его canvas_revision, нести
    // его на другой план бессмысленно и опасно (см. §7.3).
    if(this.planV2PendingCount()>0){
      this.showToast('Черновик изменений отменён при смене плана', false);
    }
    this._planV2ResetDraft();
    this.planV2CurrentId=id;
    this.planV2SelectedItem=null;
    this.planV2SelectedEdgeView=null;
    this.planV2Placing=false;
    try{
      const r=await fetch('/api/v2/plans/'+id);
      if(!r.ok){ this.showToast('Не удалось загрузить план v2', false); return; }
      this.planV2Current=await r.json();
    }catch(e){ console.error(e); return; }
    this._planV2RenderBase();
  },
  _planV2ResetDraft(){
    this.planV2Draft={items:{}, edges:{}};
    this.planV2History=[]; this.planV2Future=[];
  },
  _planV2EffectiveDims(plan){
    // §7.2: у floor — размеры изображения, у single_line без картинки —
    // логический холст (canvas_width/height). Та же логика, что
    // PlanV2.effective_width/height в plan_service_v2.py.
    if(plan.image_width && plan.image_height) return [plan.image_width, plan.image_height];
    return [plan.canvas_width||2000, plan.canvas_height||1200];
  },
  _planV2XyToLatLng(x, y, height){
    return [height - y, x];
  },
  planV2ItemColor(kind){ return _planV2KindColor(kind); },
  planV2PendingCount(){
    return Object.keys(this.planV2Draft.items).length + Object.keys(this.planV2Draft.edges).length;
  },
  planV2NodeLikeItems(){
    return this._planV2EffectiveItems().filter(it=>it.kind==='node'||it.kind==='port');
  },

  // --- слияние сервер+черновик для отрисовки/списков (§7.3) ---
  _planV2EffectiveItems(){
    if(!this.planV2Current) return [];
    const draft=this.planV2Draft.items;
    const out=[];
    (this.planV2Current.items||[]).forEach(it=>{
      const rec=draft[String(it.id)];
      if(rec && rec.op==='remove') return;
      out.push(rec && rec.op==='upsert' ? {...it, ...rec, id:it.id} : it);
    });
    Object.keys(draft).forEach(key=>{
      if(!key.startsWith('new:')) return;
      const rec=draft[key];
      if(rec.op==='upsert') out.push({...rec, id:key});
    });
    return out;
  },
  _planV2EffectiveEdgeViews(){
    if(!this.planV2Current) return [];
    const draft=this.planV2Draft.edges;
    const out=[];
    (this.planV2Current.edges||[]).forEach(v=>{
      const rec=draft[String(v.id)];
      if(rec && rec.op==='remove') return;
      out.push(rec && rec.op==='upsert' ? {...v, ...rec, id:v.id} : v);
    });
    Object.keys(draft).forEach(key=>{
      if(!key.startsWith('newedge:')) return;
      const rec=draft[key];
      if(rec.op==='upsert') out.push({...rec, id:key});
    });
    return out;
  },

  // --- undo/redo (§7.3): снимок черновика ДО мутации кладётся в
  // History, Future очищается при каждом новом действии (обычная
  // семантика undo-стека — "вернуть" доступно только сразу после
  // "отменить", не после произвольного нового действия). ---
  _planV2PushHistory(){
    this.planV2History.push(JSON.parse(JSON.stringify(this.planV2Draft)));
    if(this.planV2History.length>50) this.planV2History.shift();
    this.planV2Future=[];
  },
  planV2Undo(){
    if(!this.planV2History.length) return;
    this.planV2Future.push(JSON.parse(JSON.stringify(this.planV2Draft)));
    this.planV2Draft=this.planV2History.pop();
    this.planV2SelectedItem=null; this.planV2SelectedEdgeView=null;
    this._planV2RenderItems();
  },
  planV2Redo(){
    if(!this.planV2Future.length) return;
    this.planV2History.push(JSON.parse(JSON.stringify(this.planV2Draft)));
    this.planV2Draft=this.planV2Future.pop();
    this.planV2SelectedItem=null; this.planV2SelectedEdgeView=null;
    this._planV2RenderItems();
  },
  planV2RequestDiscard(){
    if(this.planV2PendingCount()===0) return;
    this.planV2ConfirmDiscard=true;
  },
  planV2ConfirmDiscardNow(){
    this.planV2ConfirmDiscard=false;
    this._planV2ResetDraft();
    this.planV2SelectedItem=null; this.planV2SelectedEdgeView=null;
    this._planV2RenderItems();
  },

  // --- редактирование: перетаскивание, добавление, удаление ---
  togglePlanV2Edit(){
    this.planV2EditMode=!this.planV2EditMode;
    this.planV2Placing=false;
    if(this.planV2EditMode && !this.planV2PickersLoaded){
      this.planV2PickersLoaded=true;
      this._planV2LoadPickers();
    }
    this._planV2RenderItems();
  },
  async _planV2LoadPickers(){
    try{
      const [pts, locs, nodes, edgesDraft, edgesPub] = await Promise.all([
        fetch('/api/v2/points').then(r=>r.json()),
        fetch('/api/v2/locations').then(r=>r.json()),
        fetch('/api/v2/topology/nodes').then(r=>r.json()),
        fetch('/api/v2/topology/edges?state=draft').then(r=>r.json()),
        fetch('/api/v2/topology/edges?state=published').then(r=>r.json()),
      ]);
      this.planV2Points=Array.isArray(pts)?pts:[];
      this.planV2Locations=Array.isArray(locs)?locs:[];
      this.planV2Nodes=Array.isArray(nodes)?nodes:[];
      const byId={};
      [...(Array.isArray(edgesPub)?edgesPub:[]), ...(Array.isArray(edgesDraft)?edgesDraft:[])]
        .forEach(e=>{ byId[e.id]=e; });
      this.planV2Edges=Object.values(byId);
    }catch(e){ console.error('planV2: не удалось загрузить справочники для редактирования', e); }
  },
  // Собирает базовые (сохраняемые) поля элемента — источник истины для
  // ОБЯЗАТЕЛЬНОГО переноса kind/ссылок/подписи в черновик при первом
  // касании существующего элемента (drag), чтобы не потерять их при
  // отправке item_ops (сервер ждёт их в каждом upsert, см.
  // save_plan_layout в plan_service_v2.py).
  _planV2BaseItemFields(effItem){
    return {kind:effItem.kind, point_id:effItem.point_id ?? null,
            location_id:effItem.location_id ?? null, group_id:effItem.group_id ?? null,
            node_id:effItem.node_id ?? null, target_plan_id:effItem.target_plan_id ?? null,
            label:effItem.label ?? null};
  },
  // Обратное преобразование leaflet [lat,lng] -> plan_v2 {x,y} (инверсия
  // _planV2XyToLatLng: [height-y, x] -> [lat,lng]). Общий хелпер для всех
  // мест, где карта отдаёт координаты кликом/перетаскиванием/рисованием
  // линии (плейсмент item, drag item, рисование waypoints edge_view).
  _planV2LatLngToXy(latlng, height){
    return [latlng.lng, height-latlng.lat];
  },
  _planV2OnItemDragEnd(effItem, latlng, height){
    this._planV2PushHistory();
    const key=String(effItem.id);
    const base=this.planV2Draft.items[key] && this.planV2Draft.items[key].op==='upsert'
      ? this.planV2Draft.items[key] : this._planV2BaseItemFields(effItem);
    const [x,y]=this._planV2LatLngToXy(latlng, height);
    this.planV2Draft.items[key]={...base, op:'upsert',
      geometry:{x,y}, coord_space:effItem.coord_space};
    this._planV2RenderItems();
  },
  planV2RemoveItem(effItem){
    if(!effItem) return;
    this._planV2PushHistory();
    const key=String(effItem.id);
    if(typeof effItem.id==='string' && effItem.id.startsWith('new:')){
      delete this.planV2Draft.items[key];
    }else{
      this.planV2Draft.items[key]={op:'remove'};
    }
    // Связи этого же черновика, ссылающиеся на убираемый элемент, теряют
    // смысл — убираем их из черновика тоже (уже сохранённые edge_views
    // сервер сам отвяжет по ON DELETE SET NULL при реальном удалении).
    Object.entries(this.planV2Draft.edges).forEach(([ek,erec])=>{
      if(erec.op==='upsert' && (erec.from_item_id===effItem.id || erec.to_item_id===effItem.id)){
        delete this.planV2Draft.edges[ek];
      }
    });
    if(this.planV2SelectedItem && this.planV2SelectedItem.id===effItem.id) this.planV2SelectedItem=null;
    this._planV2RenderItems();
  },
  planV2StartPlace(){
    if(!this.planV2AddKind) return;
    if(['point','location','node','port'].includes(this.planV2AddKind) && !this.planV2AddRefId){
      this.showToast('Выберите объект для размещения', false); return;
    }
    this.planV2Placing=true;
  },
  planV2CancelPlace(){ this.planV2Placing=false; },
  _planV2OnMapClick(e){
    // Пока идёт рисование линии edge_view (leaflet-geoman) — клики по
    // карте принадлежат geoman (расстановка вершин линии), а не плейсменту
    // новых item; иначе один и тот же клик ставил бы ещё и метку.
    if(this.planV2DrawingEdgeKey!==null) return;
    if(!this.planV2Placing || !this.planV2Current) return;
    const [W,H]=this._planV2EffectiveDims(this.planV2Current);
    const [x,y]=this._planV2LatLngToXy(e.latlng, H);
    if(x<0||x>W||y<0||y>H){ this.showToast('Точка вне границ плана', false); return; }
    const coordSpace=this.planV2Current.plan_kind==='floor' ? 'image_px_xy_v2' : 'canvas_xy_v2';
    this._planV2PushHistory();
    const key='new:'+(++this.planV2NewItemSeq);
    const rec={op:'upsert', kind:this.planV2AddKind, geometry:{x,y}, coord_space:coordSpace,
               label:this.planV2AddLabel||null, point_id:null, location_id:null,
               group_id:null, node_id:null, target_plan_id:null};
    if(this.planV2AddKind==='point') rec.point_id=this.planV2AddRefId;
    if(this.planV2AddKind==='location') rec.location_id=this.planV2AddRefId;
    if(this.planV2AddKind==='node') rec.node_id=this.planV2AddRefId;
    if(this.planV2AddKind==='port'){
      rec.node_id=this.planV2AddRefId;
      if(this.planV2AddTargetPlanId) rec.target_plan_id=this.planV2AddTargetPlanId;
    }
    this.planV2Draft.items[key]=rec;
    this.planV2Placing=false;
    this.planV2AddKind=''; this.planV2AddRefId=''; this.planV2AddLabel=''; this.planV2AddTargetPlanId='';
    this._planV2RenderItems();
    this.showToast('Элемент добавлен в черновик', true);
  },

  // --- edge_views: связи на плане (§7.1/§7.3) ---
  planV2ToggleAddingEdgeView(){
    this.planV2AddingEdgeView=!this.planV2AddingEdgeView;
    this.planV2EdgeForm={edgeId:'', fromItemKey:'', toItemKey:''};
  },
  _planV2ParseItemKey(key){
    if(!key) return null;
    return key.startsWith('new:') ? key : Number(key);
  },
  planV2SaveEdgeDraft(){
    const f=this.planV2EdgeForm;
    if(!f.edgeId){ this.showToast('Выберите связь (edge)', false); return; }
    this._planV2PushHistory();
    const key='newedge:'+(++this.planV2NewEdgeSeq);
    this.planV2Draft.edges[key]={
      op:'upsert', edge_id:Number(f.edgeId),
      from_item_id:this._planV2ParseItemKey(f.fromItemKey),
      to_item_id:this._planV2ParseItemKey(f.toItemKey),
      view_kind:'structural', waypoints:null,
    };
    this.planV2AddingEdgeView=false;
    this._planV2RenderItems();
    this.showToast('Связь добавлена в черновик', true);
  },
  planV2RemoveEdgeView(view){
    if(!view) return;
    this._planV2PushHistory();
    const key=String(view.id);
    if(typeof view.id==='string' && view.id.startsWith('newedge:')){
      delete this.planV2Draft.edges[key];
    }else{
      this.planV2Draft.edges[key]={op:'remove'};
    }
    if(this.planV2SelectedEdgeView && this.planV2SelectedEdgeView.id===view.id) this.planV2SelectedEdgeView=null;
    this._planV2RenderItems();
  },

  // --- сохранение layout: A35 (ТЗ §13) — 409 при устаревшей
  // canvas_revision, БЕЗ изменений на сервере, черновик остаётся на
  // клиенте (пользователь явно решает: обновить план или остаться). ---
  _planV2BuildLayoutPayload(){
    const itemOps=[]; const idxByKey={};
    Object.entries(this.planV2Draft.items).forEach(([key,rec])=>{
      if(rec.op==='remove'){ itemOps.push({op:'remove', id:Number(key)}); return; }
      const isNew=key.startsWith('new:');
      const entry={op:'upsert', geometry:rec.geometry, coord_space:rec.coord_space,
                   label:rec.label ?? null};
      if(!isNew){ entry.id=Number(key); }
      else{
        entry.kind=rec.kind;
        if(rec.point_id!=null) entry.point_id=rec.point_id;
        if(rec.location_id!=null) entry.location_id=rec.location_id;
        if(rec.group_id!=null) entry.group_id=rec.group_id;
        if(rec.node_id!=null) entry.node_id=rec.node_id;
        if(rec.target_plan_id!=null) entry.target_plan_id=rec.target_plan_id;
      }
      idxByKey[key]=itemOps.length;
      itemOps.push(entry);
    });
    const resolveRef=(ref)=>{
      if(ref==null) return null;
      if(typeof ref==='string' && ref.startsWith('new:')){
        if(!(ref in idxByKey)) throw new Error('Элемент для связи ещё не размещён в этом черновике');
        return '$'+idxByKey[ref];
      }
      return Number(ref);
    };
    const edgeViewOps=[];
    Object.entries(this.planV2Draft.edges).forEach(([key,rec])=>{
      if(rec.op==='remove'){ edgeViewOps.push({op:'remove', id:Number(key)}); return; }
      const entry={op:'upsert', edge_id:rec.edge_id,
                   from_item_id:resolveRef(rec.from_item_id), to_item_id:resolveRef(rec.to_item_id),
                   waypoints:rec.waypoints ?? null, view_kind:rec.view_kind || 'structural'};
      if(!key.startsWith('newedge:')) entry.id=Number(key);
      edgeViewOps.push(entry);
    });
    return {expected_revision:this.planV2Current.canvas_revision,
            item_ops:itemOps, edge_view_ops:edgeViewOps};
  },
  async planV2SaveLayout(){
    if(!this.planV2Current || this.planV2PendingCount()===0) return;
    let payload;
    try{ payload=this._planV2BuildLayoutPayload(); }
    catch(e){ this.showToast(String(e.message||e), false); return; }
    this.planV2Saving=true;
    try{
      const r=await fetch('/api/v2/plans/'+this.planV2Current.id+'/layout', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body:JSON.stringify(payload),
      });
      if(r.status===409){
        this.planV2RevisionConflict=true;
        this.planV2Saving=false;
        return;
      }
      if(!r.ok){
        const err=await r.json().catch(()=>({}));
        this.showToast('Ошибка сохранения: '+(err.error && err.error.message || r.status), false);
        this.planV2Saving=false;
        return;
      }
      this._planV2ResetDraft();
      this.planV2SelectedItem=null; this.planV2SelectedEdgeView=null;
      await this.selectPlanV2(this.planV2Current.id);
      this.showToast('Изменения плана сохранены', true);
    }catch(e){
      this.showToast('Ошибка сети при сохранении: '+e, false);
    }
    this.planV2Saving=false;
  },
  planV2ConfirmDiscardReload(){
    this.planV2RevisionConflict=false;
    const id=this.planV2Current.id;
    this._planV2ResetDraft();
    this.selectPlanV2(id);
  },

  // --- edge_views: рисование ломаной (waypoints) через leaflet-geoman ---
  // (по образцу v1 startZoneDraw/_planOnPmCreate/saveZoneDraw/cancelZoneDraw,
  // см. выше — та же связка enableDraw/pm:create/getLatLngs). Один и тот же
  // приём для существующего edge_view (ключ — String(id), число) и ещё не
  // сохранённого черновичного (ключ 'newedge:N').
  _planV2BaseEdgeFields(view){
    return {edge_id:view.edge_id, from_item_id:view.from_item_id ?? null,
            to_item_id:view.to_item_id ?? null, view_kind:view.view_kind || 'structural',
            waypoints:view.waypoints ?? null};
  },
  _planV2CleanupDrawLayer(){
    if(_planV2DrawLayer){ try{_planV2Map.removeLayer(_planV2DrawLayer);}catch(e){} _planV2DrawLayer=null; }
  },
  planV2StartDrawWaypoints(view){
    if(!view || this.planV2DrawingEdgeKey!==null || !_planV2Map || !this.planV2EditMode) return;
    this.planV2DrawingEdgeKey=String(view.id);
    this.planV2HasPendingEdgeDraw=false;
    _planV2Map.pm.enableDraw('Line', {snappable:true, finishOn:'dblclick'});
  },
  _planV2OnPmCreate(e){
    if(e.shape==='Line' && this.planV2DrawingEdgeKey!==null){
      if(_planV2DrawLayer){ try{_planV2Map.removeLayer(_planV2DrawLayer);}catch(err){} }
      _planV2DrawLayer=e.layer;
      if(_planV2DrawLayer.pm) _planV2DrawLayer.pm.enable({allowSelfIntersection:false});
      this.planV2HasPendingEdgeDraw=true;
    }
  },
  planV2SaveDrawnWaypoints(){
    if(!_planV2DrawLayer || this.planV2DrawingEdgeKey===null || !this.planV2Current) return;
    const key=this.planV2DrawingEdgeKey;
    const view=this._planV2EffectiveEdgeViews().find(v=>String(v.id)===key);
    if(!view){ this.planV2CancelDrawWaypoints(); return; }
    const latlngs=_planV2DrawLayer.getLatLngs();
    if(latlngs.length<2){ this.showToast('Линия должна иметь минимум 2 точки', false); return; }
    const [,H]=this._planV2EffectiveDims(this.planV2Current);
    const waypoints=latlngs.map(ll=>this._planV2LatLngToXy(ll, H));
    this._planV2PushHistory();
    const base=this.planV2Draft.edges[key] && this.planV2Draft.edges[key].op==='upsert'
      ? this.planV2Draft.edges[key] : this._planV2BaseEdgeFields(view);
    this.planV2Draft.edges[key]={...base, op:'upsert', waypoints};
    if(_planV2Map && _planV2Map.pm) _planV2Map.pm.disableDraw('Line');
    this._planV2CleanupDrawLayer();
    this.planV2DrawingEdgeKey=null; this.planV2HasPendingEdgeDraw=false;
    this._planV2RenderItems();
    this.showToast('Линия связи обновлена в черновике', true);
  },
  planV2CancelDrawWaypoints(){
    if(_planV2Map && _planV2Map.pm) _planV2Map.pm.disableDraw('Line');
    this._planV2CleanupDrawLayer();
    this.planV2DrawingEdgeKey=null;
    this.planV2HasPendingEdgeDraw=false;
  },
  // Сбросить нарисованную линию — вернуться к прямой между метками
  // (waypoints:null, как у edge_view без ручного рисования).
  planV2ClearWaypoints(view){
    if(!view || !view.waypoints) return;
    this._planV2PushHistory();
    const key=String(view.id);
    const base=this.planV2Draft.edges[key] && this.planV2Draft.edges[key].op==='upsert'
      ? this.planV2Draft.edges[key] : this._planV2BaseEdgeFields(view);
    this.planV2Draft.edges[key]={...base, op:'upsert', waypoints:null};
    this._planV2RenderItems();
  },

  // --- отрисовка ---
  _planV2ItemLayerFor(item, height){
    if(item.coord_space!=='image_px_xy_v2' && item.coord_space!=='canvas_xy_v2'){
      console.warn('planV2: неподдерживаемый coord_space на элементе', item);
      return null;
    }
    const g=item.geometry;
    if(!g || typeof g.x!=='number' || typeof g.y!=='number') return null;
    const latlng=this._planV2XyToLatLng(g.x, g.y, height);
    const color=_planV2KindColor(item.kind);
    const layer=L.circleMarker(latlng, {radius:8, color, fillColor:color, fillOpacity:.7, weight:2});
    layer.on('click', (e)=>{
      if(e.originalEvent) L.DomEvent.stopPropagation(e.originalEvent);
      this.planV2SelectedEdgeView=null;
      this.planV2SelectedItem=item;
    });
    // Перетаскивание — через leaflet-geoman (см. комментарий у секции
    // "План v2" выше): L.circleMarker не умеет draggable:true нативно.
    if(this.planV2EditMode && layer.pm){
      layer.pm.enableLayerDrag();
      layer.on('pm:dragend', ()=>{
        this._planV2OnItemDragEnd(item, layer.getLatLng(), height);
      });
    }
    return layer;
  },
  _planV2RenderItems(){
    if(!_planV2Map || !this.planV2Current) return;
    _planV2ItemLayers.forEach(layer=>{ try{_planV2Map.removeLayer(layer);}catch(e){} });
    _planV2ItemLayers.clear();
    _planV2EdgeLayers.forEach(layer=>{ try{_planV2Map.removeLayer(layer);}catch(e){} });
    _planV2EdgeLayers.clear();

    const [,H]=this._planV2EffectiveDims(this.planV2Current);
    const items=this._planV2EffectiveItems();
    const itemById={};
    items.forEach(it=>{
      itemById[String(it.id)]=it;
      const layer=this._planV2ItemLayerFor(it, H);
      if(layer){ layer.addTo(_planV2Map); _planV2ItemLayers.set(String(it.id), layer); }
    });

    this._planV2EffectiveEdgeViews().forEach(v=>{
      let latlngs=[];
      if(v.waypoints && v.waypoints.length){
        latlngs=v.waypoints.map(([x,y])=>this._planV2XyToLatLng(x,y,H));
      }else{
        const fromIt=v.from_item_id!=null ? itemById[String(v.from_item_id)] : null;
        const toIt=v.to_item_id!=null ? itemById[String(v.to_item_id)] : null;
        if(fromIt && fromIt.geometry && toIt && toIt.geometry){
          latlngs=[this._planV2XyToLatLng(fromIt.geometry.x, fromIt.geometry.y, H),
                   this._planV2XyToLatLng(toIt.geometry.x, toIt.geometry.y, H)];
        }
      }
      if(latlngs.length<2) return;
      const line=L.polyline(latlngs, {color:'#e0995f', weight:3,
                                       dashArray:v.view_kind==='cable_route'?null:'6,4'});
      line.on('click', (e)=>{
        if(e.originalEvent) L.DomEvent.stopPropagation(e.originalEvent);
        this.planV2SelectedItem=null;
        this.planV2SelectedEdgeView=v;
      });
      line.addTo(_planV2Map);
      _planV2EdgeLayers.set(String(v.id), line);
    });
  },
  _planV2RenderBase(){
    if(!_planV2Map || !this.planV2Current) return;
    if(_planV2ImageLayer){ try{_planV2Map.removeLayer(_planV2ImageLayer);}catch(e){} _planV2ImageLayer=null; }

    const pc=this.planV2Current;
    const [W,H]=this._planV2EffectiveDims(pc);
    const bounds=[[0,0],[H,W]];
    if(pc.plan_kind==='floor'){
      _planV2ImageLayer=L.imageOverlay('/api/v2/plans/'+pc.id+'/image', bounds).addTo(_planV2Map);
    }else{
      _planV2ImageLayer=L.rectangle(bounds, {color:_planCssVar('--line'), weight:1, fill:false, dashArray:'4,4'}).addTo(_planV2Map);
    }
    _planV2Map.fitBounds(bounds);
    this._planV2RenderItems();
  },
  planV2ItemKindLabel(kind){
    const labels={point:'Точка учёта', location:'Место', group:'Группа',
                  node:'Узел сети', port:'Переход на другой план', annotation:'Подпись'};
    return labels[kind]||kind;
  },
  // ТЗ §8.3: "тот же инспектор... открывается идентично из плана, дерева,
  // отчёта и списка проблем" — точка/узел/группа плана открывают общий
  // openInspector (см. <script> секцию Структура); у place/port/annotation
  // своего инспектора нет (это координаты на плане, не предмет учёта/сети).
  planV2ItemInspectorTarget(item){
    if(!item) return null;
    if(item.kind==='point' && item.point_id!=null) return {kind:'point', id:item.point_id};
    if(item.kind==='node' && item.node_id!=null) return {kind:'node', id:item.node_id};
    if(item.kind==='group' && item.group_id!=null) return {kind:'group', id:item.group_id};
    return null;
  },
  openInspectorForPlanItem(item){
    const t=this.planV2ItemInspectorTarget(item);
    if(t) this.openInspector(t.kind, t.id);
  },

  showToast(msg, ok=true){
    clearTimeout(this._toastTimer);
    this.toast={msg,ok};
    this._toastTimer=setTimeout(()=>{ this.toast=null; },3000);
  },
}; }

// ---- План объекта (ТЗ v0.11.0): состояние карты Leaflet — ВНЕ
// реактивности Alpine (§3.4 ТЗ). Это обычные переменные модуля, а не
// свойства data() компонента: L.Map, завёрнутый в реактивный Proxy
// Alpine, ведёт себя непредсказуемо (Leaflet держит собственный DOM и
// свои внутренние структуры, которые Proxy-обёртка ломает).
let _planMap=null;
let _planImageLayer=null;
const _planZoneLayers=new Map();   // group_id -> {layer, popup, zone}
const _planLinkLayers=new Map();   // link_id -> polyline
let _planDrawLayer=null;           // временный слой контура во время рисования зоны
let _planOpenPopupGroupId=null;    // группа последнего открытого попапа (для ссылки в нём)
let _planV2Map=null;
let _planV2ImageLayer=null;
const _planV2ItemLayers=new Map();   // item_id (String) -> layer
const _planV2EdgeLayers=new Map();   // edge_view_id (String) -> polyline
let _planV2DrawLayer=null;           // временный слой линии во время рисования waypoints edge_view
function _planV2KindColor(kind){
  const colors={point:'#3dd6c0', location:'#8a7cff', group:'#f0a83c',
                node:'#4fa8f5', port:'#e05fae', annotation:'#9aa0a8'};
  return colors[kind] || '#3dd6c0';
}

function _planCssVar(name){
  try{
    const v=getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    return v||'#3dd6c0';
  }catch(e){ return '#3dd6c0'; }
}
function _planEscapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>(
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}
function _planLinkColor(state){
  return ({ok:_planCssVar('--ok'), warn:_planCssVar('--warn'),
           danger:_planCssVar('--err')})[state] || _planCssVar('--accent2');
}

function lsGet(k,def){ try{ return localStorage.getItem(k)||def; }catch(e){ return def; } }
function lsGetJSON(k,def){
  try{ const v=localStorage.getItem(k); return v?JSON.parse(v):def; }catch(e){ return def; }
}
// Промежуточные (не терминальные) состояния самообновления — совпадают
// с ACTIVE_STATES в wb_energy_meter/updater.py (ТЗ v0.9.0).
const UPD_ACTIVE_STATES=['starting','downloading','installing','verifying','rolling_back'];
// Фолбэк-список категорий каналов на случай, если /api/channels/dictionary
// ещё не успел загрузиться (модалка деталей не должна из-за этого падать).
const FALLBACK_CATEGORIES=[
  {id:'voltage',label:'Напряжение',open:false},
  {id:'current',label:'Ток',open:false},
  {id:'power',label:'Мощность',open:false},
  {id:'energy',label:'Энергия',open:false},
  {id:'quality',label:'Качество сети',open:false},
  {id:'service',label:'Служебные',open:false},
  {id:'other',label:'Прочее',open:false},
];
function dtLocal(d){
  const p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}
function fmtTime(ts){
  return new Date(ts*1000).toLocaleString('ru-RU',
    {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
}
function fmtHour(ts){
  const d=new Date(ts*1000);
  return d.toLocaleString('ru-RU',
    {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
}
function fmtSeconds(s){
  s=Math.round(s); if(s<0) return '—';
  if(s<60) return s+'с';
  if(s<3600){ return Math.floor(s/60)+'мин'; }
  if(s<86400){ const h=Math.floor(s/3600),m=Math.floor((s%3600)/60);
    return h+'ч'+(m?' '+m+'мин':''); }
  const d=Math.floor(s/86400),h=Math.floor((s%86400)/3600);
  return d+'д'+(h?' '+h+'ч':'');
}
